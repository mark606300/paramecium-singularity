    // 哈伯球：同心的退行軌跡向外展開；沒有實體牆，也不畫成黑洞視界。
    const aura=colorOverride||'#b8fff0', phase=reduce?.45:(t/4200)%1;
    cx.save(); cx.globalAlpha=.55+.45*detail;
    const halo=cx.createRadialGradient(0,0,rh*.16,0,0,rw*3.05);
    halo.addColorStop(0,hexA('#effffb',.2)); halo.addColorStop(.3,hexA(aura,.13));
    halo.addColorStop(.72,hexA('#8db9ff',.045)); halo.addColorStop(1,hexA(aura,0));
    cx.fillStyle=halo; cx.beginPath(); cx.ellipse(0,0,rw*3.08,rh*3.75,0,0,6.2832); cx.fill();
    cx.shadowColor=aura; cx.shadowBlur=22*detail; cx.lineCap='round';
    for (let i=0;i<(detail>.45?4:2);i++){
      const q=(phase+i/4)%1, rr=rw*(1.15+q*1.35);
      cx.strokeStyle=hexA(aura,.1+(1-q)*.36); cx.lineWidth=2.65-q*.72;
      cx.beginPath(); cx.ellipse(0,0,rr,rr*(rh/rw)*1.55,0,0,6.2832); cx.stroke();
    }
    if (detail>.55){
      cx.rotate(reduce?0:t/22000); cx.setLineDash([4,10]); cx.strokeStyle=hexA(aura,.27); cx.lineWidth=1.6;
      cx.beginPath(); cx.ellipse(0,0,rw*2.35,rh*2.85,.28,0,6.2832); cx.stroke(); cx.setLineDash([]);
    }
    cx.restore();
    return;
  }

  // 微行星之後不再共用一枚薄虛線環。每個天體階段保留自己的
  // 物理語彙：塵盤、磁層、日冕、簡併場與黑洞透鏡依序接棒。
  const aura=colorOverride||naturalAuraColor(idx);
  const breathe=reduce?1:.94+Math.sin(t/(1750+idx*37)+idx*.61)*.06;
  const haloScale={15:2.12,16:2.48,17:2.2,18:2.28,19:2.72,20:3.18,21:2.44,22:2.58,23:2.68,24:2.5}[idx]||2.1;
  const haloAlpha={15:.085,16:.12,17:.105,18:.13,19:.17,20:.14,21:.145,22:.15,23:.16,24:.12}[idx]||.1;
  cx.save(); cx.globalAlpha=breathe*(.55+.45*detail); cx.lineCap='round';
  const haze=cx.createRadialGradient(0,0,rh*.12,0,0,rw*haloScale);
  haze.addColorStop(0,hexA(idx===24?'#ffe6b5':aura,haloAlpha));
  haze.addColorStop(.44,hexA(aura,haloAlpha*.5));
  haze.addColorStop(1,hexA(aura,0));
  cx.fillStyle=haze; cx.beginPath(); cx.ellipse(0,0,rw*haloScale,rh*(haloScale+0.48),0,0,6.2832); cx.fill();
  cx.shadowColor=aura; cx.shadowBlur=(idx>=19?19:15)*detail;

  if (idx===15){
    // 原行星：不穩定的塵埃吸積盤與分段胚胎軌道。
    cx.rotate(reduce?-.22:t/21000-.22);
    for (let i=0;i<3;i++){
      cx.setLineDash([10+i*3,8+i*2]); cx.strokeStyle=hexA(aura,.2-i*.035); cx.lineWidth=1.25+i*.42;
      cx.beginPath(); cx.ellipse(0,0,rw*(1.35+i*.28),rh*(1.7+i*.24),i*.24,.22+i*.4,5.72-i*.28); cx.stroke();
    }
    cx.setLineDash([]); cx.fillStyle=hexA('#fff0c6',.48);
    for (let i=0;i<10;i++){
      const a=i*2.399+t/9000, rr=rw*(1.18+(i%4)*.19);
      cx.beginPath(); cx.arc(Math.cos(a)*rr,Math.sin(a)*rr*(rh/rw)*1.45,1+(i%3)*.42,0,6.2832); cx.fill();
    }
  } else if (idx===16){
    // 氣態巨行星：寬磁層、極區極光與傾斜環帶。
    cx.save(); cx.rotate(-.2);
    for (const s of [-1,1]){
      cx.strokeStyle=hexA(s>0?'#9fd8ff':aura,.25); cx.lineWidth=2.2; cx.shadowBlur=20*detail;
      cx.beginPath(); cx.moveTo(-rw*.92,s*rh*.7);
      cx.bezierCurveTo(-rw*1.9,s*rh*2.7,rw*1.9,s*rh*2.7,rw*.92,s*rh*.7); cx.stroke();
    }
    cx.strokeStyle=hexA('#fff3c8',.32); cx.lineWidth=3.1;
    cx.beginPath(); cx.ellipse(0,0,rw*1.72,rh*.92,.18,0,6.2832); cx.stroke();
    cx.strokeStyle=hexA(aura,.2); cx.lineWidth=1.35;
    cx.beginPath(); cx.ellipse(0,0,rw*2.08,rh*1.18,.18,0,6.2832); cx.stroke(); cx.restore();
  } else if (idx===17){
    // 褐矮星：沒有穩定氫融合日冕；暗琥珀餘燼由不對稱風暴雲與微弱雷弧包圍。
    cx.save(); cx.rotate(reduce?-.12:t/18500-.12); cx.shadowColor='#d69b72'; cx.shadowBlur=10*detail;
    const storms=detail>.45?5:3;
    for (let i=0;i<storms;i++){
      const a=i/storms*6.2832+(i%2)*.31, span=.34+(i%3)*.12;
      cx.setLineDash([5+i*2,7+i]); cx.strokeStyle=hexA(i%2?'#8e5a49':aura,.2+(i%3)*.035); cx.lineWidth=1.3+(i%2)*.45;
      cx.beginPath(); cx.ellipse(0,0,rw*(1.22+(i%2)*.2),rh*(1.52+(i%3)*.16),i*.23,a-span,a+span); cx.stroke();
    }
    cx.setLineDash([]); cx.strokeStyle=hexA('#f4ba7e',.24); cx.lineWidth=1.05;
    for (const s of [-1,1]){
      cx.beginPath(); cx.moveTo(s*rw*.74,-rh*.9); cx.quadraticCurveTo(s*rw*1.32,0,s*rw*.68,rh*.86); cx.stroke();
    }
    cx.restore();
  } else if (idx>=18&&idx<=20){
    // 真正恆星：紅矮星、主序星、紅超巨星各以不同尺度的磁拱與日冕接棒。
    const starLevel=idx-18, loops=[6,7,9][starLevel], reach=[1.58,1.9,2.38][starLevel];
    const hot=['#ff8b68','#fff5d7','#ff7352'][starLevel];
    cx.shadowColor=hot; cx.shadowBlur=(12+starLevel*4)*detail;
    for (let i=0;i<loops;i++){
      const a=i/loops*6.2832+(reduce?0:t/(16500-starLevel*1700));
      const span=.48+starLevel*.06, A=rimPoint(a-span,rw,rh), B=rimPoint(a+span,rw,rh);
      cx.strokeStyle=hexA(i%3===0?'#fff4dc':hot,.2+starLevel*.045-(i%2)*.035);
      cx.lineWidth=1.35+starLevel*.32+(i%3===0?.45:0);
      cx.beginPath(); cx.moveTo(A.ex,A.ey);
      cx.quadraticCurveTo(Math.cos(a)*rw*reach,Math.sin(a)*rh*(reach+1.05),B.ex,B.ey); cx.stroke();
    }
    if (idx>=19){
      cx.strokeStyle=hexA('#fff8e9',idx===19?.34:.24); cx.lineWidth=idx===19?3.1:2.6;
      cx.beginPath(); cx.ellipse(0,0,rw*(idx===19?1.42:1.8),rh*(idx===19?1.72:2.35),0,0,6.2832); cx.stroke();
    }
  } else if (idx===21){
    // 白矮星：清楚、堅硬的簡併晶格，亮而不膨脹。
    cx.rotate(reduce?0:t/26000); cx.shadowColor='#e9fbff'; cx.shadowBlur=20*detail;
    for (let i=0;i<4;i++){
      cx.strokeStyle=hexA(i%2?'#9fefff':aura,.3-i*.035); cx.lineWidth=2.25-i*.27;
      cx.beginPath(); cx.ellipse(0,0,rw*(1.2+i*.18),rh*(1.62+i*.2),i*.62,0,6.2832); cx.stroke();
    }
    cx.fillStyle='rgba(245,255,255,.72)';
    for (let i=0;i<8;i++){ const a=i/8*6.2832; cx.beginPath(); cx.arc(Math.cos(a)*rw*1.45,Math.sin(a)*rh*2.02,1.25,0,6.2832); cx.fill(); }
  } else if (idx===22){
    // 中子星：壓縮偶極場籠與赤道風環；燈塔束由 appendage 單一來源繪製。
    const axis='#cfe8ff';
    cx.save(); cx.rotate(reduce?.18:t/26000+.18); cx.shadowColor=axis; cx.shadowBlur=20*detail;
    for (let i=0;i<3;i++){
      cx.strokeStyle=hexA(i%2?axis:aura,.3-i*.035); cx.lineWidth=2.35-i*.22;
      cx.beginPath(); cx.ellipse(0,0,rw*(1.28+i*.2),rh*(1.72+i*.26),i*.48,0,6.2832); cx.stroke();
    }
    cx.strokeStyle=hexA('#9cd8ff',.36); cx.lineWidth=3.1;
    cx.beginPath(); cx.ellipse(0,0,rw*1.62,rh*.74,-.16,0,6.2832); cx.stroke();
    cx.restore();
  } else if (idx===23){
    // 夸克星尚無確立外觀：以薄電層與三味相位帶作神話化抽象，不冒充已觀測噴流。
    const phaseColors=['#78f3ff','#d69bff','#ffd37b'];
    cx.save(); cx.rotate(reduce?0:t/22000); cx.shadowBlur=19*detail; cx.lineCap='round';
    cx.strokeStyle=hexA('#f4ecff',.48); cx.lineWidth=1.15;
    cx.beginPath(); cx.ellipse(0,0,rw*1.18,rh*1.48,0,0,6.2832); cx.stroke();
    for (let i=0;i<3;i++){
      const a=i/3*6.2832;
      cx.shadowColor=phaseColors[i]; cx.strokeStyle=hexA(phaseColors[i],.34); cx.lineWidth=1.75+i*.25;
      cx.beginPath(); cx.ellipse(0,0,rw*(1.38+i*.16),rh*(1.72+i*.14),a*.16,a+.18,a+4.82); cx.stroke();
      cx.fillStyle=hexA(phaseColors[i],.74);
      cx.beginPath(); cx.arc(Math.cos(a)*rw*1.58,Math.sin(a)*rh*1.95,1.7+i*.18,0,6.2832); cx.fill();
    }
    cx.restore();
  } else if (idx===24){
    // 恆星黑洞：先以彎折背景光宣告透鏡，盤與陰影由 retinue 前後層接手。
    cx.shadowColor='#ffbd78'; cx.shadowBlur=18*detail;
    for (const s of [-1,1]){
      cx.strokeStyle=hexA(s>0?'#ffd7a1':aura,.28); cx.lineWidth=2.15;
      cx.beginPath(); cx.moveTo(-rw*1.72,s*rh*.6);
      cx.bezierCurveTo(-rw*.66,s*rh*2.7,rw*.56,s*rh*2.52,rw*1.7,s*rh*.48); cx.stroke();
      cx.strokeStyle=hexA('#fff2d4',.16); cx.lineWidth=1.05;
      cx.beginPath(); cx.moveTo(-rw*1.35,s*rh*1.2); cx.quadraticCurveTo(0,s*rh*3.15,rw*1.34,s*rh*1.08); cx.stroke();
    }
  }
  cx.setLineDash([]); cx.restore();
}

function naturalAuraColor(idx){
  if (idx===14) return '#79b99a';
  if (idx>=10 && idx<=13) return ({10:'#c8b8ff',11:'#ff3048',12:'#dcebb0',13:'#42e883'})[idx];
  return ({
    15:'#a9b08a',16:'#d7b673',17:'#c78162',18:'#ff735c',19:'#fff0d6',20:'#ff5638',
    21:'#d7f1ff',22:'#9dbbff',23:'#c6a0ff',24:'#ff9c50',25:'#9cc8ff',
    26:'#c9d7ff',27:'#d6e8ff',28:'#e8e0ff',29:'#b9c8ff',30:'#b8fff0',
  })[idx]||BODY_COLOR[idx]||'#d8e8ff';
}

function naturalCoreColor(idx){
  const bd=band(idx);
  if (bd==='bio') return CORE_COLOR[idx]||'#ff6b9d';
  if (bd==='planet') return idx===14?'#93deb2':'#ff8c3c';
  if (bd==='star') return idx===17?'#d69361':'#fffff5';
  if (bd==='degen') return '#ebf0ff';
  return RIM_COLOR[idx]||'#ffdcB4';
}

/* ── 草履蟲本體 ── */
function drawParamecium(idx,bd,t,px,py,pa,scale,custom,detail){
  px=px===undefined?para.x:px; py=py===undefined?para.y:py;
  pa=pa===undefined?para.a:pa; scale=scale||1;
  detail=detail===undefined?1:Math.max(0,Math.min(detail,1));
  custom=custom&&typeof custom==='object'?custom:null;
  const bodyIdx=customPartStage(custom,'bodyStage',idx);
  const ciliaIdx=customPartStage(custom,'ciliaStage',idx);
  const appendageIdx=customPartStage(custom,'appendageStage',idx);
  const motifIdx=customPartStage(custom,'motifStage',idx);
  const coreIdx=customPartStage(custom,'coreStage',idx);
  const auraIdx=customPartStage(custom,'auraStage',idx);
  bd=band(bodyIdx);
  const body=custom&&custom.bodyColor ? custom.bodyColor : BODY_COLOR[bodyIdx];
  const ciliaColor=custom&&custom.ciliaColor ? custom.ciliaColor : (BODY_COLOR[ciliaIdx]||body);
  const appendageColor=custom&&custom.appendageColor ? custom.appendageColor : (BODY_COLOR[appendageIdx]||body);
  const p=bodyIdx/(STAGES.length-1);
  cx.save();
  cx.translate(px,py); cx.rotate(pa); cx.scale(scale,scale);
  const rw=W*0.069, rh=W*0.029*(bodyIdx===4?1.09:1);

  if (appendageIdx===22 || appendageIdx===COSMIC_IDX.j0838){ // 中子星／巨型電波星系：只保留一組嚴格反向的雙極束
    const magneticAxis=Math.PI/2+(reduce?0:Math.sin(t/900)*.08);
    const jetLen=appendageIdx===COSMIC_IDX.j0838?(detail<.4?94:150):74;
    const jetHalf=appendageIdx===COSMIC_IDX.j0838?(detail<.4?8:15):7.5;
    cx.save(); cx.rotate(magneticAxis);
    for (const s of [1,-1]){
      const jg=cx.createLinearGradient(s*rh*.55,0,s*jetLen,0);
      jg.addColorStop(0,hexA(appendageColor,.18+.34*detail));
      jg.addColorStop(.55,hexA(appendageColor,.08+.15*detail));
      jg.addColorStop(1,hexA(appendageColor,0));
      cx.fillStyle=jg;
      cx.beginPath(); cx.moveTo(s*rh*.55,-jetHalf*.16); cx.lineTo(s*jetLen,-jetHalf); cx.lineTo(s*jetLen,jetHalf); cx.lineTo(s*rh*.55,jetHalf*.16); cx.closePath(); cx.fill();
      if (appendageIdx===COSMIC_IDX.j0838 && detail>.22){
        const lobe=cx.createRadialGradient(s*jetLen,0,0,s*jetLen,0,31);
        lobe.addColorStop(0,hexA(appendageColor,.1+.14*detail)); lobe.addColorStop(1,hexA(appendageColor,0));
        cx.fillStyle=lobe; cx.beginPath(); cx.ellipse(s*jetLen,0,31,19,0,0,6.2832); cx.fill();
      }
    }
    cx.restore();
  } else if (appendageIdx===23){ // 假設性夸克星：三味相位封印，避免只是「更紫、更粗的中子星」
    const phaseColors=['#78f3ff','#d69bff','#ffd37b'];
    cx.save(); cx.rotate(reduce?0:t/7600); cx.lineCap='round';
    for (let i=0;i<3;i++){
      const a=i/3*6.2832, start=a+.2, end=a+4.72;
      cx.strokeStyle=hexA(phaseColors[i],.3+.18*detail); cx.lineWidth=1.25+i*.28;
      cx.shadowColor=phaseColors[i]; cx.shadowBlur=9*detail;
      cx.beginPath(); cx.ellipse(0,0,rw*(1.1+i*.08),rh*(1.32+i*.12),a*.18,start,end); cx.stroke();
      const M=rimPoint(a,rw*1.13,rh*1.48);
      cx.fillStyle=hexA(phaseColors[i],.7); cx.beginPath(); cx.arc(M.ex,M.ey,1.45+i*.22,0,6.2832); cx.fill();
    }
    cx.restore();
  }

  drawMythicAura(auraIdx,t,rw,rh,custom&&custom.auraColor,detail);
  drawAppendages(appendageIdx,t,rw,rh,appendageColor);
  drawCilia(ciliaIdx,band(ciliaIdx),t,rw,rh,ciliaColor,ciliaIdx/(STAGES.length-1));

  // 膜
  const glow = bodyIdx===14?5 : bd==='bio'?0 : bd==='planet'?8 : bd==='star'?26 : bd==='degen'?20 : 14;
  const fill=cx.createLinearGradient(-rw,0,rw,0);
  if (custom&&custom.bodyColor){
    fill.addColorStop(0,hexA(body,.22+p*.18));
    fill.addColorStop(1,hexA(body,.5+p*.28));
  } else if (bodyIdx===11){
    fill.addColorStop(0,'rgba(3,2,4,.97)');
    fill.addColorStop(1,'rgba(105,5,19,.86)');
  } else if (bodyIdx===13){
    fill.addColorStop(0,'rgba(1,7,4,.97)');
    fill.addColorStop(1,'rgba(3,70,35,.84)');
  } else if (bodyIdx===14){
    fill.addColorStop(0,'rgba(8,20,15,.82)');
    fill.addColorStop(1,'rgba(32,78,59,.58)');
  } else if (bd==='horizon' && bodyIdx<26){
    fill.addColorStop(0,'rgba(8,8,14,.92)');
    fill.addColorStop(1,'rgba(14,12,20,.92)');
  } else {
    fill.addColorStop(0,hexA(body,.16+p*.24));
    fill.addColorStop(1,hexA(body,.34+p*.34));
  }
  cx.fillStyle=fill;
  cx.strokeStyle = bd==='horizon' ? (RIM_COLOR[bodyIdx]||hexA(body,.9)) : hexA(body,.75+p*.25);
  cx.lineWidth = bd==='bio'?2 : 2.8;
  if (glow>0){ cx.shadowColor = bd==='horizon'?(RIM_COLOR[bodyIdx]||body):body; cx.shadowBlur=glow; }
  cx.beginPath(); cx.ellipse(0,0,rw,rh,0,0,6.2832); cx.fill(); cx.stroke();
  cx.shadowBlur=0;
  if (bd==='horizon'){
    cx.strokeStyle='rgba(0,0,0,.9)'; cx.lineWidth=3.4;
    cx.beginPath(); cx.ellipse(0,0,rw*1.03,rh*1.05,0,0,6.2832); cx.stroke();
  }

  cx.save();
  cx.beginPath(); cx.ellipse(0,0,rw,rh,0,0,6.2832); cx.clip();
  cx.save();
  if (!reduce){
    cx.translate(Math.sin(t/850+motifIdx)*1.2, Math.cos(t/1050+motifIdx*.7)*.65);
    const breathe=1+Math.sin(t/1250+motifIdx*.4)*.018;
    cx.scale(breathe,2-breathe);
  }
  drawMotif(motifIdx,band(motifIdx),t,rw,rh);
  cx.restore();
  drawCore(coreIdx,band(coreIdx),t,rw,rh,custom&&custom.coreColor);
  cx.restore();

  cx.restore();
}

/* 逐階圖騰 */
function drawMotif(idx,bd,t,rw,rh){
  if (bd==='bio'){
    switch(idx){
      case 0:
        cx.strokeStyle='rgba(255,196,107,.4)'; cx.lineWidth=1;
        for (let i=0;i<3;i++){
          cx.beginPath(); cx.arc(-rw*0.45+i*rw*0.4, Math.sin(t/600+i)*3, 3.2,0,6.2832); cx.stroke();
        }
        break;
      case 1:
        cx.fillStyle='rgba(20,30,40,.8)';
        cx.beginPath(); cx.arc(rw*0.62,-rh*0.15,4.5,0,6.2832); cx.fill();
        cx.fillStyle='rgba(255,220,170,.4)';
        for (let i=0;i<4;i++){ cx.beginPath(); cx.arc(-rw*0.4+i*6,rh*0.35,2,0,6.2832); cx.fill(); }
        break;
      case 2:
        cx.strokeStyle='rgba(30,24,12,.6)'; cx.lineWidth=5;
        for (let i=-1;i<=1;i++){
          cx.beginPath();
          cx.ellipse(i*rw*0.34,0, rw*0.13, rh*0.92, 0, -1.35, 1.35);
          cx.stroke();
        }
        break;
      case 3: {
        const hue=(t/8)%360;
        cx.fillStyle=`hsla(${hue} 70% 60% / .16)`;
        cx.fillRect(-rw,-rh,rw*2,rh*2);
        const wing=reduce?0.4:Math.abs(Math.sin(t/40));
        cx.strokeStyle=`rgba(230,250,255,${.25+wing*.3})`; cx.lineWidth=1.5;
        for (const s of [1,-1]){
          cx.beginPath();
          cx.ellipse(-rw*0.1, s*rh*0.45, rw*0.34, rh*0.5*(0.4+wing), 0, 0, 6.2832);
          cx.stroke();
        }
        break; }
      case 4: // 倉鼠：鼓鼓的頰囊、柔耳與短鬚；厚度略增但不改變碰撞範圍
        cx.fillStyle='rgba(255,244,210,.3)';
        for (const s of [1,-1]){ cx.beginPath(); cx.arc(rw*0.42, s*rh*0.42, rh*.42,0,6.2832); cx.fill(); }
        cx.fillStyle='rgba(217,138,58,.85)';
        for (const s of [1,-1]) for(let k=0;k<2;k++){
          cx.beginPath(); cx.arc(rw*0.4+k*3, s*rh*0.42, 1.4,0,6.2832); cx.fill();
        }
        cx.strokeStyle='rgba(255,244,220,.34)'; cx.lineWidth=1;
        for (const s of [1,-1]){
          cx.beginPath(); cx.arc(-rw*.48,s*rh*.7,rh*.2,Math.PI*.12,Math.PI*.88); cx.stroke();
          for (let k=0;k<2;k++){
            cx.beginPath(); cx.moveTo(rw*.56,s*(rh*.2+k*3)); cx.lineTo(rw*.78,s*(rh*.28+k*5)); cx.stroke();
          }
        }
        break;
      case 5: {
        const blink=(!reduce && (t%4800)<160)?0.15:1;
        cx.fillStyle='rgba(255,220,110,.85)';
        for (const s of [1,-1]){
          cx.beginPath(); cx.ellipse(rw*0.5, s*rh*0.32, 3.4, 5.2*blink, 0, 0, 6.2832); cx.fill();
        }
        cx.fillStyle='rgba(15,20,15,.9)';
        for (const s of [1,-1]){
          cx.beginPath(); cx.ellipse(rw*0.5, s*rh*0.32, 1.1, 4.4*blink, 0, 0, 6.2832); cx.fill();
        }
        break; }
      case 6: // 人：體內是耕過的田——彎彎的壟，撒下的種
        cx.strokeStyle='rgba(150,110,70,.45)'; cx.lineWidth=2;
        for (let i=-1;i<=1;i++){
          cx.beginPath();
          cx.ellipse(0, i*rh*0.36, rw*0.7, rh*0.18, 0, 3.5, 5.9);
          cx.stroke();
        }
        cx.fillStyle='rgba(255,224,130,.85)';
        for (let k=0;k<5;k++){
          cx.beginPath(); cx.arc(-rw*0.5+k*rw*0.25, Math.sin(k*2.1)*rh*0.32, 1.5,0,6.2832); cx.fill();
        }
        break;
      case 7:
        cx.strokeStyle='rgba(240,235,225,.75)'; cx.lineWidth=2.2;
        for (const s of [1,-1]){
          cx.beginPath();
          cx.moveTo(rw*0.55, s*rh*0.3);
          cx.quadraticCurveTo(rw*0.9, s*rh*0.75, rw*0.75, s*rh*0.95);
          cx.stroke();
        }
        break;
      case 8:
        cx.strokeStyle='rgba(210,230,240,.4)'; cx.lineWidth=1;
        for (let i=0;i<6;i++){
          cx.beginPath();
          cx.moveTo(rw*0.35+i*3, -rh*0.5);
          cx.quadraticCurveTo(rw*0.38+i*3, 0, rw*0.35+i*3, rh*0.5);
          cx.stroke();
        }
        if (!reduce && (t%5200)<900){
          const k=(t%5200)/900;
          cx.strokeStyle=`rgba(200,240,255,${.5*(1-k)})`;
          for (let i=0;i<3;i++){
            cx.beginPath(); cx.arc(rw*0.1-i*4, -rh*0.9-k*14-i*5, 2+k*2, 0, 6.2832); cx.stroke();
          }
        }
        break;
      case 9:
        cx.strokeStyle='rgba(140,200,220,.35)'; cx.lineWidth=1.4;
        for (let i=0;i<3;i++){
          cx.beginPath();
          for (let k=0;k<=12;k++){
            const x=-rw*0.8+k/12*rw*1.6;
            const y=-rh*0.3+i*rh*0.3+Math.sin(k/12*6.28+t/700+i)*3;
            k===0?cx.moveTo(x,y):cx.lineTo(x,y);
          }
          cx.stroke();
        }
        break;
      case 10: // 巨人：岩刻圖騰——鑿出的溝紋，與一道螺旋
        cx.strokeStyle='rgba(205,195,220,.42)'; cx.lineWidth=2.6;
        for (const i of [-1,1]){
          cx.beginPath();
          cx.ellipse(0, i*rh*0.44, rw*0.62, rh*0.2, 0, 3.6, 5.8);
          cx.stroke();
        }
        cx.lineWidth=1.8;
        cx.beginPath();
        for (let k=0;k<=40;k++){
          const th=k/40*12.566, rr2=k/40*rh*0.55;
          const x=-rw*0.12+Math.cos(th)*rr2, y=Math.sin(th)*rr2*0.85;
          k===0?cx.moveTo(x,y):cx.lineTo(x,y);
        }
        cx.stroke();
        break;
      case 11:
        cx.strokeStyle='rgba(255,65,82,.4)'; cx.lineWidth=1;
        for (let row=-1;row<=1;row++) for (let k=0;k<5;k++){
          cx.beginPath();
          cx.arc(-rw*0.6+k*rw*0.3+(row%2?rw*0.15:0), row*rh*0.42, 4.5, 3.4, 6.0);
          cx.stroke();
        }
        cx.fillStyle='rgba(255,35,48,.95)';
        cx.beginPath(); cx.ellipse(rw*0.55,-rh*0.1,1.3,3.6,0,0,6.2832); cx.fill();
        break;
      case 12:
        cx.strokeStyle='rgba(190,205,170,.4)'; cx.lineWidth=1.2;
        cx.beginPath(); cx.ellipse(0,0,rw*0.28,rh*0.5,0,0,6.2832); cx.stroke();
        for (let i=0;i<6;i++){
          const a=i/6*6.2832;
          cx.beginPath();
          cx.moveTo(Math.cos(a)*rw*0.28, Math.sin(a)*rh*0.5);
          cx.lineTo(Math.cos(a)*rw*0.85, Math.sin(a)*rh*0.85);
          cx.stroke();
        }
        break;
      case 13:
        cx.strokeStyle='rgba(55,235,120,.42)'; cx.lineWidth=1.3;
        for (let i=0;i<3;i++){
          cx.beginPath();
          for (let k=0;k<=12;k++){
            const x=-rw*0.75+k/12*rw*1.5;
            const y=(-rh*0.35+i*rh*0.35)+Math.sin(k/12*7+t/500+i*2)*3.5;
            k===0?cx.moveTo(x,y):cx.lineTo(x,y);
          }
          cx.stroke();
        }
        break;
    }
    return;
  }
  if (bd==='planet'){
    if (idx===14){
      // 蛇的波紋只剩地層化石般的殘痕，不再壓過後續行星形態。
      const rot=reduce?0:t/5200;
      cx.strokeStyle='rgba(103,195,148,.21)'; cx.lineWidth=.8;
      for (let i=0;i<2;i++){
        cx.beginPath();
        for (let k=0;k<=24;k++){
          const x=-rw*.78+k/24*rw*1.56;
          const y=(-rh*.2+i*rh*.4)+Math.sin(k*.62+rot+i*1.8)*2.2;
          k===0?cx.moveTo(x,y):cx.lineTo(x,y);
        }
        cx.stroke();
      }
      cx.strokeStyle='rgba(190,230,207,.11)'; cx.lineWidth=.55;
      cx.beginPath();
      for (let k=0;k<=34;k++){
        const a=k/34*11.8+rot, r=k/34*rh*.72;
        const x=rw*.08+Math.cos(a)*r*1.8, y=Math.sin(a)*r;
        k===0?cx.moveTo(x,y):cx.lineTo(x,y);
      }
      cx.stroke();
    } else if (idx===16){
      // 氣態巨行星：反向漂移的雲帶、長壽橢圓風暴與兩端極光，讓本體不只靠外環辨識。
      const drift=reduce?0:t/3100;
      cx.save(); cx.lineCap='round';
      for (let i=-2;i<=2;i++){
        const y=i*rh*.27, sway=reduce?0:Math.sin(drift+i*1.7)*2.2;
        cx.strokeStyle=i%2?'rgba(255,228,179,.22)':'rgba(171,215,236,.2)'; cx.lineWidth=1.15+(i%2===0?.45:0);
        cx.beginPath(); cx.moveTo(-rw*.92,y);
        cx.bezierCurveTo(-rw*.42,y+sway,rw*.32,y-sway,rw*.9,y); cx.stroke();
      }
      cx.fillStyle='rgba(203,119,79,.3)'; cx.strokeStyle='rgba(255,218,177,.42)'; cx.lineWidth=1;
      cx.beginPath(); cx.ellipse(rw*.34,rh*.22,rw*.13,rh*.16,-.18,0,6.2832); cx.fill(); cx.stroke();
      for (const s of [-1,1]){
        const aur=cx.createRadialGradient(-rw*.5,s*rh*.73,0,-rw*.5,s*rh*.73,rh*.42);
        aur.addColorStop(0,'rgba(137,231,255,.25)'); aur.addColorStop(1,'rgba(137,231,255,0)');
        cx.fillStyle=aur; cx.beginPath(); cx.ellipse(-rw*.5,s*rh*.72,rw*.22,rh*.28,0,0,6.2832); cx.fill();
      }
      cx.restore();
    } else {
      cx.strokeStyle='rgba(255,220,170,.22)'; cx.lineWidth=1.2;
      for (let i=1;i<=2;i++){
        cx.beginPath();
        cx.ellipse(0,-rh*0.15*i, rw*0.8, rh*(0.75-0.18*i), 0, 0.4, 2.75);
        cx.stroke();
      }
    }
  }
  else if (bd==='star'){
    if (idx===17){
      // 褐矮星是帶雲的近紅外餘燼，不使用真正恆星的白色融合光毯。
      const drift=reduce?0:t/4200;
      cx.fillStyle='rgba(60,23,20,.18)'; cx.fillRect(-rw,-rh,rw*2,rh*2);
      for (let i=-1;i<=1;i++){
        cx.strokeStyle=i===0?'rgba(240,164,103,.25)':'rgba(139,78,65,.28)'; cx.lineWidth=2.2-Math.abs(i)*.45;
        cx.beginPath(); cx.moveTo(-rw*.88,i*rh*.38);
        cx.bezierCurveTo(-rw*.35,i*rh*.38+Math.sin(drift+i)*3,rw*.24,i*rh*.38-Math.sin(drift+i)*3,rw*.86,i*rh*.38); cx.stroke();
      }
      cx.fillStyle='rgba(92,42,38,.48)'; cx.beginPath(); cx.ellipse(rw*.32,-rh*.18,rw*.16,rh*.25,.22,0,6.2832); cx.fill();
    } else {
      const fl=reduce?1:(Math.sin(t/1100)*.18+.82);
      const g=cx.createRadialGradient(0,0,0,0,0,rw*0.8);
      g.addColorStop(0,`rgba(255,250,235,${.25*fl})`);
      g.addColorStop(1,'rgba(255,250,235,0)');
      cx.fillStyle=g; cx.fillRect(-rw,-rh,rw*2,rh*2);
    }
  }
  else if (bd==='degen'){
    cx.strokeStyle='rgba(230,235,255,.3)'; cx.lineWidth=1;
    cx.beginPath(); cx.ellipse(0,0,rw*0.55,rh*0.55,0,0,6.2832); cx.stroke();
  }
  else {
    if (idx===COSMIC_IDX.galaxy){
      // 星系：三條緩慢旋臂與中央星海，明確承接超大質量黑洞。
      const rot=reduce?0:t/18000;
      cx.save(); cx.rotate(rot); cx.strokeStyle='rgba(210,226,255,.25)'; cx.lineWidth=.8;
      for (let arm=0;arm<3;arm++){
        cx.beginPath();
        for (let k=0;k<=24;k++){
          const q=k/24, a=arm/3*6.2832+q*4.7, rr=4+q*rw*.78;
          const x=Math.cos(a)*rr, y=Math.sin(a)*rr*(rh/rw);
          k===0?cx.moveTo(x,y):cx.lineTo(x,y);
        }
        cx.stroke();
      }
      cx.restore();
    } else if (idx===COSMIC_IDX.cluster){
      // 星系團：多個微型星系沿暗物質骨架分布，而非放大單一星系。
      cx.save(); cx.rotate(reduce?0:t/23000);
      cx.strokeStyle='rgba(160,220,255,.18)'; cx.lineWidth=.75;
      for (let i=0;i<5;i++){
        const a=i/5*6.2832, x=Math.cos(a)*rw*.58, y=Math.sin(a)*rh*.58;
        cx.beginPath(); cx.moveTo(0,0); cx.quadraticCurveTo(x*.4-y*.18,y*.4+x*.08,x,y); cx.stroke();
        cx.fillStyle='rgba(235,245,255,.55)'; cx.beginPath(); cx.arc(x,y,1.2+i%2*.45,0,6.2832); cx.fill();
      }
      cx.restore();
    } else if (idx===COSMIC_IDX.j0838){
      // 宿主形態未被觀測成特定旋渦；只畫瀰漫星光，不硬指定旋臂。
      const haze=cx.createRadialGradient(0,0,2,0,0,rw*.88);
      haze.addColorStop(0,'rgba(228,235,255,.24)'); haze.addColorStop(1,'rgba(180,198,240,0)');
      cx.fillStyle=haze; cx.fillRect(-rw,-rh,rw*2,rh*2);
      cx.fillStyle='rgba(255,255,255,.72)';
      for (let i=0;i<22;i++){
        const rr=((i*17)%21)/21, a=i*2.399+t/18000;
        cx.globalAlpha=.22+((i*13)%7)/12;
        cx.beginPath(); cx.arc(Math.cos(a)*rr*rw*.82,Math.sin(a)*rr*rh*.82,.55+(i%3)*.22,0,6.2832); cx.fill();
      }
      cx.globalAlpha=1;
    } else if (idx===COSMIC_IDX.laniakea){
      // 拉尼亞凱亞：細絲皆朝同一吸引盆地匯流，沒有實體外緣。
      const rot=reduce?0:t/26000;
      cx.save(); cx.rotate(rot); cx.strokeStyle='rgba(185,200,255,.22)'; cx.lineWidth=.72;
      for (let arm=0;arm<8;arm++){
        const a=arm/8*6.2832;
        cx.beginPath(); cx.moveTo(Math.cos(a+.32)*rw*.92,Math.sin(a+.32)*rh*.92);
        cx.quadraticCurveTo(Math.cos(a-.12)*rw*.48,Math.sin(a-.12)*rh*.48,0,0); cx.stroke();
      }
      cx.restore();
    } else if (idx===COSMIC_IDX.hubble){
      // 哈伯球沒有實體表面；內部以宇宙網節點與向外增長的共動軌跡表示。
      const rot=reduce?0:t/24000;
      cx.save(); cx.rotate(rot); cx.strokeStyle='rgba(184,255,240,.18)'; cx.lineWidth=.75;
      for (let arm=0;arm<7;arm++){
        const a=arm/7*6.2832;
        cx.beginPath(); cx.moveTo(Math.cos(a)*rw*.08,Math.sin(a)*rh*.08);
        cx.quadraticCurveTo(Math.cos(a+.18)*rw*.45,Math.sin(a+.18)*rh*.48,Math.cos(a)*rw*.92,Math.sin(a)*rh*.92); cx.stroke();
      }
      cx.fillStyle='rgba(225,255,248,.66)';
      for (let i=0;i<17;i++){
        const a=i*2.399, rr=.16+((i*11)%15)/18;
        cx.globalAlpha=.25+(i%4)*.12; cx.beginPath();
        cx.arc(Math.cos(a)*rr*rw,Math.sin(a)*rr*rh,.55+(i%3)*.25,0,6.2832); cx.fill();
      }
      cx.globalAlpha=1; cx.restore();
    } else {
      const rim=RIM_COLOR[idx]||'#ff9c50';
      cx.strokeStyle=hexA(rim,.4); cx.lineWidth=1;
      for (let i=0;i<2;i++){
        cx.beginPath();
        cx.ellipse(0,0,rw*(0.55+i*0.2),rh*0.3,0,0,6.2832);
        cx.stroke();
      }
    }
  }
}

/* 核心：地球帶＝各色核球（心臟已除役）→ 熔核 → 聚變核 → 簡併核 → 奇點 */
function drawCore(idx,bd,t,rw,rh,colorOverride){
  const ox=rw*0.12;
  const pulse=reduce?1:1+Math.sin(t/700+idx*.55)*.08;
  if (bd==='bio'){
    const c=colorOverride||CORE_COLOR[idx]||'#ff6b9d';
    cx.fillStyle=hexA(c,.85);
    cx.shadowColor=c; cx.shadowBlur=8;
    cx.beginPath(); cx.arc(ox,0,6*pulse,0,6.2832); cx.fill();
    cx.shadowBlur=0;
  }
  else if (bd==='planet'){
    const c=colorOverride||(idx===14?'#93deb2':'#ff8c3c');
    const g=cx.createRadialGradient(ox,0,0,ox,0,8*pulse);
    g.addColorStop(0,hexA(c,idx===14?.64:.9)); g.addColorStop(1,hexA(c,0));
    cx.fillStyle=g;
    cx.beginPath(); cx.arc(ox,0,8*pulse,0,6.2832); cx.fill();
  }
  else if (bd==='star'){
    if (idx===17){
      // 褐矮星只保留暗琥珀的氘餘燼；氫融合白核從紅矮星才開始。
      const c=colorOverride||'#d69361';
      const ember=cx.createRadialGradient(ox,0,0,ox,0,8.5*pulse);
      ember.addColorStop(0,hexA('#ffe0a8',.76)); ember.addColorStop(.28,hexA(c,.62)); ember.addColorStop(1,hexA('#5b2725',0));
      cx.fillStyle=ember; cx.beginPath(); cx.arc(ox,0,8.5*pulse,0,6.2832); cx.fill();
      cx.strokeStyle=hexA(c,.38); cx.lineWidth=.85; cx.beginPath(); cx.arc(ox,0,5.4*pulse,.25,4.9); cx.stroke();
    } else {
      const c=colorOverride||'#fffff5';
      const fl=reduce?1:(Math.sin(t/800)*.12+1);
      cx.fillStyle=hexA(c,.95);
      cx.shadowColor=c; cx.shadowBlur=14*fl;
      cx.beginPath(); cx.arc(ox,0,5*pulse,0,6.2832); cx.fill();
      cx.shadowBlur=0;
    }
  }
  else if (bd==='degen'){
    const c=colorOverride||'#ebf0ff';
    cx.fillStyle=hexA(c,.95);
    cx.beginPath(); cx.arc(ox,0,3.5*pulse,0,6.2832); cx.fill();
    cx.strokeStyle=hexA(c,.5); cx.lineWidth=1;
    cx.beginPath(); cx.arc(ox,0,6*pulse,0,6.2832); cx.stroke();
  }
  else {
    const c=colorOverride||(RIM_COLOR[idx]||'#ffdcB4');
    if (idx===COSMIC_IDX.stellarBlackHole){
      const shadow=7.2*pulse;
      const corona=cx.createRadialGradient(0,0,shadow*.7,0,0,shadow*1.85);
      corona.addColorStop(0,'rgba(0,0,0,1)'); corona.addColorStop(.53,'rgba(0,0,0,.99)');
      corona.addColorStop(.68,hexA('#ffd9a2',.82)); corona.addColorStop(.8,hexA(c,.38)); corona.addColorStop(1,hexA(c,0));
      cx.fillStyle=corona; cx.beginPath(); cx.arc(0,0,shadow*1.85,0,6.2832); cx.fill();
      cx.fillStyle='rgba(0,0,0,1)'; cx.beginPath(); cx.arc(0,0,shadow,0,6.2832); cx.fill();
      cx.strokeStyle='rgba(255,225,182,.78)'; cx.lineWidth=1.15; cx.shadowColor='#ffc780'; cx.shadowBlur=7;
      cx.beginPath(); cx.arc(0,0,shadow*1.12,0,6.2832); cx.stroke(); cx.shadowBlur=0;
    } else if (idx===COSMIC_IDX.supermassiveBlackHole){
      // A black-hole shadow is centred on the spin axis; unlike a cellular
      // nucleus it must not inherit the paramecium's historical ox offset.
      const shadow=9.4*pulse;
      const corona=cx.createRadialGradient(0,0,shadow*.72,0,0,shadow*1.9);
      corona.addColorStop(0,'rgba(0,0,0,1)');
      corona.addColorStop(.52,'rgba(0,0,0,.98)');
      corona.addColorStop(.66,hexA('#fff1cf',.9));
      corona.addColorStop(.76,hexA(c,.48));
      corona.addColorStop(1,hexA(c,0));
      cx.fillStyle=corona; cx.beginPath(); cx.arc(0,0,shadow*1.9,0,6.2832); cx.fill();
      cx.fillStyle='rgba(0,0,0,1)'; cx.beginPath(); cx.arc(0,0,shadow,0,6.2832); cx.fill();
      cx.strokeStyle='rgba(255,243,214,.92)'; cx.lineWidth=1.45;
      cx.shadowColor='#ffe5b0'; cx.shadowBlur=9;
      cx.beginPath(); cx.arc(0,0,shadow*1.12,0,6.2832); cx.stroke(); cx.shadowBlur=0;
    } else if (idx===COSMIC_IDX.hubble){
      const hub=cx.createRadialGradient(ox,0,0,ox,0,13*pulse);
      hub.addColorStop(0,hexA(c,.95)); hub.addColorStop(.18,hexA(c,.48)); hub.addColorStop(1,hexA(c,0));
      cx.fillStyle=hub; cx.beginPath(); cx.arc(ox,0,13*pulse,0,6.2832); cx.fill();
      cx.strokeStyle=hexA(c,.7); cx.lineWidth=1;
      for (const rr of [4.2,7.2,10.4]){ cx.beginPath(); cx.arc(ox,0,rr*pulse,0,6.2832); cx.stroke(); }
    } else if (idx===COSMIC_IDX.j0838){
      const agn=cx.createRadialGradient(ox,0,2,ox,0,12*pulse);
      agn.addColorStop(0,'rgba(0,0,0,1)');
      agn.addColorStop(.38,'rgba(0,0,0,.98)');
      agn.addColorStop(.55,hexA(c,.92));
      agn.addColorStop(1,hexA(c,0));
      cx.fillStyle=agn; cx.beginPath(); cx.arc(ox,0,12*pulse,0,6.2832); cx.fill();
      cx.strokeStyle=hexA(c,.72); cx.lineWidth=1.2;
      cx.beginPath(); cx.ellipse(ox,0,10*pulse,3.4*pulse,-.25,0,6.2832); cx.stroke();
      cx.fillStyle='rgba(0,0,0,1)'; cx.beginPath(); cx.arc(ox,0,4.2*pulse,0,6.2832); cx.fill();
    } else if (idx===COSMIC_IDX.galaxy || idx===COSMIC_IDX.cluster){
      const cluster=idx===COSMIC_IDX.cluster;
      cx.fillStyle='rgba(0,0,0,.96)'; cx.beginPath(); cx.arc(ox,0,(cluster?3.2:4.1)*pulse,0,6.2832); cx.fill();
      cx.strokeStyle=hexA(c,.76); cx.lineWidth=1;
      cx.beginPath(); cx.ellipse(ox,0,(cluster?8.8:9.8)*pulse,(cluster?5.2:3.2)*pulse,-.25,0,6.2832); cx.stroke();
      if (cluster) for (let i=0;i<4;i++){
        const a=i/4*6.2832+t/4000;
        cx.fillStyle=hexA(c,.56); cx.beginPath(); cx.arc(ox+Math.cos(a)*9,Math.sin(a)*5,1.1,0,6.2832); cx.fill();
      }
    } else if (idx===COSMIC_IDX.laniakea){
      const basin=cx.createRadialGradient(ox,0,0,ox,0,12*pulse);
      basin.addColorStop(0,hexA('#fff2cf',.75)); basin.addColorStop(.22,hexA(c,.36)); basin.addColorStop(1,hexA(c,0));
      cx.fillStyle=basin; cx.beginPath(); cx.arc(ox,0,12*pulse,0,6.2832); cx.fill();
      cx.strokeStyle=hexA(c,.42); cx.lineWidth=.8;
      for (let i=0;i<6;i++){ const a=i/6*6.2832; cx.beginPath(); cx.moveTo(ox+Math.cos(a)*11,Math.sin(a)*8); cx.lineTo(ox,0); cx.stroke(); }
    } else {
      cx.fillStyle='rgba(0,0,0,.95)';
      cx.beginPath(); cx.arc(ox,0,3.5*pulse,0,6.2832); cx.fill();
      cx.strokeStyle=hexA(c,.7); cx.lineWidth=1;
      cx.beginPath(); cx.arc(ox,0,5.5*pulse,0,6.2832); cx.stroke();
    }
  }
}

/* A shared, deliberately stylised relativistic disk.  It preserves the
   science-readable hierarchy: diffuse accretion glow, a lensed far-side arc,
   a Doppler-asymmetric foreground disk, then the black shadow and photon ring. */
function drawRelativisticDisk(px,py,angle,rx,ry,intensity,detail,part){
  intensity=Math.max(0,Math.min(Number(intensity)||0,1));
  detail=detail===undefined?1:Math.max(0,Math.min(detail,1));
  const back=part!=='front', front=part!=='back';
  cx.save(); cx.translate(px,py); cx.rotate(angle); cx.lineCap='round';
  if (back){
    const halo=cx.createRadialGradient(0,0,ry*.4,0,0,rx*1.28);
    halo.addColorStop(0,`rgba(255,226,168,${.16*intensity})`);
    halo.addColorStop(.42,`rgba(159,196,255,${.09*intensity})`);
    halo.addColorStop(1,'rgba(105,145,230,0)');
    cx.fillStyle=halo; cx.beginPath(); cx.ellipse(0,0,rx*1.3,ry*3.25,0,0,6.2832); cx.fill();

    // Broken tangent arcs suggest doubled and bent background light without
    // incorrectly drawing a perfect Einstein ring around every source.
    cx.shadowColor='#c9ddff'; cx.shadowBlur=18*intensity*detail;
    for (const s of [-1,1]){
      cx.strokeStyle=`rgba(${s>0?'187,220,255':'255,214,161'},${.17+.2*intensity})`;
      cx.lineWidth=1.15+1.35*intensity;
      cx.beginPath(); cx.moveTo(-rx*1.14,s*ry*.72);
      cx.bezierCurveTo(-rx*.52,s*ry*2.7,rx*.45,s*ry*2.45,rx*1.16,s*ry*.56); cx.stroke();
      cx.globalAlpha=.58;
      cx.beginPath(); cx.moveTo(-rx*.88,s*ry*1.2);
      cx.quadraticCurveTo(0,s*ry*3.15,rx*.9,s*ry*1.05); cx.stroke();
      cx.globalAlpha=1;
    }

    const disk=cx.createLinearGradient(-rx,0,rx,0);
    disk.addColorStop(0,`rgba(166,213,255,${.32+.34*intensity})`);
    disk.addColorStop(.34,`rgba(255,248,222,${.42+.4*intensity})`);
    disk.addColorStop(.68,`rgba(255,183,91,${.28+.28*intensity})`);
    disk.addColorStop(1,'rgba(215,88,48,.06)');
    cx.strokeStyle=disk; cx.lineWidth=Math.max(7,ry*(.42+.24*intensity));
    cx.shadowColor='#ffd79b'; cx.shadowBlur=12+12*intensity;
    cx.beginPath(); cx.ellipse(0,0,rx,ry,0,Math.PI,6.2832); cx.stroke();
    cx.shadowBlur=0;
  }
  if (front){
    const disk=cx.createLinearGradient(-rx,0,rx,0);
    disk.addColorStop(0,`rgba(189,226,255,${.55+.35*intensity})`);
    disk.addColorStop(.38,`rgba(255,252,232,${.66+.28*intensity})`);
    disk.addColorStop(.72,`rgba(255,181,83,${.38+.3*intensity})`);
    disk.addColorStop(1,'rgba(196,72,45,.1)');
    cx.strokeStyle=disk; cx.lineWidth=Math.max(8,ry*(.48+.28*intensity));
    cx.shadowColor='#ffe0a6'; cx.shadowBlur=13+14*intensity;
    cx.beginPath(); cx.ellipse(0,0,rx,ry,0,0,Math.PI); cx.stroke();

    // The far side is lensed above the shadow into a thin secondary image.
    cx.strokeStyle=`rgba(255,244,218,${.42+.35*intensity})`; cx.lineWidth=1.5+intensity;
    cx.shadowBlur=9+9*intensity;
    cx.beginPath(); cx.ellipse(0,-ry*.12,rx*.47,ry*1.18,0,Math.PI+.2,6.0832); cx.stroke();

    const shadow=Math.max(9,ry*.37);
    cx.shadowBlur=0; cx.fillStyle='rgba(0,0,0,1)';
    cx.beginPath(); cx.arc(0,0,shadow,0,6.2832); cx.fill();
    cx.strokeStyle=`rgba(255,244,217,${.68+.26*intensity})`; cx.lineWidth=1.3+intensity*.8;
    cx.shadowColor='#ffe2a8'; cx.shadowBlur=8+10*intensity;
    cx.beginPath(); cx.arc(0,0,shadow*1.16,0,6.2832); cx.stroke();
  }
  cx.restore();
}

/* ── 環繞層 ── */
function drawRetinue(idx,t,phase,scale,detail){
  if (idx<14) return;
  scale=scale===undefined?1:scale;
  detail=detail===undefined?1:Math.max(0,Math.min(detail,1));
  const px=para.x, py=para.y;
  const tilt=-0.42;
  cx.save();
  cx.translate(px,py); cx.scale(scale,scale); cx.translate(-px,-py);
  function orbiter(rx,ry,speed,ph,sz,color){
    const a=t/1000*speed+ph;
    const ox=Math.cos(a)*rx, oy=Math.sin(a)*ry;
    const x=px+ox*Math.cos(tilt)-oy*Math.sin(tilt);
    const y=py+ox*Math.sin(tilt)+oy*Math.cos(tilt);
    const front=Math.sin(a)>0;
    if ((phase==='front')!==front) return;
    cx.fillStyle=color;
    cx.beginPath(); cx.arc(x,y,sz,0,6.2832); cx.fill();
  }
  function orientedOrbiter(rx,ry,speed,ph,sz,color,angle){
    const a=t/1000*speed+ph, ox=Math.cos(a)*rx, oy=Math.sin(a)*ry;
    const x=px+ox*Math.cos(angle)-oy*Math.sin(angle), y=py+ox*Math.sin(angle)+oy*Math.cos(angle);
    const front=Math.sin(a)>0;
    if ((phase==='front')!==front) return;
    cx.fillStyle=color; cx.beginPath(); cx.arc(x,y,sz,0,6.2832); cx.fill();
  }
  function ringArc(rx,ry,color,lw,frontHalf){
    cx.save(); cx.translate(px,py); cx.rotate(tilt);

      cx.strokeStyle=`rgba(224,232,255,${.18+.3*ignite})`; cx.lineWidth=3+ignite*4; cx.shadowColor='#dce7ff'; cx.shadowBlur=18;
      cx.beginPath(); cx.moveTo(-R*.7,0); cx.lineTo(R*.7,0); cx.stroke();

        cx.beginPath(); cx.ellipse(s*d,0,d>R*.5?38:25,d>R*.5?24:14,0,0,6.2832); cx.stroke();
      }

    }
    if (activeEvent.id==='basinflow'){
      cx.save(); cx.translate(selfX,selfY); cx.rotate(reduce?0:t/26000);
      for (let i=0;i<12;i++){
        const a=i/12*6.2832;
        cx.strokeStyle=`rgba(190,204,255,${.09+(i%3)*.025})`; cx.lineWidth=.8+(i%2)*.35;
        cx.beginPath(); cx.moveTo(Math.cos(a+.32)*R*.92,Math.sin(a+.32)*R*.92);

      }
      cx.restore();
    }
    if (activeEvent.id==='hubbleflow'){
      cx.save(); cx.translate(selfX,selfY); cx.rotate(reduce?0:t/42000);
      cx.globalCompositeOperation='lighter'; cx.lineCap='round';
      const phase=reduce?.48:(t/2850)%1;

      field.addColorStop(1,'rgba(255,116,126,0)');
      cx.fillStyle=field; cx.fillRect(-W*1.5,-W*1.5,W*3,W*3);

      // Three interleaved wavefronts make the last mortal scale breathe over
      // the entire microscope instead of reading as a small local aura.
      for (let p=0;p<3;p++){
        const q=(phase+p/3)%1, fade=1-q, rr=R*(.16+q*1.82);

        cx.beginPath(); cx.arc(0,0,rr,0,6.2832); cx.stroke();

        cx.beginPath(); cx.arc(0,0,rr+8+fade*18,0,6.2832); cx.stroke();
      }

      // Long moving streaks begin near the self and escape well past the
      // field radius.  The microscope clip, not an arbitrary local radius,

const CINE_DUR=[1.2, 4.2, 2.2, 3.0, 2.6];
function drawCine(t, raw){
  cine.t += raw;
  const ph=cine.ph, dur=CINE_DUR[ph];
  const k=Math.min(cine.t/dur,1);
  cx.clearRect(0,0,W,W);
  if (ph===0){
    cx.save(); cx.beginPath(); cx.arc(CX,CY,R,0,6.2832); cx.clip();
    drawBg(S.stage,t);
    cx.fillStyle=`rgba(0,0,0,${k*0.5})`; cx.fillRect(0,0,W,W);
    drawParamecium(S.stage,band(S.stage),0);
    cx.restore();
    ring(1);
  }
  else if (ph===1){
    cx.save(); cx.beginPath(); cx.arc(CX,CY,R,0,6.2832); cx.clip();
    cx.fillStyle='#05060c'; cx.fillRect(0,0,W,W);
    const ease=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
    const px=para.x+(CX-para.x)*Math.min(ease*2,1);
    const py=para.y+(CY-para.y)*Math.min(ease*2,1);
    const grow=Math.max(0,(ease-0.35)/0.65);
    const sc=1+grow*(R/(W*0.069)-1);
    const pa=para.a*(1-ease);
    drawParamecium(S.stage,'horizon',t,px,py,pa,sc);
    cx.restore();
    ring(1-k*0.6);
  }
  else if (ph===2){
    cx.fillStyle='#020308'; cx.fillRect(0,0,W,W);
    const shrink=1-k;
    stars.forEach(s=>{
      const rr=s.r*R*shrink;
      cx.globalAlpha=.7*shrink;
      cx.fillStyle='#dff';
      cx.beginPath(); cx.arc(CX+Math.cos(s.a)*rr,CY+Math.sin(s.a)*rr,s.sz,0,6.2832); cx.fill();
    });
    cx.globalAlpha=1;
    cx.strokeStyle=`rgba(232,224,255,${.8*shrink+0.2})`; cx.lineWidth=2.5;
    cx.beginPath(); cx.arc(CX,CY,Math.max(R*shrink,1.2),0,6.2832); cx.stroke();
    ring(shrink*0.5);
  }
  else if (ph===3){
    cx.fillStyle='#000'; cx.fillRect(0,0,W,W);
    cx.fillStyle='rgba(255,255,255,.9)';
    cx.beginPath(); cx.arc(CX,CY,1.1,0,6.2832); cx.fill();
  }
  else if (ph===4){
    cx.fillStyle='#02030a'; cx.fillRect(0,0,W,W);
    const rr=k*R*1.1;
    cx.strokeStyle=`rgba(255,255,255,${1-k})`; cx.lineWidth=4*(1-k)+1;
    cx.beginPath(); cx.arc(CX,CY,rr,0,6.2832); cx.stroke();
    cx.strokeStyle=`rgba(120,160,220,${k*0.1})`; cx.lineWidth=.6;
    for (let r=0.25;r<=1;r+=0.25){ cx.beginPath(); cx.arc(CX,CY,r*R*k,0,6.2832); cx.stroke(); }
    ring(k);
  }
  if (cine.t>=dur){
    cine.ph++; cine.t=0;
    if (cine.ph>=CINE_DUR.length) endCine();
  }
}

    const data=normalizeAvatar(raw); S.avatars[i]=data;
    const ring=i<8?120:176, a0=i<8?i/8*6.2832:(i-8)/5*6.2832+.35;
    const p=prior[i]||{
      x:CX+Math.cos(a0)*ring, y:CY+Math.sin(a0)*ring,
      a:rand(0,6.28), turn:0, seed:i+1, tgt:null, wph:rand(0,6.28),
      home:a0, wf:650+(i+1)*137,
    };
    p.data=data; p.idx=avatarStage(data);
    if (p.tgt && pond.foods.includes(p.tgt) && !p.tgt.claim) p.tgt.claim=p; else p.tgt=null;
    return p;
  });
  if (pond.tgt && pond.foods.includes(pond.tgt)){
    if (pond.tgt.claim && pond.tgt.claim!==pond) pond.tgt.claim.tgt=null;
    pond.tgt.claim=pond;
  } else {
    pond.tgt=null; pond.manualFood=false;
  }
}

function pondFoodAt(x,y){
  let best=null,bd=18;
  for (const f of pond.foods){
    const d=Math.hypot(f.x-x,f.y-y);
    if (d<bd){ best=f; bd=d; }
  }
  return best;
}
function releasePondTarget(p){
  if (p.tgt && p.tgt.claim===p) p.tgt.claim=null;
  p.tgt=null;
}
function handlePondClick(x,y){
  collectGenesisClick(x,y);
  if (!genesisComplete()){
    ripples.push({x,y,r:5,a:1,crit:false});
    return;
  }
  const f=pondFoodAt(x,y);
  releasePondTarget(pond);
  pond.manualPoint=null; pond.manualFood=false;
  if (f){
    if (f.claim && f.claim!==pond){ f.claim.tgt=null; }
    f.claim=pond; pond.tgt=f; pond.manualFood=true;
  } else {
    const dx=x-CX,dy=y-CY,d=Math.hypot(dx,dy)||1,limit=R-80;
    pond.manualPoint=d>limit?{x:CX+dx/d*limit,y:CY+dy/d*limit}:{x,y};
    x=pond.manualPoint.x; y=pond.manualPoint.y;
  }
  ripples.push({x,y,r:f?7:4,a:1,crit:false});
}
/* 各游各的：目標鎖定＋個人漫游相位＋擇食分流 */
function pondSwim(p, cs, t, eatCb, formIdx, dt){
  const nav=navigationProfile(Number.isFinite(formIdx)?formIdx:(Number.isFinite(p.idx)?p.idx:0));
  const frame=Number.isFinite(dt)?Math.max(.25,Math.min(dt*60,2.25)):1;
  const motionFrame=frame*Math.max(.25,Math.min(Number(cs)||1,1.5));
  if (!Number.isFinite(p.turn)) p.turn=0;
  if (p.tgt && !pond.foods.includes(p.tgt)){ p.tgt=null; p.manualFood=false; }
  const manualPoint=p===pond && p.manualPoint;
  if (!manualPoint && !p.tgt && pond.foods.length){
    // 認領制：先挑無主之食；領域偏好：各守一方，路線自然分岔
    const cand = pond.foods.filter(f=>!f.claim || f.claim===p);
    let best=null, bs=1e18;
    for (const f of cand){
      const d=Math.hypot(f.x-p.x,f.y-p.y);
      const angTo=Math.atan2(f.y-CY,f.x-CX);
      let da=Math.abs(angTo-p.home); if (da>Math.PI) da=6.2832-da;
      const score=d*(1+0.8*da/Math.PI);
      if (score<bs){ bs=score; best=f; }
    }
    if (best){ p.tgt=best; best.claim=p; }
  }
  const steer=manualPoint||p.tgt;
  if (steer){
    const d=Math.hypot(steer.x-p.x,steer.y-p.y);
    const desired=Math.atan2(steer.y-p.y,steer.x-p.x);
    let diff=desired-p.a;
    while(diff>Math.PI)diff-=6.2832; while(diff<-Math.PI)diff+=6.2832;
    p.turn*=Math.pow(.55,motionFrame);
    p.a+=diff*(1-Math.pow(1-nav.steer,motionFrame));
    if (manualPoint && d<12){
      p.manualPoint=null;
    } else if (p.tgt && d<18){
      const eaten=p.tgt;
      pond.foods.splice(pond.foods.indexOf(eaten),1);
      eatCb(eaten); p.tgt=null; p.manualFood=false;
    }
    const playerDirected=p===pond && (!!manualPoint || !!p.manualFood);
    var sp=nav.targetSpeed*(playerDirected?manualNavigationBoost(formIdx,d,R):1);
  } else {
    const retain=Math.pow(nav.retain,motionFrame);
    const noise=(Math.random()-.5)*nav.wander*Math.sqrt(motionFrame);
    p.turn=p.turn*retain+noise;
    p.a+=(p.turn+Math.sin(t/(p.wf||820)+p.wph)*nav.sway)*motionFrame;
    var sp=nav.cruise;
  }
  p.x+=Math.cos(p.a)*sp*motionFrame;
  p.y+=Math.sin(p.a)*sp*motionFrame;
  const edge=Math.hypot(p.x-CX,p.y-CY), swimLimit=R-72;
  if (edge>swimLimit){
    const ux=(p.x-CX)/edge,uy=(p.y-CY)/edge;
    p.x=CX+ux*swimLimit; p.y=CY+uy*swimLimit;
    const back=Math.atan2(CY-p.y,CX-p.x);
    let diff=back-p.a;
    while(diff>Math.PI)diff-=6.2832; while(diff<-Math.PI)diff+=6.2832;
    p.turn*=.35;
    p.a+=diff*(1-Math.pow(1-nav.edgeSteer,motionFrame));
  }
}

function drawPond(t, raw){
  const stage=Math.max(0,Math.min(S.universeStage||0,4));
  if (!Number.isFinite(cosmosVisualStage)) cosmosVisualStage=stage;
  if (!Number.isFinite(cosmosVisualGenesis)) cosmosVisualGenesis=genesisStage();
  const visualEase=reduce?1:1-Math.exp(-Math.max(raw,0)*2.2);
  cosmosVisualStage+=(stage-cosmosVisualStage)*visualEase;
  cosmosVisualGenesis+=(genesisStage()-cosmosVisualGenesis)*visualEase;
  const visualStage=Math.max(0,Math.min(cosmosVisualStage,4));
  const cs=0.4+constantValue('c')*1.2;
  const dt=(reduce?0:raw)*cs;
  const hue=stepMix([214,192,225,246,168],visualStage)+(constantValue('alpha')-0.5)*60;
  const G=constantValue('G'), LB=constantValue('lambda'), MU=constantValue('mu');

  cx.clearRect(0,0,W,W);
  cx.save(); cx.beginPath(); cx.arc(CX,CY,R,0,6.2832); cx.clip();

  const bg=cx.createRadialGradient(CX,CY,0,CX,CY,R);
  bg.addColorStop(0,`hsl(${hue} ${stepMix([42,48,55,62,58],visualStage)}% ${stepMix([10,12,13,12,14],visualStage)}%)`);
  bg.addColorStop(1,`hsl(${hue+12} ${stepMix([52,54,60,65,62],visualStage)}% ${stepMix([3,4,4,3,5],visualStage)}%)`);
  cx.fillStyle=bg; cx.fillRect(0,0,W,W);
  cx.strokeStyle='rgba(120,160,220,.04)'; cx.lineWidth=.5;
  for (let r=0.25;r<=1;r+=0.25){ cx.beginPath(); cx.arc(CX,CY,r*R,0,6.2832); cx.stroke(); }
  drawUniverseProgress(t,visualStage,hue,cosmosVisualGenesis);

  const foodCaps=[12,20,30,44,60];
  const activeAvatars=pond.avatars.length;
  pond.spawnAcc += dt*(0.62+stage*.34+MU*.7+activeAvatars*.08);
  while (pond.spawnAcc>=1 && pond.foods.length<foodCaps[stage]+activeAvatars*2){
    pond.spawnAcc-=1;
    const a=rand(0,6.2832), rr=rand(R*0.1,R*0.6);
    pond.foods.push({x:CX+Math.cos(a)*rr,y:CY+Math.sin(a)*rr,vx:rand(-.1,.1),vy:rand(-.1,.1)});
  }

  for (let i=pond.foods.length-1;i>=0;i--){
    const f=pond.foods[i];
    let cn=null,cd=1e9;
    for (const g2 of pond.foods){
      if (g2===f) continue;
      const d=Math.hypot(g2.x-f.x,g2.y-f.y);
      if (d<cd){cd=d;cn=g2;}
    }
    if (cn && cd>6){
      f.vx += (cn.x-f.x)/cd*0.016*G*2.4;
      f.vy += (cn.y-f.y)/cd*0.016*G*2.4;
    }
    // 食物同時受到群游的弱引力；softened pull 讓它靠近而不瞬移。
    let swimmer=null,sd=1e9;
    for (const p of (genesisComplete()?[pond,...pond.avatars]:[])){
      const d=Math.hypot(p.x-f.x,p.y-f.y);
      if (d<sd){ sd=d; swimmer=p; }
    }
    if (swimmer){
      const soft=Math.max(sd,24);
      f.vx += (swimmer.x-f.x)/soft*0.006*G;
      f.vy += (swimmer.y-f.y)/soft*0.006*G;
    }
    const dxc=f.x-CX, dyc=f.y-CY, dc=Math.hypot(dxc,dyc)||1;
    f.vx += dxc/dc*0.016*LB; f.vy += dyc/dc*0.016*LB;
    f.vx*=0.97; f.vy*=0.97;
    const spd=Math.hypot(f.vx,f.vy);
    if (spd>0.42){ f.vx*=0.42/spd; f.vy*=0.42/spd; }   // 食物限速——追得到
    f.x+=f.vx*cs; f.y+=f.vy*cs;
    const edge=Math.hypot(f.x-CX,f.y-CY), foodLimit=R-64;
    if (edge>foodLimit){
      const ux=(f.x-CX)/edge,uy=(f.y-CY)/edge;
      f.x=CX+ux*foodLimit; f.y=CY+uy*foodLimit;
      f.vx*=-.35; f.vy*=-.35;
    }
    cx.fillStyle=`hsla(${hue-20+stage*5} 76% ${62+stage*2}% / ${.68+stage*.06})`;
    cx.shadowColor=`hsla(${hue-15} 90% 70% / .5)`; cx.shadowBlur=stage*1.7;
    cx.beginPath(); cx.arc(f.x,f.y,4,0,6.2832); cx.fill();
    cx.shadowBlur=0;
  }

  if (genesisComplete()){
    const heroMoveStage=navigationStage(heroStage(),S.heroCustom||{});
    pondSwim(pond, cs, t, f=>{
      const wasManual=pond.manualFood;
      const g=2*fitness()*mvMult();
      const m=.3*(stage+1);
      S.freedom+=g;
      S.materials+=m;
      ripples.push({x:f.x,y:f.y,r:4,a:1});
      if (wasManual) addFloat(f.x,f.y-10,`+${m.toFixed(1)} ${ui('materials')}`,'#8ff0d0');
    },heroMoveStage,raw);
    for (const av of pond.avatars){
      const moveData=av.data||normalizeAvatar({stage:av.idx,custom:{}});
      const avatarMoveStage=navigationStage(avatarStage(moveData),moveData.custom||{});
      pondSwim(av, cs, t, f=>{
        const g=1.5*fitness()*mvMult();
        const m=.22*(stage+1);
        S.freedom+=g;
        S.materials+=m;
        ripples.push({x:f.x,y:f.y,r:4,a:1});
      },avatarMoveStage,raw);
    }
    // 群游間距：彼此輕推——不重疊、不同步
    const all=[pond,...pond.avatars];
    for (let i=0;i<all.length;i++) for (let j=i+1;j<all.length;j++){
      const a=all[i],b=all[j];
      const d=Math.hypot(a.x-b.x,a.y-b.y);
      if (d<40 && d>0.1){
        const push=(40-d)/40*0.5;
        const ux=(a.x-b.x)/d, uy=(a.y-b.y)/d;
        a.x+=ux*push; a.y+=uy*push;
        b.x-=ux*push; b.y-=uy*push;
      }
    }

    const crowd=pond.avatars.length;
    const avatarDetail=crowd>=9?.25:crowd>=5?.4:.62;
    for (const av of pond.avatars){
      const sx=para.x,sy=para.y,sa=para.a;
      para.x=av.x; para.y=av.y; para.a=av.a;
      const data=av.data||normalizeAvatar({stage:av.idx,custom:{}});
      const idx=avatarStage(data), look=data.custom||{};
      const retinueIdx=customPartStage(look,'retinueStage',idx);
      drawRetinue(retinueIdx,t,'back',0.55,avatarDetail);
      drawParamecium(idx, band(idx), t, av.x, av.y, av.a, 0.55, look, avatarDetail);
      drawRetinue(retinueIdx,t,'front',0.55,avatarDetail);
      para.x=sx; para.y=sy; para.a=sa;
    }
    {
      const sx=para.x,sy=para.y,sa=para.a;
      para.x=pond.x; para.y=pond.y; para.a=pond.a;
      const idx=heroStage(), look=S.heroCustom||{};
      const retinueIdx=customPartStage(look,'retinueStage',idx);
      drawRetinue(retinueIdx,t,'back',0.66,.82);
      drawParamecium(idx,band(idx),t,pond.x,pond.y,pond.a,0.66,look,.82);
      drawRetinue(retinueIdx,t,'front',0.66,.82);
      para.x=sx; para.y=sy; para.a=sa;
    }
  }
  drawRipples();
  drawFloats();

  cx.restore();
  cx.strokeStyle='rgba(29,74,99,.9)'; cx.lineWidth=2;
  cx.beginPath(); cx.arc(CX,CY,R,0,6.2832); cx.stroke();
}

</script>
<script>
/* ===== food.js ===== */
/* ═══════════════════════════════════════════════════════════
   草履蟲奇點 · 食物系統 v3
   小食 / 大食（吃掉過去的你）/ 稀有（簽名事件）
   稀有溶解＝自動以 50% 強度觸發（Ia 型除外——拒絕它必須是選擇）
   ═══════════════════════════════════════════════════════════ */

let foods = [];
let foodTimer = 0;

function spawnInterval(){ return 4.5 / foodSpawnMult(); }

function spawnFood(){
  if (S.phase !== 'mortal') return;
  const roll = Math.random()*(FOOD.small.weight+FOOD.big.weight+FOOD.rare.weight);
  let kind;
  if (roll < FOOD.small.weight) kind='small';
  else if (roll < FOOD.small.weight+FOOD.big.weight) kind='big';
  else kind='rare';
  if (kind==='rare' && !STAGES[S.stage].sig) kind='big';

  const a = rand(0,6.2832), r = rand(R*0.2, R*0.82);
  foods.push({
    x:CX+Math.cos(a)*r, y:CY+Math.sin(a)*r,
    vx:rand(-.2,.2), vy:rand(-.2,.2),
    kind, age:0,
  });
}

function updateFood(dt){
  const pull = gravPull();
  const cr = contactRadius();
  const life = foodLifetime();
  for (let i=foods.length-1;i>=0;i--){
    const f = foods[i];
    // 階段引力：恆星微吸、簡併中吸、視界強吸
    if (pull > 0){
      const dx=para.x-f.x, dy=para.y-f.y, d=Math.hypot(dx,dy)||1;
      f.vx += dx/d*pull; f.vy += dy/d*pull;
      f.vx*=0.995; f.vy*=0.995;
    }
    // 碰到即吞：漂進身體的，就是你的（視界帶半徑更大）
    if (Math.hypot(f.x-para.x, f.y-para.y) < cr && f.kind!=='rare'){
      eatFood(f); continue;
    }
    f.x+=f.vx; f.y+=f.vy;
    const d=Math.hypot(f.x-CX,f.y-CY);
    if (d>R*0.85){ f.vx*=-1; f.vy*=-1; }
    f.age += dt;
    if (f.age > life){
      foods.splice(i,1);
      // 稀有溶解：自動以 50% 觸發（noAuto 例外）
      if (f.kind==='rare'){
        const sig = STAGES[S.stage].sig;
        if (sig && !EVENTS[sig].noAuto){
          const echo=rareEchoStrength();
          say(isEn()
            ? `The rare mote dissolves — its power echoes at ${Math.round(echo*100)}% strength.`
            : `稀有食物溶解了——它的力量仍以 ${Math.round(echo*100)}% 強度迴響。`);
          triggerEvent(sig, echo);
        }
      }
    }
  }
}

function drawFood(t){
  const life = foodLifetime();
  for (const f of foods){
    const conf = FOOD[f.kind];
    const remain = 1 - f.age/life;
    const pulse = 0.7 + Math.sin(t/300+f.x)*0.3;
    const sz = f.kind==='rare'?9 : f.kind==='big'?6.5 : 4.5;
    const tidal=activeEvent&&activeEvent.spaghetti;
    const tidalDur=tidal?Math.max(EVENTS[activeEvent.id].dur||20,0.001):1;
    const stretch=tidal?Math.min((activeEvent.elapsed||0)/tidalDur,1)*Math.max(0,activeEvent.str||1):0;
    const angle=tidal?Math.atan2(f.y-para.y,f.x-para.x):0;
    const longR=sz*(1+2.4*stretch), shortR=Math.max(sz*0.42,sz*(1-0.45*stretch));
    cx.save();
    cx.globalAlpha = Math.max(0.15,remain)*pulse;
    cx.fillStyle = conf.color;
    cx.shadowColor = conf.color;
    cx.shadowBlur = f.kind==='rare'?16:8;
    cx.beginPath(); cx.ellipse(f.x,f.y,longR,shortR,angle,0,6.2832); cx.fill();
    if (tidal && stretch>0.04){
      cx.globalAlpha=Math.max(0.1,remain)*stretch*0.42;
      cx.strokeStyle=conf.color; cx.lineWidth=Math.max(0.7,shortR*0.22);
      cx.beginPath();
      cx.moveTo(f.x-Math.cos(angle)*longR*1.65,f.y-Math.sin(angle)*longR*1.65);
      cx.lineTo(f.x+Math.cos(angle)*longR*1.65,f.y+Math.sin(angle)*longR*1.65);
      cx.stroke();
    }
    if (f.kind==='rare'){
      cx.globalAlpha = remain*0.5;
      cx.strokeStyle = conf.color; cx.lineWidth=1;
      const halo=6+Math.sin(t/200)*3;
      cx.beginPath(); cx.ellipse(f.x,f.y,longR+halo,shortR+halo,angle,0,6.2832); cx.stroke();
    }
    cx.restore();
  }
}

function foodAt(x,y){
  for (let i=foods.length-1;i>=0;i--){
    const f=foods[i];
    if (Math.hypot(f.x-x,f.y-y) < (f.kind==='rare'?14:11)) return f;
  }
  return null;
}

function eatFood(f){
  const idx = foods.indexOf(f);
  if (idx<0) return;
  const personallyTargeted=typeof pendingEat!=='undefined' && pendingEat===f;
  const stageAtEat=S.stage;
  foods.splice(idx,1);

  if (activeEvent && activeEvent.spaghetti) settleTidalEvent(true);
  if (activeEvent && activeEvent.holdReward) activeEvent.holdAccum*=0.5;

  if (f.kind==='rare'){
    const sig = STAGES[S.stage].sig;
    if (sig){ triggerFlash(); triggerEvent(sig, 1); }
    onAte();
    recordAchievementEvent('food',{manual:personallyTargeted,rare:true,stage:stageAtEat});
    if (typeof renderStats==='function') renderStats();
    return;
  }

  const gainSec = f.kind==='big' ? FOOD.big.mult : FOOD.small.mult;
  const g = rate()*gainSec*foodRewardMult();
  S.bio+=g; S.earned+=g; S.lifetime+=g;
  onAte();
  recordAchievementEvent('food',{manual:personallyTargeted,rare:false,stage:stageAtEat});
  ripples.push({x:f.x,y:f.y,r:4,a:1});
  if (typeof addFloat==='function') addFloat(f.x, f.y-12, '+'+plain(g), f.kind==='big'?'#ffc46b':'#5ce0c0');
  const st = STAGES[S.stage];
  const label = f.kind==='big' ? tr(st,'big') : (isEn()?smallFoodSkinEn(st.n):smallFoodSkin(st.n));
  say(isEn() ? `Devoured ${label}: +${plain(g)} life-force.` : `吞下${label}：+${plain(g)} 生命力。`);
  if (typeof renderStats==='function') renderStats();
}

/* ── 事件呼叫 ── */
function detonateAllFood(s){
  s = s===undefined?1:s;
  let total=0;
  for (const f of foods){
    const gainSec = f.kind==='big'?FOOD.big.mult:FOOD.small.mult;
    total += rate()*gainSec*foodRewardMult()*s;
    ripples.push({x:f.x,y:f.y,r:4,a:1});
  }
  foods = foods.filter(f=>f.kind==='rare');
  if (total>0){
    S.bio+=total;S.earned+=total;S.lifetime+=total;
    say(isEn()?`Full-field detonation: +${plain(total)} life-force.`:`全場引爆：+${plain(total)} 生命力。`, true);
  }
}
function scatterAllFood(){
  for (const f of foods){
    const a=Math.atan2(f.y-CY,f.x-CX);
    f.vx=Math.cos(a)*2; f.vy=Math.sin(a)*2;
  }
  say(isEn()?'Food hurled to the edges. Chase it.':'食物被推向視野邊緣。追上去。');
}
function chainEatFood(s){
  s = s===undefined?1:s;
  let total=0;
  for (const f of foods){
    const gainSec = f.kind==='big'?FOOD.big.mult:FOOD.small.mult;
    total += rate()*gainSec*foodRewardMult()*s;
  }
  foods=[];
  S.bio+=total;S.earned+=total;S.lifetime+=total;
  onAte();
  say(isEn()?`Strange-matter chain — the whole field becomes you: +${plain(total)}.`:`奇異物質連鎖轉換，全場化為己有：+${plain(total)}。`, true);
}

</script>
<script>
/* ===== ui.js ===== */
/* ═══════════════════════════════════════════════════════════
   草履蟲奇點 · UI 層 v3
   ═══════════════════════════════════════════════════════════ */

const $ = id => document.getElementById(id);
let buyAmt = '1';   // '1' | '10' | '100' | 'max'

/* ── 手機升級抽屜：不寫入存檔，只整理既有系統的入口與可購買數量 ── */
const mobileDrawerUI={
  open:false, initialized:false, signature:'', suppressClick:false,
  panel:{mortal:'mortal-structures',singularity:'sing-progress'}, drag:null,
};
function mobileDrawerMode(){
  if (typeof matchMedia!=='function') return false;
  return matchMedia('(max-width:900px) and (min-height:521px), (max-width:560px) and (orientation:portrait)').matches;
}
function mobileDrawerPhase(){ return S.phase==='singularity'?'singularity':'mortal'; }
function mobileDrawerDefinitions(){
  return mobileDrawerPhase()==='singularity'
    ? [
      {key:'sing-progress',label:ui('creation')},
      {key:'sing-economy',label:ui('laws')},
      {key:'sing-permanent',label:ui('mobileRemnants')},
      {key:'sing-forms',label:ui('shoal')},
      {key:'records',label:ui('records')},
    ]
    : [

function drawerTranslateY(element){
  if (!element || typeof getComputedStyle!=='function') return 0;
  const value=getComputedStyle(element).transform;
  if (!value || value==='none') return 0;
  const open=value.indexOf('('),parts=open>=0?value.slice(open+1,-1).split(',').map(Number):[];
  const y=value.startsWith('matrix3d')?parts[13]:parts[5];
  return Number.isFinite(y)?Math.max(0,y):0;
}
function mobileDrawerClosedOffset(drawer,fallback){
  if (!drawer || !drawer.classList.contains('drawer-open')){
    const current=drawerTranslateY(drawer);
    return current>0?current:fallback;
  }
  const previousTransition=drawer.style.transition;
  drawer.style.transition='none';
  drawer.classList.remove('drawer-open');
  const closed=drawerTranslateY(drawer)||fallback;
  drawer.classList.add('drawer-open');
  drawer.style.transition=previousTransition;
  return closed;
}
function initMobileUpgradeDrawer(){
  if (mobileDrawerUI.initialized) return;
  const drawer=$('upgrade-drawer'),head=$('mobile-drawer-head'),nav=$('mobile-category-nav');
  if (!drawer || !head || !nav || typeof head.addEventListener!=='function') return;
  mobileDrawerUI.initialized=true;
  head.addEventListener('click',()=>{
    if (mobileDrawerUI.suppressClick){ mobileDrawerUI.suppressClick=false; return; }
    if (mobileDrawerMode()) setMobileDrawerOpen(!mobileDrawerUI.open);
  });
  head.addEventListener('pointerdown',event=>{
    if (!mobileDrawerMode()) return;
    const visible=(head.offsetHeight||52)+(nav.offsetHeight||58);
    const fallbackClosed=Math.max(0,(drawer.offsetHeight||0)-visible);
    const actualOffset=drawerTranslateY(drawer);
    const closed=mobileDrawerClosedOffset(drawer,fallbackClosed);
    const startOffset=Math.max(0,Math.min(closed,actualOffset));
    mobileDrawerUI.drag={id:event.pointerId,startY:event.clientY,startOffset,closed,current:startOffset,moved:false};
    drawer.classList.add('drawer-dragging');
    if (typeof head.setPointerCapture==='function') head.setPointerCapture(event.pointerId);
  });
  head.addEventListener('pointermove',event=>{
    const drag=mobileDrawerUI.drag; if (!drag || drag.id!==event.pointerId) return;
    const delta=event.clientY-drag.startY;
    drag.moved=drag.moved||Math.abs(delta)>7;
    drag.current=Math.max(0,Math.min(drag.closed,drag.startOffset+delta));
    drawer.style.transform=`translateY(${drag.current}px)`;
  });
  const finishDrag=event=>{
    const drag=mobileDrawerUI.drag; if (!drag || drag.id!==event.pointerId) return;
    mobileDrawerUI.drag=null; drawer.classList.remove('drawer-dragging'); drawer.style.transform='';
    if (drag.moved){
      mobileDrawerUI.suppressClick=true;
      const delta=event.clientY-drag.startY;
      setMobileDrawerOpen(delta<-32?true:delta>32?false:drag.current<drag.closed*.52);
    }
  };
  head.addEventListener('pointerup',finishDrag);
  head.addEventListener('pointercancel',finishDrag);
  if (typeof addEventListener==='function') addEventListener('resize',()=>{
    drawer.style.transform=''; drawer.classList.remove('drawer-dragging'); renderMobileUpgradeDrawer();
  },{passive:true});
  renderMobileUpgradeDrawer();
}

const bNodes = {};
function buildShop(){
  const shop = $('shop');
  shop.innerHTML = '';
  let curLayer = null;
  for (const b of BUILDINGS){
    if (b.layer!==curLayer){
      curLayer=b.layer;
      const h=document.createElement('div');
      h.className='layer-h'; h.id='layer-'+b.layer;
      h.textContent = (isEn()?LAYER_NAME_EN[b.layer]:LAYER_NAME[b.layer]) + (isEn()?' Tier':'層');
      shop.appendChild(h);
    }
    const el=document.createElement('button');
    el.className='item';
    el.innerHTML=`
      <span class="nm">${tr(b,'name')}</span><span class="qty num"></span>
      <span class="ds">${tr(b,'ds')}</span>
      <span class="stat num"></span>
      <span class="price num"></span>
      <span class="bar"></span>`;
    el.onclick=()=>{
      const k = buyAmt==='max' ? Math.max(maxBuy(b),0) : parseInt(buyAmt);
      if (k<=0) return;
      const c=cost(b,k);
      if (S.bio<c) return;
      S.bio-=c; S.owned[b.id]+=k;
      checkBuildingAchievements();
      if (S.owned[b.id]===k) say(isEn()?`First ${b.nameEn} acquired — ${b.dsEn}.`:`獲得第一個「${b.name}」——${b.ds}。`);
      renderShop(); renderStats(); save();
    };
    shop.appendChild(el);
    bNodes[b.id]=el;
  }
}

function renderShop(){
  const total = rate()||1;
  for (const b of BUILDINGS){
    const el=bNodes[b.id];
    const layerOK = S.stage >= (LAYER_UNLOCK[b.layer]-1);
    const h=$('layer-'+b.layer);
    if (h) h.style.display = layerOK?'':'none';
    if (!layerOK){ el.style.display='none'; continue; }
    const visible = S.earned>=b.base*0.35 || S.owned[b.id]>0;
    el.style.display = visible?'':'none';
    if (!visible) continue;

    const k = buyAmt==='max' ? maxBuy(b) : parseInt(buyAmt);
    const kShow = Math.max(k,1);
    const c = cost(b,kShow);
    el.disabled = k<=0 || S.bio<c;

    const owned=S.owned[b.id];
    const mm=mileMult(b);
    const each=b.rate*mm*outMult();
    const sub=owned*each;
    const pct=sub/total*100;
    // 里程碑釘
    let pips='';
    const reached=MILESTONES.filter(m=>owned>=m).length;
    if (owned>0) pips=' '+ '●'.repeat(reached)+'○'.repeat(MILESTONES.length-reached);
    el.querySelector('.qty').innerHTML=(owned||'')+`<span class="pips">${pips}</span>`;
    el.querySelector('.stat').innerHTML =
      `${fmt(each)}/s · ${fmt(sub)}/s · ${pct<0.1?'<0.1':pct.toFixed(1)}%` + (mm>1?` · ×${mm}`:'');
    el.querySelector('.price').innerHTML =
      (buyAmt==='max' ? `×${k} · `:(buyAmt!=='1'?`×${kShow} · `:'')) + fmt(c);
    el.querySelector('.bar').style.width = Math.min(S.bio/c*100,100)+'%';
  }
}

  if (next){ next.textContent=isEn()?'Next →':'下一階 →'; next.disabled=idx>=max; }
  drawScaleCodexPreview(performance.now());
}
function drawScaleCodexPreview(t){
  const pc=$('scale-codex-preview');
  if (!pc||typeof pc.getContext!=='function'||!Number.isFinite(activeScaleCodexStage)) return false;
  const idx=Math.max(0,Math.min(activeScaleCodexStage,scaleCodexUnlockedMax()));
  // 圖鑑使用與主畫布相同的 900×900 模型座標，再縮放到實際 backing store。
  // 本體、固定長度纖毛、噴流與環繞結構因而保持與遊戲視野完全相同的比例。
  const pw=360, ph=360, model=900;
  const cssWidth=Math.max(1,Number(pc.clientWidth)||pw);
  const dpr=Math.max(1,Math.min(Number(window.devicePixelRatio)||1,2.5));
  const targetWidth=Math.max(pw,Math.round(cssWidth*dpr));
  const targetHeight=Math.max(ph,Math.round(targetWidth*ph/pw));
  if (pc.width!==targetWidth||pc.height!==targetHeight){ pc.width=targetWidth; pc.height=targetHeight; }
  const pcx=pc.getContext('2d'); if(!pcx) return false;
  const accent=BODY_COLOR[idx]||'#5ce0c0';
  const old={cx,W,R,CX,CY,x:para.x,y:para.y,a:para.a};
  pcx.save();
  try {
    pcx.setTransform(pc.width/model,0,0,pc.height/model,0,0);
    pcx.clearRect(0,0,model,model);
    const bg=pcx.createRadialGradient(model*.5,model*.48,10,model*.5,model*.5,model*.62);
    bg.addColorStop(0,hexA(accent,.16)); bg.addColorStop(.52,'rgba(7,24,36,.97)'); bg.addColorStop(1,'rgba(2,9,16,1)');
    pcx.fillStyle=bg; pcx.fillRect(0,0,model,model);
    pcx.strokeStyle=hexA(accent,.12); pcx.lineWidth=1.6;
    for(const rr of [90,180,270]){ pcx.beginPath(); pcx.ellipse(model*.5,model*.5,rr,rr*.52,0,0,6.2832); pcx.stroke(); }
    cx=pcx; W=model; R=model*.49; CX=model*.5; CY=model*.5;
    para.x=CX; para.y=CY; para.a=-.12;
    const scale=scaleCodexPortraitScale(idx);
    drawRetinue(idx,t||0,'back',scale,1);
    drawParamecium(idx,band(idx),t||0,CX,CY,-.12,scale,null,1);
    drawRetinue(idx,t||0,'front',scale,1);
  } finally {
    pcx.restore();
    cx=old.cx; W=old.W; R=old.R; CX=old.CX; CY=old.CY;
    para.x=old.x; para.y=old.y; para.a=old.a;
  }
  return true;
}

let achievementToastTimer=0,achievementToastActive=false,achievementToastQueue=[];
function pumpAchievementToast(){
  if (achievementToastActive || !achievementToastQueue.length) return;
  const el=$('achievement-toast');
  if (!el){ achievementToastQueue=[]; return; }
  achievementToastActive=true;
  el.textContent=achievementToastQueue.shift();
  el.classList.add('show');
  achievementToastTimer=setTimeout(()=>{
    el.classList.remove('show');
    achievementToastTimer=setTimeout(()=>{
      achievementToastActive=false;
      pumpAchievementToast();
    },260);
  },4000);
}

function transitionFact(label,value,kind){
  return `<div class="transition-fact ${kind||''}"><small>${label}</small><b>${value}</b></div>`;
}
function setTransitionProgress(brief,value){
  if (!brief||!brief.style) return;
  if (typeof brief.style.setProperty==='function') brief.style.setProperty('--transition-progress',value);
  else brief.style['--transition-progress']=value;
}
function renderTransitionBrief(mode,next,thr,reconstruction){
  const brief=$('transition-brief'); if (!brief) return;
  const current=STAGES[S.stage];
  if (mode==='ready'){
    setTransitionProgress(brief,'100%');
    brief.innerHTML=`<div class="transition-route"><span class="from">${isEn()?'FINAL SCALE':'最終尺度'}</span><span class="to">${isEn()?'Singularity':'奇點'}</span><span class="threshold">10<sup>68</sup> · ${isEn()?'journey complete':'尺度之路完成'}</span></div><div class="transition-meter"><span></span></div><div class="transition-facts">${transitionFact(isEn()?'NEXT':'下一步',isEn()?'Creation replaces growth':'以創造取代生長','reward')}${transitionFact(isEn()?'PRESERVED':'永遠保留',isEn()?'Legacy · Codex · achievements':'傳承 · 圖鑑 · 成就')}${transitionFact(isEn()?'FORM':'形態',isEn()?'All discovered memories remain':'已發現形態皆保留')}${transitionFact(isEn()?'RESET':'轉化',isEn()?'Mortal structures end here':'凡人構造在此終結')}</div>`;
    return;
  }
  if (mode==='fold'){
    const exponent=Math.floor(Math.log10(Math.max(S.lifetime,1)));
    const folds=Math.max(0,Math.min(42,exponent-26));
    const pct=folds/42*100;
    setTransitionProgress(brief,`${pct.toFixed(2)}%`);
    brief.innerHTML=`<div class="transition-route"><span class="from">${isEn()?'HUBBLE-VOLUME FOLDING':'哈伯體積折疊'}</span><span class="to">${folds} / 42</span><span class="threshold">10<sup>${exponent}</sup> → 10<sup>68</sup></span></div><div class="transition-meter"><span></span></div><div class="transition-facts">${transitionFact(isEn()?'EACH FOLD':'每次折疊',isEn()?'Equivalent accumulation ×10':'等效累積 ×10','reward')}${transitionFact(isEn()?'INTERVAL':'下一次',`${Math.ceil(mergeInterval())} ${isEn()?'sec':'秒'}`)}${transitionFact(isEn()?'PRESERVED':'永遠保留',isEn()?'Spores · legacy · Codex':'孢 · 傳承 · 圖鑑')}${transitionFact(isEn()?'DESTINATION':'終點',isEn()?'Become the singularity':'成為奇點')}</div>`;
    return;
  }
  const safeThr=Math.max(1,Number(thr)||1);
  const progress=Math.max(0,Math.min(1,S.earned/safeThr));
  const remaining=Math.max(0,safeThr-S.earned);
  const reward=sporeGainFor(Math.max(S.earned,safeThr),S.stage);
  const legacy=LEGACY.find(l=>l.idx===S.stage);
  setTransitionProgress(brief,`${(progress*100).toFixed(2)}%`);
  const route=`${tr(current,'name')} → ${tr(next,'name')}`;
  const threshold=remaining>0
    ? (isEn()?`${fmt(S.earned)} / ${fmt(safeThr)} · ${fmt(remaining)} remaining`:`${fmt(S.earned)} / ${fmt(safeThr)} · 尚缺 ${fmt(remaining)}`)
    : (isEn()?`${fmt(S.earned)} / ${fmt(safeThr)} · ready`:`${fmt(S.earned)} / ${fmt(safeThr)} · 已達標`);
  const legacyText=legacy
    ? `${tr(legacy,'name')} · ${tr(legacy,'ds')}`
    : (isEn()?'No signature legacy at this crossing':'本次沒有簽名傳承');
  const rebuild=reconstruction>1?` · ${isEn()?'rebuild':'重建'} ×${reconstruction.toFixed(2)}`:'';
  brief.innerHTML=`<div class="transition-route"><span class="from">${isEn()?'CURRENT → NEXT':'目前 → 下一尺度'}</span><span class="to">${route}</span><span class="threshold">${threshold}</span></div><div class="transition-meter"><span></span></div><div class="transition-facts">${transitionFact(isEn()?'REWARD':'預估獲得',`+${reward} ${ui('spore')}${rebuild}`,'reward')}${transitionFact(isEn()?'LEGACY':'即將覺醒',legacyText)}${transitionFact(isEn()?'PRESERVED':'保留',isEn()?'Lifetime · spores · permanent powers':'累計生命 · 孢 · 永久強化')}${transitionFact(isEn()?'RESET':'重置',isEn()?'Spendable life-force · structures':'可用生命力 · 構造')}</div>`;
}
function renderCollapse(){
  const btn=$('collapse');
  const secH=$('trans-h');
  secH.textContent = ui('transition');

  // 就緒：成為奇點
  if (S.stage>=STAGES.length-1 && S.lifetime>=SINGULARITY_THR && S.phase==='mortal'){
    btn.className='collapse singularity-ready';
    btn.disabled=false;
    btn.textContent=ui('ready');
    btn.onclick=()=>{ if(confirm(isEn()?'Become the singularity itself? You will no longer grow — you will create.':'成為奇點？此後生長止息，創造開始。')) enterSingularity(); };
    $('collapse-note').innerHTML = isEn()
      ? `Cumulative life-force has reached 「Immeasurable」. There is no larger scale ahead.`
      : `累積生命力已抵「無量大數」。尺度之路，至此走盡。`;
    renderTransitionBrief('ready');

  }
  // 最終階：哈伯尺度折疊中
  if (S.stage>=STAGES.length-1 && S.phase==='mortal'){
    btn.className='collapse'; btn.disabled=true; btn.onclick=null;

    const eNow=Math.floor(Math.log10(Math.max(S.lifetime,1)));
    $('collapse-note').innerHTML = isEn()
      ? `Structures are maxed. You are folding neighbouring observer-centred Hubble volumes into one scale — a game abstraction, not physical shells. Each fold multiplies equivalent accumulation by 10. Now at 10<sup>${eNow}</sup>; at 10<sup>68</sup> 「Immeasurable」 you become the singularity.`
      : `構造已至極限。如今你把相鄰觀測中心所定義的哈伯體積折入同一尺度——這是遊戲抽象，不是實體球殼。每次折疊讓等效累積十倍。目前 10<sup>${eNow}</sup>；抵達 10<sup>68</sup>「無量大數」之日，你將成為奇點。`;
    renderTransitionBrief('fold');
    return;
  }

  const verb=ui(verbFor(S.stage));
  const ok=canCollapse();
  btn.className='collapse';
  btn.disabled=!ok;
  btn.onclick=()=>{ if(ok) doCollapse(); };
  const next=STAGES[Math.min(S.stage+1,STAGES.length-1)];
  const g=sporeGain();
  const reconstruction=cosmicReconstructionMult(Math.min(S.stage+1,STAGES.length-1));
  btn.textContent = ok ? `${verb} → ${tr(next,'name')} · +${g} ${ui('spore')}` : verb;
  const thr=STAGES[S.stage].thr;
  $('collapse-note').innerHTML = ok
    ? (reconstruction>1
      ? (isEn()?`${verb} grants ${g} spores. Cosmic Reconstruction rises to ×${reconstruction.toFixed(2)}; structures reset, but familiar cosmic patterns rebuild faster.`:`${verb}換得 ${g} 顆孢。星海重建提升至 ×${reconstruction.toFixed(2)}；構造仍會歸零，但熟悉的宇宙圖樣將更快重現。`)
      : (isEn()?`${verb} wipes all structures for ${g} spores — permanent upgrades below.`:`${verb}抹去所有構造，換 ${g} 顆孢。孢可在下方商店永久強化。`))
    : (isEn()?`Reach ${fmt(thr)} to ${verb.toLowerCase()} into "${next.nameEn}". Spores persist.`:`累積達 ${fmt(thr)} 後可${verb}成「${next.name}」。孢跨越躍遷保留。`);
  renderTransitionBrief('normal',next,thr,reconstruction);
}

function peekMorphTarget(ref){
  if (ref==='hero') return {kind:'hero',stage:heroStage(),custom:S.heroCustom||{}};
  const m=/^avatar:(\d+)$/.exec(String(ref||''));
  if (!m) return null;
  const slot=Number(m[1]), av=S.avatars&&S.avatars[slot];
  if (!av) return null;
  return {kind:'avatar',slot,stage:avatarStage(av),custom:av.custom||{}};
}
function morphColorStage(target,key){
  const part={bodyColor:'bodyStage',ciliaColor:'ciliaStage',appendageColor:'appendageStage',coreColor:'coreStage',auraColor:'auraStage'}[key];
  return customPartStage(target.custom,part,target.stage);
}
function naturalMorphColor(target,key){
  const idx=morphColorStage(target,key);
  if (key==='coreColor') return naturalCoreColor(idx);
  if (key==='auraColor') return naturalAuraColor(idx);
  return BODY_COLOR[idx]||'#5ce0c0';
}
function currentMorphColor(target,key){ return target.custom[key]||naturalMorphColor(target,key); }
function updateMorphPalette(){
  const target=peekMorphTarget(activeMorphTarget), palette=$('morph-palette');
  if (!target || !palette || !palette.querySelectorAll) return;
  const current=currentMorphColor(target,activeMorphColorKey).toLowerCase();
  palette.querySelectorAll('.morph-swatch').forEach(btn=>btn.classList.toggle('on',String(btn.dataset.color).toLowerCase()===current));
}
function drawMorphPreview(t){
  const pc=$('morph-preview'), target=peekMorphTarget(activeMorphTarget);
  if (!pc || !target || typeof pc.getContext!=='function') return;
  if (typeof pc.getBoundingClientRect==='function'){
    const rect=pc.getBoundingClientRect(), dpr=Math.min(Math.max(Number(globalThis.devicePixelRatio)||1,1),3);
    const nextW=Math.max(1,Math.round(rect.width*dpr)), nextH=Math.max(1,Math.round(rect.height*dpr));
    if (rect.width>0 && rect.height>0 && (pc.width!==nextW || pc.height!==nextH)){
      pc.width=nextW; pc.height=nextH;
    }
  }
  const pcx=pc.getContext('2d'); if (!pcx) return;
  const pw=pc.width||360, ph=pc.height||220;
  pcx.clearRect(0,0,pw,ph);
  const bg=pcx.createRadialGradient(pw*.5,ph*.48,5,pw*.5,ph*.48,pw*.52);
  bg.addColorStop(0,'rgba(18,50,65,.92)'); bg.addColorStop(.62,'rgba(7,23,35,.96)'); bg.addColorStop(1,'rgba(3,12,20,1)');
  pcx.fillStyle=bg; pcx.fillRect(0,0,pw,ph);
  pcx.strokeStyle='rgba(92,224,192,.08)'; pcx.lineWidth=.7;
  for (const rr of [34,68,102]){ pcx.beginPath(); pcx.ellipse(pw*.5,ph*.5,rr,rr*.55,0,0,6.2832); pcx.stroke(); }

  const old={cx,W,R,CX,CY,x:para.x,y:para.y,a:para.a};
  try {
    cx=pcx; W=pw; R=Math.min(pw,ph)*.49; CX=pw*.5; CY=ph*.5;
    para.x=CX; para.y=CY; para.a=-.12;
    const idx=target.stage, look=target.custom||{}, retinueIdx=customPartStage(look,'retinueStage',idx);
    drawRetinue(retinueIdx,t||0,'back',.72,.9);
    drawParamecium(idx,band(idx),t||0,CX,CY,-.12,.72,look,.9);
    drawRetinue(retinueIdx,t||0,'front',.72,.9);
  } finally {
    cx=old.cx; W=old.W; R=old.R; CX=old.CX; CY=old.CY;
    para.x=old.x; para.y=old.y; para.a=old.a;
  }
}
function updateMorphPanel(){
  if (S.phase!=='singularity') return;

  }

  const legend=$('morph-legend');

  updateMorphPalette();
