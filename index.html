<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#06121c">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="草履蟲奇點">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./apple-touch-icon.svg">
<title>草履蟲奇點 · Paramecium Singularity</title>
<style>
:root{
  --void:#06121c; --slide:#0a1c29; --cyto:#10303f; --line:#1d4a63;
  --glow:#5ce0c0; --nucleus:#ff6b9d; --amber:#ffc46b;
  --ink:#8fb3c4; --ink-dim:#4f7488;
  --font-display:"Songti TC","Noto Serif CJK TC","Source Han Serif TC",Georgia,serif;
  --font-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html{height:100%;-webkit-text-size-adjust:100%;background:var(--void);touch-action:manipulation}
body{height:100%;min-height:100dvh;touch-action:manipulation}
body{background:var(--void);color:var(--ink);font-family:var(--font-display);
  -webkit-font-smoothing:antialiased;overflow:hidden;overscroll-behavior-y:none}
.num{font-family:var(--font-mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
sup{font-size:.62em;vertical-align:super}
button,summary{font-family:inherit;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
@media (hover:none) and (pointer:coarse){
  button,summary{-webkit-user-select:none;user-select:none}
}

header{display:flex;align-items:baseline;gap:1.3rem;flex-wrap:wrap;
  padding:.85rem max(1.4rem,env(safe-area-inset-right)) .85rem max(1.4rem,env(safe-area-inset-left));border-bottom:1px solid var(--line);
  background:linear-gradient(180deg,#0a1a26,#06121c)}
.brand{font-size:.72rem;letter-spacing:.32em;color:var(--ink-dim);text-transform:uppercase;margin-right:auto}
.brand b{color:var(--glow);font-weight:400}
.readout{display:flex;align-items:baseline;gap:.45rem}
.readout .label{font-size:.66rem;letter-spacing:.2em;color:var(--ink-dim)}
.readout .val{font-size:1.45rem;color:var(--amber)}
.readout .val.small{font-size:.98rem;color:var(--glow)}
.readout .unit{font-size:.82rem;color:var(--amber);letter-spacing:.05em}
#bio{display:inline-block;min-width:7.6ch;font-variant-numeric:tabular-nums}
#bio.life-tick{animation:lifeTick .18s ease-out}
@keyframes lifeTick{0%{color:#fff5cf;text-shadow:0 0 12px rgba(255,196,107,.72);transform:translateY(-1px)}100%{color:var(--amber);text-shadow:none;transform:translateY(0)}}
.badge{font-size:.68rem;color:var(--glow);border:1px solid var(--glow);
  border-radius:2px;padding:.15rem .5rem;letter-spacing:.08em}
#langbtn{background:transparent;border:1px solid var(--line);color:var(--ink);
  border-radius:2px;padding:.2rem .6rem;font-size:.72rem;cursor:pointer;letter-spacing:.1em}
#langbtn:hover{border-color:var(--glow)}

main{display:grid;grid-template-columns:1fr 23rem;height:calc(100dvh - 3.3rem)}
.field{position:relative;display:grid;place-items:center;padding:1.1rem;min-width:0;min-height:0}
.scope-stack{width:min(100%,62vh);max-height:100%;display:flex;flex-direction:column;align-items:stretch;gap:.55rem}
.scope-frame{position:relative;width:100%;aspect-ratio:1;display:grid;place-items:center;min-height:0}
canvas{width:100%;aspect-ratio:1;border-radius:50%;cursor:crosshair;
  box-shadow:0 0 0 1px var(--line),0 0 90px -10px #0d4a58 inset,0 0 60px -30px #5ce0c0;
  touch-action:none}
.scope-meta{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:.42rem .65rem;align-items:center;
  width:100%;padding:.48rem .62rem;border:1px solid rgba(29,74,99,.7);border-radius:2px;
  background:linear-gradient(90deg,rgba(11,34,48,.82),rgba(9,25,39,.72))}
.scope-summary{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:.35rem .65rem;min-width:0;width:100%}
/* 紀元恢復為最初的顯微鏡中上讀數；定位基準是圓形視野本身。 */
.scope-frame>.epoch{position:absolute;top:clamp(.65rem,5%,1.5rem);left:50%;z-index:2;
  transform:translateX(-50%);width:min(76%,18rem);text-align:center;pointer-events:none;
  white-space:nowrap;opacity:.9;text-shadow:0 1px 6px var(--void),0 0 12px rgba(6,18,28,.9)}
.scope-frame>.epoch .n,.scope-frame>.epoch .t{display:block;overflow:hidden;text-overflow:ellipsis}
.scope-frame>.epoch .n{font-size:.6rem;letter-spacing:.3em;color:var(--ink-dim);font-family:var(--font-mono)}
.scope-frame>.epoch .t{font-size:1.05rem;color:var(--ink);letter-spacing:.14em;margin-top:.15rem}
.identity{min-width:0}
.identity .sn{font-size:.79rem;color:var(--glow);letter-spacing:.09em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.identity .scope-size-note{margin-top:.16rem;font-size:.61rem;color:var(--ink-dim);font-family:var(--font-mono);
  letter-spacing:.015em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.event-banner{display:flex;align-items:center;justify-content:flex-end;gap:.48rem;min-width:0;
  padding:.28rem .52rem;border:1px solid var(--nucleus);border-radius:2px;background:rgba(255,107,157,.08)}
#scope-status-host{display:block;width:100%;padding:.45rem .62rem;border:1px solid rgba(92,224,192,.24);
  border-radius:2px;background:linear-gradient(90deg,rgba(92,224,192,.05),rgba(201,160,255,.025));
  box-shadow:0 12px 28px -24px var(--glow)}
.acquisition-title{display:block;margin-bottom:.2rem;font-family:var(--font-display);font-size:.57rem;
  letter-spacing:.2em;color:var(--glow);text-transform:uppercase}
.journal-head{display:block;margin-bottom:.22rem}
.journal-head .acquisition-title{margin-bottom:0}
.sing-stats-title{display:block;margin-bottom:.18rem;font-family:var(--font-display);font-size:.58rem;
  letter-spacing:.22em;color:var(--glow);text-transform:uppercase}
.ev-nm{color:var(--nucleus);font-size:.9rem;letter-spacing:.14em}
.ev-skill{font-size:.61rem;color:var(--amber);letter-spacing:.13em}

aside{min-width:0;border-left:1px solid var(--line);background:var(--slide);
  overflow-y:auto;padding:.9rem max(.9rem,env(safe-area-inset-right)) max(.9rem,env(safe-area-inset-bottom)) max(.9rem,env(safe-area-inset-left));scrollbar-width:thin;scrollbar-color:var(--line) transparent}
aside::-webkit-scrollbar{width:6px}
aside::-webkit-scrollbar-thumb{background:var(--line)}
.mobile-drawer-head,.mobile-category-nav{display:none}
.mobile-drawer-content{display:contents}
.mobile-panel-group{min-width:0}
.sec{font-size:.62rem;letter-spacing:.26em;color:var(--ink-dim);margin:.5rem 0 .6rem}
.layer-h{font-size:.6rem;letter-spacing:.2em;color:var(--glow);opacity:.7;
  margin:.7rem 0 .35rem;padding-bottom:.2rem;border-bottom:1px solid var(--line)}

/* 批量購買 */
.buyamt{display:flex;gap:.3rem;margin-bottom:.5rem}
.buyamt button{flex:1;background:var(--cyto);border:1px solid var(--line);color:var(--ink-dim);
  border-radius:2px;padding:.28rem 0;font-size:.68rem;cursor:pointer;letter-spacing:.05em}
.buyamt button.on{color:var(--glow);border-color:var(--glow)}

.item{width:100%;text-align:left;border:1px solid var(--line);background:var(--cyto);
  color:var(--ink);border-radius:2px;padding:.55rem .65rem;margin-bottom:.38rem;
  display:grid;grid-template-columns:1fr auto;gap:.12rem .5rem;
  cursor:pointer;position:relative;overflow:hidden;transition:border-color .15s,transform .05s}
.item:hover:not(:disabled){border-color:var(--glow)}
.item:active:not(:disabled){transform:translateY(1px)}
.item:disabled{opacity:.4;cursor:not-allowed}
.item:focus-visible{outline:2px solid var(--glow);outline-offset:2px}
.item .nm{font-size:.9rem;letter-spacing:.05em}
.item .qty{font-size:.85rem;color:var(--glow);text-align:right}
.item .pips{font-size:.6rem;color:var(--amber);letter-spacing:.05em}
.item .ds{font-size:.66rem;color:var(--ink-dim)}
.item .stat{font-size:.63rem;color:var(--ink-dim);grid-column:1/-1;font-family:var(--font-mono);opacity:.8}
.item .price{font-size:.8rem;color:var(--amber);grid-column:1/-1;text-align:right;margin-top:-.85rem}
.item .bar{position:absolute;inset:auto 0 0 0;height:2px;background:var(--glow);opacity:.5}

.collapse{width:100%;border:1px solid var(--nucleus);background:transparent;
  color:var(--nucleus);border-radius:2px;padding:.7rem;margin-bottom:.45rem;
  font-size:.85rem;letter-spacing:.12em;cursor:pointer;transition:background .2s}
.collapse:hover:not(:disabled){background:#2a0f1c}
.collapse:disabled{opacity:.4;cursor:not-allowed;border-color:var(--line);color:var(--ink-dim)}
.collapse.singularity-ready{border-color:var(--glow);color:var(--glow);
  box-shadow:0 0 20px -6px var(--glow);animation:pulse 2s infinite}
@keyframes pulse{50%{box-shadow:0 0 30px -4px var(--glow)}}
.note{font-size:.66rem;color:var(--ink-dim);line-height:1.6;margin-bottom:.8rem}

.sitem{width:100%;text-align:left;border:1px solid var(--line);background:var(--cyto);
  color:var(--ink);border-radius:2px;padding:.5rem .6rem;margin-bottom:.35rem;
  display:grid;grid-template-columns:1fr auto;gap:.1rem .5rem;cursor:pointer;transition:border-color .15s}
.sitem:hover:not(:disabled){border-color:var(--nucleus)}
.sitem:disabled{opacity:.45;cursor:not-allowed}
.sitem.owned{opacity:.55;border-style:dashed}
.sitem:focus-visible{outline:2px solid var(--nucleus);outline-offset:2px}
.snm{font-size:.86rem;letter-spacing:.05em}
.sroute{font-size:.6rem;color:var(--ink-dim);text-align:right;letter-spacing:.1em}
.sds{font-size:.64rem;color:var(--ink-dim)}
.sprice{font-size:.78rem;color:var(--nucleus);text-align:right}

.lg{display:flex;gap:.5rem;align-items:baseline;padding:.28rem 0;border-bottom:1px dashed rgba(29,74,99,.4)}
.lg .lgn{font-size:.78rem;color:var(--glow);white-space:nowrap}
.lg .lgd{font-size:.64rem;color:var(--ink-dim)}
.lg.dim{font-size:.66rem;color:var(--ink-dim);border:none}

/* 尺度圖鑑：只使用現有 Canvas 繪圖，不載入外部圖片。 */
.scale-codex-shell{margin-top:1rem;border-top:1px solid var(--line);padding-top:.65rem}
.scale-codex{border:1px solid rgba(92,224,192,.3);background:rgba(6,18,28,.5);border-radius:2px}
.scale-codex>summary{display:grid;grid-template-columns:1fr auto;gap:.4rem;align-items:center;
  padding:.58rem .62rem;cursor:pointer;list-style-position:inside;color:var(--glow);
  font-size:.72rem;letter-spacing:.08em}
.scale-codex-current{font-size:.58rem;color:var(--amber);text-align:right;letter-spacing:.06em;
  max-width:9.5rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.scale-codex-body{padding:.15rem .58rem .65rem}
.scale-codex-intro{font-size:.59rem;line-height:1.55;color:var(--ink-dim);padding:.28rem 0 .52rem}
.scale-codex-visual{position:relative;border:1px solid rgba(92,224,192,.22);
  width:min(100%,31rem);aspect-ratio:1;margin-inline:auto;background:rgba(3,13,21,.72);overflow:hidden;border-radius:50%}
#scale-codex-preview{display:block;width:100%;height:100%;aspect-ratio:1;border-radius:50%;
  cursor:default;touch-action:none;image-rendering:auto;box-shadow:inset 0 0 30px rgba(92,224,192,.08)}
.scale-codex-variant{position:absolute;right:.65rem;bottom:.55rem;padding:.18rem .42rem;border:1px solid rgba(92,224,192,.34);
  border-radius:999px;background:rgba(3,13,21,.78);color:var(--glow);font-size:.52rem;letter-spacing:.1em;pointer-events:none}
.scale-codex-lock{display:none;position:absolute;inset:0;place-items:center;text-align:center;
  padding:1rem;background:rgba(3,10,17,.84);color:var(--ink-dim);font-size:.67rem;line-height:1.6}
.scale-codex-lock.show{display:grid}
.scale-codex-heading{display:grid;grid-template-columns:auto 1fr;gap:.25rem .55rem;
  align-items:baseline;padding:.58rem 0 .45rem;border-bottom:1px dashed rgba(79,116,136,.45)}
.scale-codex-index{grid-row:1/3;font-family:var(--font-mono);font-size:.58rem;color:var(--ink-dim);
  letter-spacing:.08em}
.scale-codex-name{font-size:1rem;color:var(--glow);letter-spacing:.08em}
.scale-codex-name-en{font-family:var(--font-mono);font-size:.55rem;color:var(--ink-dim);letter-spacing:.04em}
.scale-codex-facts{display:grid;gap:.42rem;padding:.5rem 0}
.scale-codex-fact{border-left:2px solid rgba(92,224,192,.28);padding-left:.48rem}
.scale-codex-label{display:block;font-size:.53rem;color:var(--ink-dim);letter-spacing:.15em;margin-bottom:.13rem}
.scale-codex-value{display:block;font-size:.63rem;color:var(--ink);line-height:1.52}
.scale-codex-fact.analogy{border-left-color:rgba(255,196,107,.4)}
.scale-codex-fact.analogy .scale-codex-value{color:var(--amber)}
.scale-codex-note{font-size:.64rem;color:var(--ink);line-height:1.65;padding:.5rem .55rem;
  border:1px solid rgba(79,116,136,.34);background:rgba(16,48,63,.28)}
.scale-codex-nav{display:grid;grid-template-columns:1fr 1fr;gap:.35rem;margin:.5rem 0}
.scale-codex-nav button{border:1px solid var(--line);background:var(--cyto);color:var(--ink);
  border-radius:2px;padding:.35rem .42rem;font-size:.62rem;cursor:pointer}
.scale-codex-nav button:hover:not(:disabled){border-color:var(--glow);color:var(--glow)}
.scale-codex-nav button:disabled{opacity:.32;cursor:not-allowed}
.scale-codex-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.3rem;
  max-height:12.5rem;overflow-y:auto;padding:.42rem;border:1px solid rgba(29,74,99,.55);
  background:rgba(3,13,21,.45);scrollbar-width:thin;scrollbar-color:var(--line) transparent}
.scale-codex-entry{display:grid;grid-template-columns:1.8rem 1fr;gap:.28rem;align-items:center;
  min-width:0;text-align:left;border:1px solid rgba(29,74,99,.7);background:rgba(16,48,63,.55);
  color:var(--ink);border-radius:2px;padding:.34rem .38rem;cursor:pointer}
.scale-codex-entry .num{font-size:.55rem;color:var(--ink-dim)}
.scale-codex-entry .entry-name{font-size:.61rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.scale-codex-entry:hover:not(:disabled),.scale-codex-entry.on{border-color:var(--glow)}
.scale-codex-entry.on{background:rgba(92,224,192,.09);color:var(--glow)}
.scale-codex-entry.locked{opacity:.38;cursor:not-allowed;border-style:dashed}

/* 成就：跨越凡身與奇點的同一份紀錄，不覆蓋顯微鏡視野。 */
.achievement-shell{margin-top:1rem;border-top:1px solid var(--line);padding-top:.65rem}
.achievement-panel{border:1px solid rgba(201,160,255,.28);background:rgba(6,18,28,.5);border-radius:2px}
.achievement-panel>summary{display:grid;grid-template-columns:1fr auto;gap:.35rem;align-items:center;
  padding:.58rem .62rem;cursor:pointer;list-style-position:inside;color:#d8c4ff;font-size:.72rem;letter-spacing:.08em}
.achievement-title{font-size:.58rem;color:var(--amber);text-align:right;letter-spacing:.06em}
.achievement-body{padding:.2rem .58rem .62rem}
.achievement-integrity{font-size:.59rem;line-height:1.45;color:var(--nucleus);padding:.38rem .45rem;
  margin:.25rem 0 .5rem;border:1px dashed rgba(255,107,157,.4);background:rgba(255,107,157,.045)}
.achievement-note{font-size:.58rem;line-height:1.5;color:var(--ink-dim);padding:.25rem 0 .38rem}
.achievement-group{margin-top:.62rem}.achievement-group:first-child{margin-top:.25rem}
.achievement-group-h{display:flex;justify-content:space-between;gap:.5rem;padding-bottom:.25rem;
  border-bottom:1px dashed rgba(79,116,136,.45);font-size:.58rem;letter-spacing:.16em;color:var(--glow)}
.achievement-card{display:grid;grid-template-columns:1fr auto;gap:.12rem .45rem;padding:.42rem 0;
  border-bottom:1px solid rgba(29,74,99,.3)}
.achievement-card.locked{opacity:.52}.achievement-card.hidden-ach.locked{opacity:.38}
.achievement-name{font-size:.72rem;color:var(--ink);letter-spacing:.035em}
.achievement-card.unlocked .achievement-name{color:var(--amber)}
.achievement-mark{font-family:var(--font-mono);font-size:.56rem;color:var(--ink-dim)}
.achievement-card.unlocked .achievement-mark{color:var(--glow)}
.achievement-desc{grid-column:1/-1;font-size:.59rem;line-height:1.45;color:var(--ink-dim)}
.achievement-milestones{display:flex;flex-wrap:wrap;gap:.28rem;margin-top:.65rem}
.achievement-milestone{display:flex;align-items:center;gap:.28rem;border:1px solid rgba(79,116,136,.42);
  padding:.2rem .3rem;font-size:.54rem;color:var(--ink-dim)}
.achievement-milestone.on{border-color:rgba(255,196,107,.58);color:var(--amber)}
.achievement-dot{width:.58rem;height:.58rem;border-radius:50%;background:var(--reward-color);box-shadow:0 0 7px -1px var(--reward-color)}
.achievement-toast{position:fixed;z-index:130;top:max(4.35rem,calc(env(safe-area-inset-top) + 3.2rem));right:max(1rem,env(safe-area-inset-right));
  width:min(23rem,calc(100vw - 2rem));max-height:0;opacity:0;overflow:hidden;pointer-events:none;
  padding:0 .85rem 0 2.7rem;border:0 solid rgba(255,196,107,.58);border-radius:3px;
  background:linear-gradient(110deg,rgba(23,36,47,.98),rgba(58,37,31,.98));color:var(--amber);
  box-shadow:0 18px 50px rgba(0,0,0,.42),0 0 32px rgba(255,196,107,.08);
  font-size:.68rem;line-height:1.55;transform:translateY(-.7rem);transition:max-height .24s,opacity .24s,padding .24s,border-width .24s,transform .24s}
.achievement-toast::before{content:'✦';position:absolute;left:.9rem;top:50%;transform:translateY(-50%);
  font-size:1.15rem;color:var(--glow);text-shadow:0 0 14px var(--glow)}
.achievement-toast.show{max-height:7rem;opacity:1;padding:.72rem .85rem .72rem 2.7rem;border-width:1px;transform:translateY(0)}

.log{font-size:.66rem;color:var(--ink-dim);line-height:1.52;min-height:1em;max-height:6.4rem;overflow-y:auto;
  overscroll-behavior:contain;-webkit-overflow-scrolling:touch;touch-action:pan-y;padding-right:.2rem;
  scrollbar-width:thin;scrollbar-color:rgba(92,224,192,.32) transparent}
.log::-webkit-scrollbar{width:4px}
.log::-webkit-scrollbar-thumb{background:rgba(92,224,192,.28);border-radius:4px}
.log div{opacity:.7;margin-bottom:.15rem}
.log div:first-child{opacity:1;color:var(--ink)}
.log b{color:var(--glow);font-weight:400}

.transition-brief{display:grid;gap:.45rem;margin-top:.55rem;padding:.62rem;border:1px solid rgba(92,224,192,.2);
  border-radius:2px;background:linear-gradient(135deg,rgba(92,224,192,.055),rgba(201,160,255,.035))}
.transition-route{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:.2rem .55rem;align-items:baseline}
.transition-route .from{font-size:.57rem;color:var(--ink-dim);letter-spacing:.1em}
.transition-route .to{font-size:.82rem;color:var(--glow);letter-spacing:.07em;white-space:nowrap}
.transition-route .threshold{grid-column:1/-1;font-family:var(--font-mono);font-size:.57rem;color:var(--amber)}
.transition-meter{height:4px;overflow:hidden;border-radius:4px;background:rgba(29,74,99,.72)}
.transition-meter>span{display:block;width:var(--transition-progress,0%);height:100%;background:linear-gradient(90deg,var(--glow),var(--amber));box-shadow:0 0 9px var(--glow)}
.transition-facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.32rem}
.transition-fact{padding:.32rem .38rem;border-left:2px solid rgba(92,224,192,.26);background:rgba(3,13,21,.32)}
.transition-fact small{display:block;font-size:.49rem;color:var(--ink-dim);letter-spacing:.12em;margin-bottom:.1rem}
.transition-fact b{display:block;font-size:.59rem;color:var(--ink);font-weight:400;line-height:1.4}
.transition-fact.reward{border-left-color:rgba(255,196,107,.5)}
.transition-fact.reward b{color:var(--amber)}

.const-row{border:1px solid var(--line);border-radius:2px;padding:.6rem;margin-bottom:.5rem;background:var(--cyto);position:relative}
.const-head{display:flex;align-items:baseline;gap:.5rem}
.const-sym{font-family:var(--font-mono);font-size:1.1rem;color:var(--glow)}
.const-nm{font-size:.85rem;letter-spacing:.05em}
.const-fit{margin-left:auto;font-size:.66rem;letter-spacing:.1em}
.const-sub{font-size:.62rem;color:var(--ink-dim);margin:.25rem 0 .5rem}
input[type=range]{width:100%;accent-color:var(--glow);cursor:pointer}
input[type=range]:disabled{accent-color:var(--ink-dim)}
.const-upgrade{width:100%;margin-top:.42rem;background:rgba(92,224,192,.055);
  border:1px solid var(--line);color:var(--ink-dim);border-radius:2px;
  padding:.34rem .45rem;font-size:.66rem;letter-spacing:.05em;cursor:pointer}
.const-upgrade:hover:not(:disabled){border-color:var(--glow);color:var(--glow)}
.const-upgrade:disabled{opacity:.4;cursor:not-allowed}

/* ═══ 躍遷橫幅 ═══ */
.banner{position:fixed;inset:0;z-index:80;display:grid;place-content:center;
  text-align:center;cursor:pointer;background:rgba(3,8,14,.82);
  animation:bFade 3s forwards}
.banner.ending{animation:bFade 5.2s forwards;background:rgba(1,2,8,.92)}
.banner.singularity{animation:bFade 3.2s forwards;background:rgba(1,3,10,.91)}
@keyframes bFade{0%{opacity:0}8%{opacity:1}85%{opacity:1}100%{opacity:0}}
.b-ghost{position:absolute;left:50%;top:50%;transform:translate(-50%,-58%);
  font-size:3.4rem;color:transparent;-webkit-text-stroke:1px rgba(143,179,196,.4);
  letter-spacing:.3em;pointer-events:none}
.b-verb{font-size:.78rem;letter-spacing:.6em;color:var(--ink-dim);margin-bottom:.9rem}
.b-name{font-size:3.6rem;letter-spacing:.22em;color:#e9f4f2;line-height:1.2;
  text-shadow:0 0 40px rgba(92,224,192,.35)}
.b-sub{font-size:.85rem;letter-spacing:.24em;color:var(--glow);margin-top:.9rem;font-family:var(--font-mono)}
.b-note{font-size:.82rem;color:var(--ink);margin-top:1.5rem;max-width:34rem;line-height:1.9;opacity:.85}
.b-analogy{font-size:.72rem;color:var(--amber);margin-top:.7rem;letter-spacing:.05em;max-width:34rem;line-height:1.6}

/* 蛻變：舊名如蛻皮般放大溶解，細線自下而上掃過 */
.banner.molt .b-ghost{animation:ghostShed 2.2s ease-out forwards}
@keyframes ghostShed{0%{opacity:.7;transform:translate(-50%,-58%) scale(1)}
  100%{opacity:0;transform:translate(-50%,-70%) scale(1.6)}}
.banner.molt .b-name{animation:nameIn 1.2s .3s both}
.banner.molt::after{content:'';position:absolute;left:20%;right:20%;top:50%;height:1px;
  background:linear-gradient(90deg,transparent,var(--glow),transparent);
  animation:lineSweep 1.6s .2s both}
@keyframes lineSweep{0%{transform:translateY(6rem);opacity:0}
  40%{opacity:.9}100%{transform:translateY(-6rem);opacity:0}}
@keyframes nameIn{0%{opacity:0;letter-spacing:.5em}100%{opacity:1;letter-spacing:.22em}}

/* 渡：水面破開——一道橫向水線上升 */
.banner.cross .b-ghost{animation:ghostShed 2.4s ease-out forwards}
.banner.cross .b-name{animation:riseIn 1.4s .3s both}
@keyframes riseIn{0%{opacity:0;transform:translateY(2.2rem)}100%{opacity:1;transform:translateY(0)}}
.banner.cross::after{content:'';position:absolute;left:8%;right:8%;top:56%;height:2px;
  background:linear-gradient(90deg,transparent,#9adfff,transparent);
  filter:blur(.5px);animation:waterRise 2.2s both}
@keyframes waterRise{0%{transform:translateY(0);opacity:.9}
  100%{transform:translateY(-14rem);opacity:0}}

/* 坍縮：徑向內聚暗角 + 名字砸入 */
.banner.collapse::before{content:'';position:absolute;inset:0;
  background:radial-gradient(circle at 50% 50%, transparent 0%, rgba(140,120,255,.14) 45%, transparent 70%);
  animation:implode 1.4s ease-in both}
@keyframes implode{0%{transform:scale(2.6);opacity:0}60%{opacity:1}100%{transform:scale(.2);opacity:0}}
.banner.collapse .b-name{animation:slam .9s cubic-bezier(.2,1.6,.4,1) both}
@keyframes slam{0%{opacity:0;transform:scale(1.25)}100%{opacity:1;transform:scale(1)}}
.banner.collapse .b-ghost{animation:ghostIn 1.6s ease-in forwards}
@keyframes ghostIn{0%{opacity:.6;transform:translate(-50%,-58%) scale(1.4)}
  100%{opacity:0;transform:translate(-50%,-58%) scale(.5)}}

/* 結局 */
.banner.ending .b-name{font-size:2.6rem;animation:nameIn 2s both;
  text-shadow:0 0 60px rgba(201,160,255,.5)}
.banner.ending .b-verb{display:none}
.banner.singularity .b-name{font-size:1.65rem;line-height:1.85;letter-spacing:.08em;max-width:48rem;
  padding:0 2rem;text-shadow:0 0 55px rgba(201,160,255,.55);animation:nameIn 1.5s both}
.banner.singularity .b-verb,.banner.singularity .b-sub,.banner.singularity .b-note,.banner.singularity .b-ghost{display:none}

/* reduced motion：純淡入卡 */
.banner.rm .b-ghost,.banner.rm::before,.banner.rm::after{display:none!important}
.banner.rm .b-name{animation:none!important}

<div id="debug">
  <span class="tab" onclick="document.getElementById('debug').classList.toggle('open')">測試 DEBUG</span>
  <h4>資源</h4>
  <div class="row">
    <button onclick="DEBUG.mulBio(1e3)">生命力×1000</button>
    <button onclick="DEBUG.addSpore(50)">+50孢</button>
    <button onclick="DEBUG.fillStage()">填滿門檻</button>
  </div>
  <h4>階段</h4>
  <select id="dbg-stage" onchange="DEBUG.setStage(this.selectedIndex)"></select>
  <div class="row">
    <button onclick="DEBUG.nextStage()">下一階▶</button>
    <button onclick="DEBUG.unlockAll()">全孢升級</button>

  <div class="row">
    <button onclick="DEBUG.timeWarp(60)">+1分</button>
    <button onclick="DEBUG.timeWarp(3600)">+1時</button>
    <button onclick="DEBUG.speed(1)">×1</button>
    <button onclick="DEBUG.speed(10)">×10</button>
    <button onclick="DEBUG.speed(100)">×100</button>
  </div>
  <h4>終局</h4>

}

function costCoeff(){ return has('lattice') ? 1.14 : COST_MULT; }

  const C = costCoeff(), n = S.owned[b.id];

}
function gravPull(){

}
function contactRadius(){ return band(S.stage)==='horizon' ? 34 : 24; }
function foodRewardMult(){ return (has('gluttony')?2:1) * (1+legacySum('food')); }
function foodSpawnMult(){ return (has('chemo')?1.5:1) * (1+legacySum('spawn')); }

function offlineMult(){ return (has('membrane')?0.8:0.5) * (1+legacySum('off')); }

function sporeGainFor(earned,stageIdx){

  const thr = STAGES[idx].thr || 1;

}
function sporeGain(){ return sporeGainFor(S.earned,S.stage); }
function epochIdx(){ let k=0; EPOCHS.forEach((e,i)=>{ if(S.earned>=e.at) k=i; }); return k; }

/* ── 格式化 ── */
function fmt(n){
  if (!isFinite(n)) return '∞';
  if (n < 1e6) return n<100 ? (n<10?n.toFixed(1):n.toFixed(0)) : Math.floor(n).toLocaleString('en-US');
  const e = Math.floor(Math.log10(n));
  const m = (n/Math.pow(10,e)).toFixed(2);
  return `${m}×10<sup>${e}</sup>`;
}
/* 上方生命力專用：依每次 0.12 秒更新可見的增量，自動保留 2–6 位小數。 */
function liveLifeFmt(n,perSec){
  if (!isFinite(n)) return '∞';
  if (n<1e6) return fmt(n);
  const e=Math.floor(Math.log10(Math.max(n,1)));
  const movement=Math.abs(Number(perSec)||0)*.12/Math.pow(10,e);
  const decimals=movement>0
    ? Math.max(2,Math.min(6,Math.ceil(-Math.log10(Math.max(movement,1e-6)))))

  return `${(n/Math.pow(10,e)).toFixed(decimals)}×10<sup>${e}</sup>`;
}
function unitName(u){ return isEn() ? u.en : u.name; }
const EN_MAGNITUDE_BASES=[
  {e:3,name:'thousand'},{e:6,name:'million'},{e:9,name:'billion'},
  {e:12,name:'trillion'},{e:15,name:'quadrillion'},{e:18,name:'quintillion'},
];
function magnitudeNameByExponent(e){
  if (isEn()){
    let best=null;
    for (const u of EN_MAGNITUDE_BASES) if (e>=u.e) best=u;
    if (!best || e-best.e>2) return `10^${e}`;
    return `${['','ten ','hundred '][e-best.e]}${best.name}`;
  }
  let best=null;
  for (const u of BIG_UNITS) if (e>=u.e) best=u;
  if (!best) return '';
  const delta=e-best.e;
  return delta>=0&&delta<=3 ? `${['','十','百','千'][delta]}${best.name}` : best.name;
}
function bigUnit(n){
  if (n<1e5 || !isFinite(n)) return '';
  const e = Math.floor(Math.log10(n));
  if (e>=HUAYAN_UNITS[0].e){
    let best=HUAYAN_UNITS[0];
    for (const u of HUAYAN_UNITS) if (e>=u.e) best=u;
    return isEn()?`(${best.en} scale)`:`（${best.name}級）`;
  }
  const label=magnitudeNameByExponent(e);
  return label ? (isEn()?`(${label} scale)`:`（${label}級）`) : '';
}
function huayanByExp(exp){
  let best = BIG_UNITS[BIG_UNITS.length-1];
  for (const u of HUAYAN_UNITS) if (exp>=u.e) best=u;
  return `「${unitName(best)}」`;
}
function plain(n){ return fmt(n).replace(/<sup>(.*?)<\/sup>/,'^$1'); }

function say(msg, gold){
  logs.unshift(gold?`<b>${msg}</b>`:msg);
  logs = logs.slice(0,LOG_HISTORY_LIMIT);
  if (typeof renderLog==='function') renderLog();
}

/* ── 成就引擎：只由明確遊戲事件喚醒，不逐幀巡覽 ── */
function normalizeAchievementState(raw){
  const out=freshAchievementState();
  if (!raw || typeof raw!=='object') return out;
  const known=new Set(ACHIEVEMENTS.map(a=>a.id));
  if (raw.unlocked && typeof raw.unlocked==='object'){
    for (const [id,value] of Object.entries(raw.unlocked)){
      if (known.has(id) && value) out.unlocked[id]=Number.isFinite(Number(value))?Number(value):Date.now();
    }
  }
  if (raw.stats && typeof raw.stats==='object'){
    for (const key of Object.keys(out.stats)){
      const value=Number(raw.stats[key]);
      if (Number.isFinite(value)) out.stats[key]=key==='genesisHigh'?Math.max(-1,Math.floor(value)):Math.max(0,Math.floor(value));
    }
  }
  if (raw.flags && typeof raw.flags==='object'){
    for (const key of Object.keys(out.flags)) out.flags[key]=!!raw.flags[key];
  }
  if (raw.integrity && typeof raw.integrity==='object'){
    out.integrity.testSave=!!raw.integrity.testSave;
    out.integrity.reason=typeof raw.integrity.reason==='string'?raw.integrity.reason.slice(0,80):'';
  }
  out.version=ACHIEVEMENT_VERSION;
  return out;
}
function ensureAchievementState(){
  if (!S.ach || S.ach.version!==ACHIEVEMENT_VERSION) S.ach=normalizeAchievementState(S.ach);
  return S.ach;
}
function achievementDef(id){ return ACHIEVEMENTS.find(a=>a.id===id); }
function achievementUnlocked(id){ return !!ensureAchievementState().unlocked[id]; }
function achievementCount(){ return Object.keys(ensureAchievementState().unlocked).length; }
function achievementStageIndex(nameEn){ return STAGES.findIndex(s=>s.nameEn===nameEn); }
function achievementUniverseIndex(id){ return UNIVERSE_STAGES.findIndex(s=>s.id===id); }
function achievementGenesisIndex(id){ return LIFE_GENESIS.findIndex(s=>s.id===id); }
function achievementPopcount(n){ n=(Number(n)||0)>>>0; let c=0; while(n){n&=n-1;c++;} return c; }
function achievementCurrentMilestone(){
  const count=achievementCount();
  return ACHIEVEMENT_MILESTONES.filter(m=>count>=m.count).pop()||null;
}
function achievementSwatches(){
  const count=achievementCount();
  return ACHIEVEMENT_MILESTONES.filter(m=>count>=m.count).map(m=>({
    hex:m.color,zh:`成就色票 · ${m.colorName}`,en:`Achievement swatch · ${m.colorNameEn}`
  }));
}
function markAchievementTestSave(reason){
  const ach=ensureAchievementState();
  if (ach.integrity.testSave) return;
  ach.integrity.testSave=true;
  ach.integrity.reason=String(reason||'debug').slice(0,80);
  if (typeof renderAchievements==='function') renderAchievements();
}
function achievementsEligible(){
  if (typeof window!=='undefined' && Number(window.__speed||1)!==1) markAchievementTestSave('speed');
  return !ensureAchievementState().integrity.testSave;
}
let achievementBatch=null;
function achievementNotice(text){
  if (typeof showAchievementToast==='function') showAchievementToast(text);
}
function unlockAchievement(id,options){
  options=options||{};

}
function checkStageAchievements(stage){
  const high=Math.max(Number(stage)||0,S.maxStage||0,S.stage||0);
  const checks=[
    ['leave_drop','Honeybee'],['myth_end','Planetesimal'],['long_lamp','Red Dwarf'],
    ['light_stays','Stellar Black Hole'],['ten_thousand_stars','Galaxy Cluster'],['light_chaser','Hubble Sphere'],

  if (heroStage()>=STAGES.length-1) unlockAchievement('all_forms');
  if (S.ended) unlockAchievement('book_closes');

function checkMorphAchievement(ref){
  const target=morphTarget(ref); if (!target) return;
  const custom=target.custom||{};
  const allParts=MORPH_PART_KEYS.every(key=>Number.isFinite(Number(custom[key])));
  const eras=new Set(MORPH_PART_KEYS.filter(key=>Number.isFinite(Number(custom[key]))).map(key=>Number(custom[key])));
  const colors=MORPH_COLOR_KEYS.filter(key=>typeof custom[key]==='string' && /^#[0-9a-f]{6}$/i.test(custom[key])).length;

function recordAchievementEvent(type,data){
  const ach=ensureAchievementState(), stats=ach.stats;

  S.freedom = 10 + (S.singShop.mothercore||0)*2;
  S.materials = 0;
  S.uniAge = 0;
  S.universeStage = 0;
  S.genesisStage = -1;
  S.constLevels = {};
  S.locked = {};
  if (typeof cosmosVisualStage!=='undefined') cosmosVisualStage=0;
  if (typeof cosmosVisualGenesis!=='undefined') cosmosVisualGenesis=-1;
  CONSTANTS.forEach(c=>S.consts[c.id]=c.start);
  recordAchievementEvent('ignite',{fitness:f,universeStage:st,maturity,genesisStage:genesisWas,generation,debris});
  if (maturity < 0.3 || st===0){
    say(isEn()
      ? `Recast after ${Math.floor(age)} seconds. This young universe leaves ${debris} remnant${debris===1?'':'s'} and +${generation.toFixed(2)} generation memory.`
      : `重製。這個宇宙尚未學會呼吸便熄滅了，留下 ${debris} 塊殘骸與 +${generation.toFixed(2)} 代記憶。`);
  } else if (f<0.05){
    say(isEn()
      ? `Recast. Its unlocked laws never aligned; the universe leaves ${debris} remnants.`
      : `重製。已顯現的常數彼此失衡，這一界只留下 ${debris} 塊殘骸。`);
  } else if (f>0.8 && st===UNIVERSE_STAGES.length-1){
    say(isEn()
      ? `Recast. The constants found their places; life woke on millions of worlds. ${debris} remnants endure.`
      : `重製。常數各歸其位——生命在千萬顆行星上同時醒來，其中一些，抬起頭望見了星空。${debris} 塊殘骸留存。`, true);
  } else {
    say(isEn()
      ? `Recast. This universe reached ${stageWas.nameEn}; ${debris} remnants survive.`
      : `重製。這個宇宙走到「${stageWas.name}」，留下 ${debris} 塊殘骸。`);
  }
  if (typeof pondReset==='function') pondReset();
  if (typeof pondSyncAvatars==='function') pondSyncAvatars();
  if (typeof buildSingularity==='function') buildSingularity();
  if (typeof renderSing==='function') renderSing();
  save();
}
function avatarCost(){ return Math.ceil(AVATAR_BASE_COST * Math.pow(1.58, S.avatars.length)); }
function buyAvatar(idx){
  if (S.avatars.length >= avatarCap()) return;
  const c = avatarCost();
  if (S.freedom < c) return;
  idx=clampFormStage(idx,-1);
  if (idx<0 || idx>heroStage()) return;
  S.freedom -= c;
  S.avatars.push({stage:idx,custom:{}});
  recordAchievementEvent('avatar',{stage:idx});
  const st = STAGES[idx];
  say(isEn()
    ? `You call forth yourself in the form of "${st.nameEn}". It joins the shoal.`
    : `你喚出曾為「${st.name}」的自己。牠滑入水中，與你同游。`);
  if (typeof pondSyncAvatars==='function') pondSyncAvatars();
  if (typeof buildSingularity==='function') buildSingularity();
  if (typeof renderSing==='function') renderSing();
  save();
}

/* ── 事件系統（dt 制）── */
function makeEventState(id,strength){
  const e=EVENTS[id], s=strength===undefined?1:strength;
  if (!e) return null;
  const scaled=m=>1+(m-1)*s;
  return {id, remain:e.dur, elapsed:0, persistent:!!e.persistent,
    mult:e.mult?scaled(e.mult):undefined,
    clickMult:e.clickMult?scaled(e.clickMult):undefined,
    clickRamp:e.clickRamp, holdReward:e.holdReward, spaghetti:e.spaghetti,
    ramp:e.persistent&&e.clickRamp?5:0, holdAccum:0, tidalAccum:0,
    thenFade:e.thenFade, str:s};
}
function ensureStageEventSkill(){
  if (!S || S.phase!=='mortal'){
    if (activeEvent&&activeEvent.persistent) activeEvent=null;
    return;
  }
  const stage=STAGES[S.stage], id=stage&&stage.sig, e=id&&EVENTS[id];
  if (!e || !e.persistent){
    if (activeEvent&&activeEvent.persistent) activeEvent=null;
    return;
  }
  if (!activeEvent || activeEvent.id!==id || !activeEvent.persistent){
    activeEvent=makeEventState(id,1);
  }
}
function triggerEvent(id, strength){
  const e = EVENTS[id]; if (!e) return;
  const s = strength===undefined ? 1 : strength;
  const scaled = m => 1+(m-1)*s;

  if (e.detonateAll && typeof detonateAllFood==='function') detonateAllFood(s);
  if (e.scatterFood && typeof scatterAllFood==='function') scatterAllFood();
  if (e.chainEat && typeof chainEatFood==='function') chainEatFood(s);
  if (e.replay){
    const g = rate()*e.replay*s;
    S.bio+=g; S.earned+=g; S.lifetime+=g;
    say(isEn()
      ? `${e.nameEn}: time rewinds ${Math.round(e.replay*s)} s — you take back ${plain(g)} life-force.`
      : `${e.name}：時間倒流 ${Math.round(e.replay*s)} 秒，你收回了 ${plain(g)} 生命力。`, true);
  }
  if (e.endgame){
    const mult=s>=1?10:5;
    if (isFinalStage()) doMerge(mult);
    else {
      S.bio*=mult; S.earned*=mult; S.lifetime*=mult;
      say(`${tr(e,'name')}：${tr(e,'ds')} ×${mult}`, true);
      if (typeof renderStats==='function') renderStats();
    }
    return;
  }
  if (e.forceCollapse){
    say(`${tr(e,'name')}：${tr(e,'ds')}`, true);
    doCollapse(e.sporeMult||1);
    return;
  }
  if (e.dur>0){
    if (!e.persistent || !activeEvent || activeEvent.id!==id) activeEvent=makeEventState(id,s);
    else activeEvent.str=Math.max(activeEvent.str||0,s);
    say(`${tr(e,'name')}：${tr(e,'ds')}`, e.persistent||e.real==='真實');
  }
  if (e.afterMult && !e.persistent){
    afterEffect = {
      mult:scaled(e.afterMult),
      delay:Math.max(0,e.afterDelay||0),
      remain:Math.max(0,e.afterDuration||300),
    };
  }
  if (typeof renderEvent==='function') renderEvent();
}

function settleTidalEvent(early){
  if (!activeEvent || !activeEvent.spaghetti) return 0;
  const ev=activeEvent;
  const kept=early?0.35:1;
  const gain=Math.max(0,(ev.tidalAccum||0)*kept);
  activeEvent=null;
  if (gain>0){
    S.bio+=gain; S.earned+=gain; S.lifetime+=gain;
    say(early
      ? (isEn()?`Tidal disruption settles early: +${plain(gain)} life-force.`:`潮汐撕裂提前結算：+${plain(gain)} 生命力。`)
      : (isEn()?`The full tidal thread returns: +${plain(gain)} life-force.`:`潮汐細絲完整回返：+${plain(gain)} 生命力。`), true);
  }
  if (typeof renderEvent==='function') renderEvent();
  return gain;
}

function tickEvent(dt){
  if (afterEffect){
    let left=dt;
    if (!Number.isFinite(afterEffect.delay)) afterEffect.delay=0;
    if (afterEffect.delay>0){
      const waited=Math.min(afterEffect.delay,left);
      afterEffect.delay-=waited;
      left-=waited;
    }
    if (afterEffect.delay<=0 && left>0) afterEffect.remain-=left;
    if (afterEffect.delay<=0 && afterEffect.remain<=0) afterEffect=null;
  }
  if (satiety.time>0){ satiety.time-=dt; if(satiety.time<=0){satiety.time=0;satiety.stacks=0;} }
  if (startBoost.time>0){ startBoost.time-=dt; if(startBoost.time<=0) startBoost={time:0,mult:1}; }

  // 銜尾之環：每 600s 回放 10s
  if (legacyHas('replay') && S.phase==='mortal'){
    ouroT+=dt;
    if (ouroT>=600){
      ouroT=0;
      const g=rate()*10;
      if (g>0){ S.bio+=g;S.earned+=g;S.lifetime+=g;
        say(isEn()?`Ring of the Tail-Biter: +${plain(g)}.`:`銜尾之環：+${plain(g)}。`); }
      recordAchievementEvent('ouroboros');
    }
  }

  if (!activeEvent) return;
  activeEvent.elapsed=(activeEvent.elapsed||0)+dt;
  if (activeEvent.holdReward) activeEvent.holdAccum += rate()*dt*0.5;
  if (activeEvent.spaghetti){
    const total=Math.max(EVENTS[activeEvent.id].dur||20,0.001);
    const stretch=Math.min(activeEvent.elapsed/total,1);
    activeEvent.tidalAccum += rate()*dt*(0.5+stretch)*Math.max(0,activeEvent.str||1);
  }
  if (activeEvent.persistent) return;
  activeEvent.remain-=dt;
  if (activeEvent.remain<=0){
    const expiredEventId=activeEvent.id;
    if (activeEvent.spaghetti){ settleTidalEvent(false); return; }
    if (activeEvent.holdReward && activeEvent.holdAccum>0){
      const h=activeEvent.holdAccum;
      S.bio+=h;S.earned+=h;S.lifetime+=h;
      say(isEn()?`You held. The weight of the earth becomes ${plain(h)} life-force.`:`你撐住了。大地的重量化為 ${plain(h)} 生命力。`, true);
    }
    if (activeEvent.thenFade) say(isEn()?`${EVENTS[activeEvent.id].nameEn} dies down. You are not a star after all.`:`${EVENTS[activeEvent.id].name}熄滅了。你終究不是恆星。`);
    recordAchievementEvent('eventExpired',{id:expiredEventId});
    activeEvent=null;
    if (typeof renderEvent==='function') renderEvent();
  }
}

/* 飽食：吃到任何食物時呼叫 */
function onAte(){
  satiety.stacks = satiety.time>0 ? Math.min(satiety.stacks+1, SATIETY.maxStack) : 1;
  satiety.time = SATIETY.dur;
  recordAchievementEvent('satiety',{stacks:satiety.stacks});
}

/* ── 存檔 ── */
const SAVE_KEY = 'parasing:v3';
async function storageSet(key,value){
  if (window.storage && typeof window.storage.set==='function') return window.storage.set(key,value);
  localStorage.setItem(key,value);
}
async function storageGet(key){
  if (window.storage && typeof window.storage.get==='function'){
    const r=await window.storage.get(key);
    return r && typeof r==='object' && 'value' in r ? r.value : r;
  }
  return localStorage.getItem(key);
}
async function save(){
  if (!document.hidden) S.t = Date.now();
  try { await storageSet(SAVE_KEY, JSON.stringify({S, logs})); } catch(e){}
}
async function load(){
  try {
    const raw = await storageGet(SAVE_KEY);
    if (!raw) return false;
    const d = JSON.parse(raw);
    if (!d.S) return false;
    migrateFormSchema(d.S);
    const savedHasConstLevels=!!(d.S.constLevels && typeof d.S.constLevels==='object');
    const savedHasUniverseStage=Number.isFinite(d.S.universeStage);
    const savedHasHeroStage=Number.isFinite(d.S.heroStage);
    const savedHasGenesisStage=Number.isFinite(d.S.genesisStage);
    const savedHasLifeUniverses=Number.isFinite(d.S.lifeUniverses);
    const legacyAvatarMax=Array.isArray(d.S.avatars)
      ? d.S.avatars.reduce((m,a)=>Math.max(m,clampFormStage(a&&typeof a==='object'?a.stage:a,0)),0) : 0;
    S = Object.assign(freshState(), d.S);
    S.ach=normalizeAchievementState(S.ach);
    activeEvent=null; afterEffect=null;
    if (!S.owned || typeof S.owned!=='object') S.owned={};
    if (!S.consts || typeof S.consts!=='object') S.consts={};
    if (!S.constLevels || typeof S.constLevels!=='object') S.constLevels={};
    if (!S.shop || typeof S.shop!=='object') S.shop={};
    if (!S.singShop || typeof S.singShop!=='object') S.singShop={};
    if (!S.locked || typeof S.locked!=='object') S.locked={};
    if (!Array.isArray(S.avatars)) S.avatars=[];
    S.stage=clampFormStage(S.stage,0);
    S.maxStage=clampFormStage(S.maxStage,S.stage);
    if (!savedHasHeroStage && S.phase==='singularity') S.heroStage=legacyAvatarMax;
    S.heroStage=clampFormStage(S.heroStage,0);
    S.heroCustom=cleanMorphConfig(S.heroCustom);
    S.avatars=S.avatars.slice(0,AVATAR_CAP).map(normalizeAvatar);
    if (!Number.isFinite(S.remnants)) S.remnants=0;
    if (!Number.isFinite(S.materials)) S.materials=0;
    if (!Number.isFinite(S.universeStage)) S.universeStage=0;
    if (!savedHasUniverseStage && S.phase==='singularity'){
      const oldProgress=Math.max(0,Math.min((Number(S.uniAge)||0)/600,1));
      S.universeStage=Math.min(UNIVERSE_STAGES.length-1,Math.floor(oldProgress*UNIVERSE_STAGES.length));
    }
    S.universeStage=Math.max(0,Math.min(Math.floor(S.universeStage),UNIVERSE_STAGES.length-1));
    // 舊版奇點存檔已經能操作主角，遷移時視為完成孕生；新宇宙仍會從星際塵埃前重新開始。
    if (!savedHasGenesisStage && S.phase==='singularity') S.genesisStage=LIFE_GENESIS.length-1;
    const gs=Number(S.genesisStage);
    S.genesisStage=Number.isFinite(gs)?Math.max(-1,Math.min(Math.floor(gs),LIFE_GENESIS.length-1)):-1;
    S.lifeUniverses=savedHasLifeUniverses
      ? Math.max(0,Math.floor(S.lifeUniverses))
      : ((genesisComplete()||S.ended)?1:0);
    BUILDINGS.forEach(b=>{ if(typeof S.owned[b.id]!=='number') S.owned[b.id]=0; });
    CONSTANTS.forEach(c=>{
      if(typeof S.consts[c.id]!=='number') S.consts[c.id]=c.start;
      if (!savedHasConstLevels && c.unlockStage<=S.universeStage){
        const span=Math.abs(c.start-c.sweet)||1;
        const closeness=S.locked[c.id]?1:1-Math.abs(S.consts[c.id]-c.sweet)/span;
        S.constLevels[c.id]=Math.round(Math.max(0,Math.min(1,closeness))*CONST_MAX_LEVEL);
      }
      if (S.constLevels[c.id]!==undefined){
        const lv=Number(S.constLevels[c.id]);
        if (!Number.isFinite(lv) || lv<0) delete S.constLevels[c.id];
        else S.constLevels[c.id]=Math.min(CONST_MAX_LEVEL,Math.floor(lv));
      }
    });
    if (Array.isArray(d.logs)) logs=d.logs.slice(0,LOG_HISTORY_LIMIT);
    ensureStageEventSkill();
    const retroAdded=retroactiveAchievementCheck();
    // 離線結算
    const rawAway=Math.max(0,(Date.now()-(Number(S.t)||Date.now()))/1000);
    const away = Math.min(rawAway, offlineCap());
    let offlinePositive=false;
    if (S.phase==='mortal'){
      const gain = rate()*away*offlineMult();
      if (gain>1){
        S.bio+=gain;S.earned+=gain;S.lifetime+=gain;
        offlinePositive=true;
        say(isEn()?`Away ${(away/60).toFixed(0)} min — you grew ${plain(gain)} life-force on your own.`:`離開 ${(away/60).toFixed(0)} 分鐘，你自行長出 ${plain(gain)} 生命力。`);
      }
      if (isFinalStage() && S.lifetime<SINGULARITY_THR){
        let n = Math.min(Math.floor(away/mergeInterval()), 6);
        while (n-->0 && S.lifetime<SINGULARITY_THR) doMerge(10);
      }
    } else {
      S.materials += materialRate()*away*0.6;
      S.freedom += freedomRate()*away*0.6;
      S.lifeExp += expRate()*away*0.6;
      S.uniAge += away*0.6;
      offlinePositive=away>0 && (materialRate()+freedomRate()+expRate())>0;
    }
    recordAchievementEvent('offline',{seconds:rawAway,positive:offlinePositive});
    if (retroAdded) await save();
    return true;
  } catch(e){}
  return false;
}

/* ── 除錯 API ── */
const DEBUG = {
  addBio(x){ markAchievementTestSave('debug'); S.bio+=x;S.earned+=x;S.lifetime+=x; renderAll(); },
  mulBio(x){ markAchievementTestSave('debug'); S.bio*=x;S.earned*=x;S.lifetime*=x; renderAll(); },
  addSpore(x){ markAchievementTestSave('debug'); S.spores+=x;S.sporesTotal+=x; renderAll(); },
  fillStage(){ markAchievementTestSave('debug'); S.earned=STAGES[S.stage].thr; S.bio=STAGES[S.stage].thr; renderAll(); },
  setStage(i){ markAchievementTestSave('debug'); S.stage=Math.max(0,Math.min(i,STAGES.length-1));
    S.maxStage=Math.max(S.maxStage,S.stage);
    S.bio=0;S.earned=0;
    BUILDINGS.forEach(b=>S.owned[b.id]=0);
    if (typeof onStageChange==='function') onStageChange(); renderAll(); },
  nextStage(){ markAchievementTestSave('debug'); if(canCollapse()) doCollapse(); },
  unlockAll(){ markAchievementTestSave('debug'); SPORE_SHOP.forEach(s=>{ if(s.kind==='once') S.shop[s.id]=true; }); renderAll(); },
  fireEvent(id){ markAchievementTestSave('debug'); triggerEvent(id); },
  toSingularity(){ markAchievementTestSave('debug'); S.stage=STAGES.length-1; S.maxStage=S.stage; S.lifetime=SINGULARITY_THR; enterSingularity(); renderAll(); },
  nearEnd(){ markAchievementTestSave('debug'); if(S.phase==='singularity'){ S.lifeExp=ENDING_EXP-5; renderAll(); } },
  timeWarp(sec){ markAchievementTestSave('debug'); const g=rate()*sec; S.bio+=g;S.earned+=g;S.lifetime+=g;
    if(S.phase==='singularity'){ S.materials+=materialRate()*sec; S.freedom+=freedomRate()*sec; S.lifeExp+=expRate()*sec; S.uniAge+=sec; }
    say(`⏩ +${sec}s`); renderAll(); },
  speed(x){ if(Number(x)!==1) markAchievementTestSave('speed'); window.__speed=x; say(`⏩ ×${x}`); },
  reset(){ S=freshState(); logs=[]; activeEvent=null; afterEffect=null;
    window.__speed=1;
    satiety={time:0,stacks:0}; startBoost={time:0,mult:1};
    if(typeof resetAchievementToastQueue==='function') resetAchievementToastQueue();
    say('一隻草履蟲在原始湯裡睜開眼。');
    if(typeof onStageChange==='function') onStageChange(); renderAll(); save(); },
};
window.DEBUG = DEBUG;

</script>
<script>
/* ===== render.js ===== */
/* ═══════════════════════════════════════════════════════════
   草履蟲奇點 · 繪製層 v5
   鐵律一：橢圓身軀永不改變；纖毛是「表達層」，每階特化。
   鐵律二：取代而非疊加。
   鐵律三：體外延伸一律寬幅、發光、緩動——絕不細長如肢。
   ═══════════════════════════════════════════════════════════ */

let cv, cx, W, R, CX, CY, reduce;
const rand = (a,b) => a + Math.random()*(b-a);

function band(idx){
  return idx<=13?'bio' : idx<=16?'planet' : idx<=20?'star' : idx<=23?'degen' : 'horizon';
}

/* 行為：地球帶一律原始游動；宇宙帶莊嚴漂移 */
const MOVE = [
  {sp:.9},{sp:.9},{sp:.9},{sp:.9},{sp:.9},{sp:.9},{sp:.9},
  {sp:.9},{sp:.9},{sp:.9},{sp:.9},{sp:.9},{sp:.9},{sp:.9},
  {sp:.6},{sp:.55},{sp:.5},{sp:.45},{sp:.45},{sp:.4},{sp:.4},
  {sp:.38},{sp:.35},{sp:.35},{sp:.3},{sp:.28},{sp:.26},{sp:.24},
  {sp:.22},{sp:.20},{sp:.18},
];

/* 點擊導航共用尺度：生命型靈敏、神話型沉穩，微行星起逐級增加慣性。 */
const SELF_GRAVITY_STAGE=(()=>{ const idx=STAGES.findIndex(stage=>stage.nameEn==='Planetesimal'); return idx>=0?idx:14; })();
function hasSelfGravity(value){
  const idx=Math.max(0,Math.min(STAGES.length-1,Math.floor(Number(value)||0)));
  return idx>=SELF_GRAVITY_STAGE;
}
function manualNavigationBoost(value,distance,fieldRadius){
  const idx=Math.max(0,Math.min(STAGES.length-1,Math.floor(Number(value)||0)));
  if (hasSelfGravity(idx)) return 1;
  const lightness=Math.max(0,Math.min(1,(SELF_GRAVITY_STAGE-idx)/Math.max(SELF_GRAVITY_STAGE,1)));
  const near=48,farEdge=Math.max(near+1,(Number(fieldRadius)||R)*.7);
  const x=Math.max(0,Math.min(1,(Number(distance)-near)/(farEdge-near)));
  const far=x*x*(3-2*x);
  return 1+.55*lightness*far;
}
function navigationProfile(value){
  const idx=Math.max(0,Math.min(STAGES.length-1,Math.floor(Number(value)||0)));
  const cruise=(MOVE[idx]||MOVE[0]).sp;
  if (idx<=8){
    const q=idx/8;
    return {
      cruise, targetSpeed:1.75-q*.3, steer:.26-q*.06,
      retain:.88+q*.02, wander:.004-q*.0012, sway:.006-q*.002,
      edgeSteer:.18-q*.05,
    };
  }
  if (idx<=13){
    const q=(idx-9)/4;
    return {
      cruise, targetSpeed:1.28-q*.2, steer:.16-q*.04,
      retain:.93+q*.02, wander:.0014-q*.0006, sway:.0025-q*.001,
      edgeSteer:.09-q*.025,
    };
  }
  const q=idx-14;
  return {
    cruise, targetSpeed:.88*Math.pow(.92,q), steer:.06*Math.pow(.9,q),
    retain:.96, wander:0, sway:0, edgeSteer:.02*Math.pow(.97,q),
  };
}
function navigationStage(baseIdx,custom){
  return customPartStage(custom,'bodyStage',clampFormStage(baseIdx,0));
}

/* ── 粒子池 ── */
let motes=[], stars=[], uMatter=[], ripples=[], floats=[], filPhase=0;
function initParticles(){
  motes = Array.from({length:60},()=>({a:rand(0,6.28),r:rand(0,1),s:rand(.1,.5),sz:rand(.8,2.4),d:rand(0,6.28)}));
  stars = Array.from({length:120},()=>({a:rand(0,6.28),r:rand(0,1),sz:rand(.5,1.7),ph:rand(0,6.28)}));
  uMatter = Array.from({length:170},(_,i)=>({
    a:rand(0,6.28), r:Math.sqrt(rand(.035,.88)), sz:rand(.65,2.15),
    ph:rand(0,6.28), spin:rand(-1,1), tone:i%3,
  }));
}
function addFloat(x,y,txt,color){
  floats.push({x,y,txt,color:color||'#5ce0c0',a:1,vy:-0.7});
  if (floats.length>14) floats.shift();
}
function drawFloats(){
  for (let i=floats.length-1;i>=0;i--){
    const f=floats[i]; f.y+=f.vy; f.a-=.016;
    if (f.a<=0){ floats.splice(i,1); continue; }
    cx.save(); cx.globalAlpha=f.a; cx.fillStyle=f.color;
    cx.font='600 15px ui-monospace,Menlo,monospace'; cx.textAlign='center';
    cx.fillText(f.txt, f.x, f.y); cx.restore();
  }
}

const para = {x:0,y:0,a:0,tx:0,ty:0,hasTarget:false,turn:0};
let pendingEat = null;
let zoomLockInstalled=false;
function installMobileZoomLock(){
  if (zoomLockInstalled || typeof document==='undefined' || typeof document.addEventListener!=='function') return;
  zoomLockInstalled=true;
  document.addEventListener('dblclick',event=>{
    if (event&&event.cancelable) event.preventDefault();
  },{passive:false});
  for (const type of ['gesturestart','gesturechange','gestureend']){
    document.addEventListener(type,event=>{
      if (event&&event.cancelable) event.preventDefault();
    },{passive:false});
  }
}

function initCanvas(canvas){
  installMobileZoomLock();
  cv=canvas; cx=cv.getContext('2d');
  W=cv.width; R=W*0.49; CX=W/2; CY=W/2;
  reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  para.x=CX; para.y=CY; para.a=rand(0,6.28);
  initParticles();
  cv.addEventListener('pointerdown', e=>{
    if (e.pointerType==='touch' && e.cancelable) e.preventDefault();
    if (cine){ cineSkip(); return; }
    const rect=cv.getBoundingClientRect();
    const x=(e.clientX-rect.left)/rect.width*W;
    const y=(e.clientY-rect.top)/rect.height*W;
    if (Math.hypot(x-CX,y-CY)>R) return;
    if (S.phase==='singularity'){
      handlePondClick(x,y);
      return;
    }
    handleFieldClick(x,y);
  });
}
function handleFieldClick(x,y){
  const f = foodAt(x,y);
  if (f){ setTarget(f.x,f.y); pendingEat=f; return; }
  setTarget(x,y);
  const {g,crit} = doClick();
  ripples.push({x,y,r:crit?8:4,a:1,crit});
  addFloat(x,y-14,'+'+plain(g), crit?'#ffc46b':'#5ce0c0');
  if (typeof renderStats==='function') renderStats();
}
function setTarget(x,y){
  para.tx=x; para.ty=y; para.hasTarget=true;
  para.targetBoost=manualNavigationBoost(S.stage,Math.hypot(x-para.x,y-para.y),R);
}

/* ── 主分派 ── */
function draw(t, raw){
  if (cine){ drawCine(t, raw); return; }
  if (S.phase==='singularity'){ drawPond(t, raw); return; }
  drawMortal(t,raw);
}

/* ═══ 凡人層 ═══ */
function drawMortal(t,raw){
  const idx=S.stage, bd=band(idx);
  cx.clearRect(0,0,W,W);
  cx.save();
  cx.beginPath(); cx.arc(CX,CY,R,0,6.2832); cx.clip();
  drawBg(idx,t);
  drawFieldByBand(idx,bd,t);
  drawRipples();
  drawFood(t);
  moveParamecium(idx,raw);
  drawRetinue(idx,t,'back');
  drawParamecium(idx,bd,t);
  drawRetinue(idx,t,'front');
  drawFloats();
  drawEventOverlay(t);
  cx.restore();
  cx.strokeStyle='rgba(29,74,99,.9)'; cx.lineWidth=2;
  cx.beginPath(); cx.arc(CX,CY,R,0,6.2832); cx.stroke();
}

function drawBg(idx,t){
  const bd=band(idx);
  let h1,s1,l1;
  if (bd==='bio'){ h1=190-idx*1.2; s1=45; l1=13; }
  else if (bd==='planet'){ h1=215; s1=25; l1=9; }
  else if (bd==='star'){ h1=228; s1=30; l1=7; }
  else if (bd==='degen'){ h1=242; s1=28; l1=5; }
  else { h1=255; s1=30; l1=4; }
  const bg=cx.createRadialGradient(CX,CY,0,CX,CY,R);
  bg.addColorStop(0,`hsl(${h1} ${s1}% ${l1}%)`);
  bg.addColorStop(1,`hsl(${h1+10} ${s1}% ${Math.max(l1-8,2)}%)`);
  cx.fillStyle=bg; cx.fillRect(0,0,W,W);
}

function drawFieldByBand(idx,bd,t){
  if (bd!=='bio'){
    const al = bd==='planet'?0.35 : bd==='star'?0.6 : 0.8;
    stars.forEach(s=>{
      const tw = reduce?1:(Math.sin(t/700+s.ph)*.4+.6);
      cx.globalAlpha=al*tw; cx.fillStyle='#dff';
      const rr=s.r*R;
      cx.beginPath(); cx.arc(CX+Math.cos(s.a)*rr, CY+Math.sin(s.a)*rr, s.sz,0,6.2832); cx.fill();
    });
    cx.globalAlpha=1;
  }
  if (bd==='bio'){
    motes.forEach(m=>{
      if(!reduce) m.a+=m.s/1000;
      const rr=m.r*R*0.94;
      cx.fillStyle='rgba(120,200,180,.28)';
      cx.beginPath();
      cx.arc(CX+Math.cos(m.a)*rr, CY+Math.sin(m.a+Math.sin(t/2000+m.d)*.05)*rr, m.sz,0,6.2832);
      cx.fill();
    });
  }
  else if (bd==='planet'){
    motes.forEach(m=>{
      if(!reduce) m.a+=m.s/2200;
      const rr=(0.3+m.r*0.6)*R;
      cx.fillStyle='rgba(200,180,150,.3)';
      cx.beginPath(); cx.arc(CX+Math.cos(m.a)*rr, CY+Math.sin(m.a)*rr*0.92, m.sz,0,6.2832); cx.fill();
    });
  }
  else if (bd==='star'){
    for (let i=0;i<5;i++){
      const a=i*1.256+t/26000, rr=R*(0.35+((i*97)%40)/100);
      const gx=CX+Math.cos(a)*rr, gy=CY+Math.sin(a)*rr;
      const g=cx.createRadialGradient(gx,gy,0,gx,gy,70);
      g.addColorStop(0,'rgba(255,170,110,.06)'); g.addColorStop(1,'rgba(255,170,110,0)');
      cx.fillStyle=g; cx.fillRect(gx-70,gy-70,140,140);
    }
  }
  else if (bd==='degen'){
    filPhase += reduce?0:0.003;
    cx.strokeStyle='rgba(150,140,255,.14)'; cx.lineWidth=1;
    for (let i=0;i<6;i++){
      const baseA=i/6*6.2832+filPhase;
      cx.beginPath();
      for (let k=0;k<=20;k++){
        const a=baseA+k/20*1.4;
        const rr=R*(0.45+0.28*Math.sin(k/20*3.14+i));
        const x=CX+Math.cos(a)*rr, y=CY+Math.sin(a)*rr;
        k===0?cx.moveTo(x,y):cx.lineTo(x,y);
      }
      cx.stroke();
    }
  }
  else {
    cx.strokeStyle='rgba(120,160,220,.06)'; cx.lineWidth=.6;
    for (let r=0.2;r<=1;r+=0.2){ cx.beginPath(); cx.arc(CX,CY,r*R,0,6.2832); cx.stroke(); }
    for (let i=0;i<10;i++){
      const a=i/10*6.2832 + (reduce?0:t/40000);
      cx.beginPath();
      for (let k=1;k<=16;k++){
        const rr=k/16*R;
        const bend=Math.max(0,1-rr/(R*0.5))*0.35;
        const x=CX+Math.cos(a+bend)*rr, y=CY+Math.sin(a+bend)*rr;
        k===1?cx.moveTo(x,y):cx.lineTo(x,y);
      }
      cx.stroke();
    }
  }
  const bodies=Math.min(BUILDINGS.reduce((s,b)=>s+S.owned[b.id],0),32);
  const bodyC=BODY_COLOR[idx];
  for (let i=0;i<bodies;i++){
    const a=i*2.399+t/9000, rr=R*0.34+(i/32)*R*0.55;
    cx.fillStyle=hexA(bodyC,.13);
    cx.beginPath();
    cx.ellipse(CX+Math.cos(a)*rr, CY+Math.sin(a)*rr, 7,4,a,0,6.2832);
    cx.fill();
  }
}

function hexA(hex,a){
  const r=parseInt(hex.slice(1,3),16), g=parseInt(hex.slice(3,5),16), b=parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${a})`;
}
function drawRipples(){
  for (let i=ripples.length-1;i>=0;i--){
    const r=ripples[i]; r.r+=r.crit?7:5; r.a-=.03;
    if (r.a<=0){ ripples.splice(i,1); continue; }
    cx.strokeStyle=r.crit?`rgba(255,196,107,${r.a})`:`rgba(92,224,192,${r.a})`;
    cx.lineWidth=r.crit?2.5:1.5;
    cx.beginPath(); cx.arc(r.x,r.y,r.r,0,6.2832); cx.stroke();
  }
}
function moveParamecium(idx,dt){
  if (reduce) return;
  // Movement used to be applied once per rendered frame.  A long late-game
  // jet turns a tiny random angle into several pixels of apparent shaking, and
  // uneven frame cadence made the effect worse.  Integrate against a bounded
  // frame delta and keep a low-pass angular velocity instead.
  const frame=Number.isFinite(dt)?Math.max(.25,Math.min(dt*60,2.25)):1;
  const nav=navigationProfile(idx);
  let sp=nav.cruise;
  if (!Number.isFinite(para.turn)) para.turn=0;
  if (para.hasTarget){
    const targetDistance=Math.hypot(para.tx-para.x,para.ty-para.y);
    const desired=Math.atan2(para.ty-para.y,para.tx-para.x);
    let diff=desired-para.a;
    while(diff>Math.PI)diff-=6.2832; while(diff<-Math.PI)diff+=6.2832;
    const steer=1-Math.pow(1-nav.steer,frame);
    para.turn*=Math.pow(.55,frame);
    para.a+=diff*steer;
    if (!Number.isFinite(para.targetBoost)) para.targetBoost=manualNavigationBoost(idx,targetDistance,R);
    sp=nav.targetSpeed*para.targetBoost;
    if (targetDistance<12){
      para.hasTarget=false;
      para.targetBoost=1;
      if (pendingEat){ eatFood(pendingEat); pendingEat=null; }
    }
  } else {
    const retain=Math.pow(nav.retain,frame);
    // At cosmic scale even sub-degree Brownian turning makes long jets shake.
    // Keep late forms on an inertial heading; only biological forms meander.
    const noise=(Math.random()-.5)*nav.wander*Math.sqrt(frame);
    para.turn=para.turn*retain+noise;
    para.a+=para.turn*frame;
  }
  para.x+=Math.cos(para.a)*sp*frame;
  para.y+=Math.sin(para.a)*sp*frame;
  const limit=R-72, dx=para.x-CX, dy=para.y-CY, dist=Math.hypot(dx,dy);
  if (dist>limit){
    // Clamp once at the soft rim so a large halo cannot bounce between two
    // adjacent pixels while its centre is still trying to turn back inward.
    para.x=CX+dx/dist*limit;
    para.y=CY+dy/dist*limit;
    const back=Math.atan2(CY-para.y,CX-para.x);
    let diff=back-para.a;
    while(diff>Math.PI)diff-=6.2832; while(diff<-Math.PI)diff+=6.2832;
    para.turn*=.35;
    para.a+=diff*(1-Math.pow(1-nav.edgeSteer,frame));
  }
}

/* ═══ 纖毛特化：全 31 階，每階自己的表達 ═══ */
function rimPoint(a,rw,rh){
  const ex=Math.cos(a)*rw, ey=Math.sin(a)*rh;
  return {ex,ey,nn:Math.atan2(ey/(rh*rh),ex/(rw*rw))};
}
function drawCilia(idx,bd,t,rw,rh,body,p){
  if (idx===9){                               // 鯤：纖毛消融成雙層呼吸光暈
    const breathe=reduce?1:.9+Math.sin(t/850)*.1;
    cx.save(); cx.globalAlpha=breathe;
    cx.shadowColor=body; cx.shadowBlur=22;
    cx.strokeStyle=hexA(body,.5); cx.lineWidth=4;
    cx.beginPath(); cx.ellipse(0,0,rw*1.18,rh*1.62,0,0,6.2832); cx.stroke();
    cx.strokeStyle='rgba(190,240,255,.25)'; cx.lineWidth=1.5;
    cx.beginPath(); cx.ellipse(0,0,rw*1.36,rh*1.9,0,0,6.2832); cx.stroke();
    cx.restore();
    return;
  }
  const cCol = (idx===24||idx===25) ? RIM_COLOR[idx] : body;

  // 通用環刷
  function ring(n,len,w,wob,sw,opt){
    opt=opt||{};
    cx.lineWidth=w;
    for (let i=0;i<n;i++){
      const a=i/n*6.2832;
      const {ex,ey,nn}=rimPoint(a,rw,rh);
      let L=len, al=(opt.alpha!==undefined?opt.alpha:.4+p*.35), ang=nn;
      const ph=opt.coherent ? (t/sw - i*0.16) : (t/sw - i*0.5);
      const wv=reduce?0:Math.sin(ph)*wob;
      if (opt.lenFn) L=opt.lenFn(i,a,ph);
      if (opt.alphaFn) al=opt.alphaFn(i,a,ph);
      if (opt.tangent) ang=nn+Math.PI/2*opt.tangent;
      if (opt.inward){
        cx.strokeStyle=hexA(cCol,al);
        cx.beginPath();
        cx.moveTo(ex+Math.cos(nn)*(L+wv+4), ey+Math.sin(nn)*(L+wv+4));
        cx.lineTo(ex+Math.cos(nn)*3, ey+Math.sin(nn)*3);
        cx.stroke();
        continue;
      }
      cx.strokeStyle=hexA(cCol,al);
      cx.beginPath(); cx.moveTo(ex,ey);
      if (opt.curl){
        const tx=ex+Math.cos(ang)*(L+wv), ty=ey+Math.sin(ang)*(L+wv);
        cx.quadraticCurveTo(tx,ty, tx+Math.cos(ang+1.9)*4, ty+Math.sin(ang+1.9)*4);
      } else {
        cx.lineTo(ex+Math.cos(ang)*(L+wv), ey+Math.sin(ang)*(L+wv));
      }
      cx.stroke();
    }
  }

  switch(true){
    case idx===0: ring(46,9,1.4,4,90); break;                                  // 草履蟲：原初纖毛
    case idx===1: ring(46,7,1.2,3,55); break;                                  // 水蚤：細而急
    case idx===2: ring(44,5,2.0,1.5,140); break;                               // 蜜蜂：蜜色絨毛
    case idx===3: ring(46,8,1.1,5,34,{alphaFn:(i,a,ph)=>.3+Math.abs(Math.sin(t/60+i))*.5}); break; // 蜂鳥：羽光疾閃
    case idx===4: ring(44,5,2.2,1.2,150); break;                               // 倉鼠：奶油絨
    case idx===5: ring(38,8,1.6,2,200,{coherent:true}); break;                 // 貓：柔順滑毛
    case idx===6: ring(40,7,1.4,0.6,400,{lenFn:i=>i%5===0?10:7}); break;       // 人：整齊的刻度——秩序
    case idx===7: ring(26,8,2.8,1,260); break;                                 // 大象：疏而沉
    case idx===8: ring(32,11,2.0,2.5,240,{coherent:true}); break;              // 藍鯨：流線長鬃
    case idx===10: ring(20,4.5,3.2,0.3,500,{alpha:.5}); break;                 // 巨人：石樁更沉
    case idx===11:                                                              // 龍：同調鬃流，背脊揚起
      ring(30,8,1.9,2.5,210,{coherent:true, lenFn:(i,a)=>Math.sin(a)<-0.4?14:8});
      break;
    case idx===12: {                                                            // 世界龜：連續的環身群山，以大波律動
      const N=64;
      cx.fillStyle=hexA(body,.44); cx.strokeStyle=hexA(body,.86); cx.lineWidth=1.6;
      cx.shadowColor='#dcebb0'; cx.shadowBlur=8;
      cx.beginPath();
      for (let i=0;i<=N;i++){
        const a=i/N*6.2832;
        const wave=reduce?0:Math.sin(a*5-t/1100)*9+Math.sin(a*11+t/1800)*3.5;
        const h=27+wave, M=rimPoint(a,rw,rh);
        const x=M.ex+Math.cos(M.nn)*h, y=M.ey+Math.sin(M.nn)*h;
        i===0?cx.moveTo(x,y):cx.lineTo(x,y);
      }
      for (let i=N;i>=0;i--){
        const a=i/N*6.2832, M=rimPoint(a,rw,rh);
        cx.lineTo(M.ex,M.ey);
      }
      cx.closePath(); cx.fill(); cx.stroke(); cx.shadowBlur=0;
      break; }
    case idx===13: {                                                            // 耶夢加得：環行之浪（與龜有別：流動、有浪花）
      const N=22;
      cx.lineWidth=2;
      for (let i=0;i<N;i++){
        const ph=i*0.6 - t/260;
        const a=i/N*6.2832;
        const {ex,ey,nn}=rimPoint(a,rw,rh);
        const h=5+(reduce?0:Math.sin(ph)*4);
        const tx=ex+Math.cos(nn)*h, ty=ey+Math.sin(nn)*h;
        cx.strokeStyle=hexA(body,.45+(reduce?0:Math.sin(ph))*.2);
        cx.beginPath(); cx.moveTo(ex,ey);
        cx.quadraticCurveTo(tx,ty, tx+Math.cos(nn+1.9)*4, ty+Math.sin(nn+1.9)*4);
        cx.stroke();
        if (!reduce && Math.sin(ph)>0.82){
          cx.fillStyle='rgba(240,255,250,.7)';
          cx.beginPath(); cx.arc(tx,ty,1.2,0,6.2832); cx.fill();
        }
      }
      break; }
    case idx===14: {                                                            // 微行星：耶夢加得凝為世界，神環仍未散去
      const breathe=reduce?1:.96+Math.sin(t/1550)*.04;
      cx.save(); cx.globalAlpha=breathe;
      cx.strokeStyle='rgba(91,205,145,.18)'; cx.shadowColor='#58b98a'; cx.shadowBlur=6;
      cx.lineWidth=1.15; cx.beginPath(); cx.ellipse(0,0,rw*1.1,rh*1.4,0,0,6.2832); cx.stroke();
      cx.restore();
      break; }
    case idx<=15: ring(40,6,2,0.5,300,{lenFn:i=>5+((i*7)%5)}); break;           // 微/原行星：碎礫參差
    case idx===16: ring(36,11,1.6,2,320,{coherent:true,tangent:0.35}); break;   // 氣態巨行星：帶狀流雲
    case idx===17: ring(40,5,1.4,1,200,{alpha:.28}); break;                     // 褐矮星：餘燼微芒
    case idx===18: {                                                            // 紅矮星：慢速磁力拱橋，取代閃爍刺毛
      const rot=reduce?0:t/9000;
      cx.save(); cx.shadowColor='#ff735c'; cx.shadowBlur=6; cx.lineWidth=1.15;
      for (let i=0;i<6;i++){
        const a=rot+i/6*6.2832, b=a+.68;
        const A=rimPoint(a,rw,rh), B=rimPoint(b,rw,rh), m=(a+b)*.5;
        const lift=1.32+(reduce?0:Math.sin(t/1800+i)*.06);
        cx.strokeStyle=`rgba(255,120,92,${.22+i%2*.07})`;
        cx.beginPath(); cx.moveTo(A.ex,A.ey);
        cx.quadraticCurveTo(Math.cos(m)*rw*lift,Math.sin(m)*rh*(1.9+lift*.25),B.ex,B.ey);
        cx.stroke();
      }
      cx.restore();
      break; }
    case idx===19: {                                                            // 主序星：連續日冕與緩慢公轉光環
      const breathe=reduce?1:1+Math.sin(t/1700)*.045;
      const rot=reduce?0:t/11000;
      cx.save(); cx.rotate(rot); cx.shadowColor='#fff2c9'; cx.shadowBlur=10;
      for (let i=0;i<3;i++){
        cx.strokeStyle=`rgba(255,244,214,${.25-i*.055})`;
        cx.lineWidth=2.2-i*.55;
        cx.beginPath(); cx.ellipse(0,0,rw*(1.1+i*.13)*breathe,rh*(1.48+i*.2)*breathe,i*.34,0,6.2832); cx.stroke();
      }
      cx.strokeStyle='rgba(178,215,255,.2)'; cx.lineWidth=.9;
      cx.beginPath(); cx.ellipse(0,0,rw*1.52,rh*1.15,-.38,rot,rot+4.5); cx.stroke();
      cx.restore();
      break; }
    case idx===20: {                                                            // 紅超巨星：巨大對流帷幕，緩慢翻湧而不閃爍
      cx.save(); cx.lineCap='round'; cx.shadowColor='#ff5b38'; cx.shadowBlur=9;
      for (const s of [-1,1]) for (let layer=0;layer<3;layer++){
        cx.strokeStyle=`rgba(255,${92+layer*28},${55+layer*18},${.24-layer*.045})`;
        cx.lineWidth=3-layer*.65;
        cx.beginPath();
        for (let k=0;k<=18;k++){
          const u=k/18, x=-rw*1.03+u*rw*2.06;
          const swell=(reduce?0:Math.sin(t/1450+u*8+layer*1.4+s)*4.2);
          const y=s*(rh*(1.24+layer*.18)+Math.sin(u*Math.PI)*8)+swell;
          k===0?cx.moveTo(x,y):cx.lineTo(x,y);
        }
        cx.stroke();
      }
      cx.restore();
      break; }
    case idx===21: ring(48,9,0.9,0,999,{alpha:.75}); break;                     // 白矮星：晶針靜立
    case idx===22: {                                                            // 中子星：表面亮度隨磁極掃過，真正的雙極束只畫一次
      const beam=t/300;
      ring(46,8,1.6,1,200,{alphaFn:(i,a)=>.12+.8*Math.pow(Math.max(0,Math.cos(a-beam)),8)});
      break; }
    case idx===23: {                                                            // 夸克星：三相電層節點，不複製脈衝星的燈塔束
      const rot=reduce?0:t/5200;
      cx.save(); cx.rotate(rot); cx.lineCap='round';
      const phaseColors=['#7cf4ff','#e0a8ff','#ffd98a'];
      for (let i=0;i<3;i++){
        const a=i/3*6.2832, M=rimPoint(a,rw,rh);
        cx.strokeStyle=hexA(phaseColors[i],.46); cx.lineWidth=1.35;
        cx.beginPath(); cx.arc(M.ex,M.ey,3.1+i*.45,0,6.2832); cx.stroke();
      }
      cx.restore();
      break; }
    case idx===24:                                                              // 恆星黑洞：短促內墜＋緩慢的環行明暗
      ring(40,5.5,1.4,1.2,160,{inward:true,
        alphaFn:(i,a)=>.18+.55*Math.pow(Math.max(0,Math.cos(a - t/1200)),4)});
      break;
    case idx===COSMIC_IDX.supermassiveBlackHole: {                              // 超大質量黑洞：切向彎入的吸積流線
      const rot=reduce?0:t/18000;
      cx.save(); cx.rotate(rot); cx.lineCap='round'; cx.shadowColor='#b9d6ff'; cx.shadowBlur=8;
      for (let i=0;i<14;i++){
        const a=i/14*6.2832, M=rimPoint(a,rw,rh), outer=1.42+(i%3)*.12;
        cx.strokeStyle=i%4===0?'rgba(255,219,158,.4)':'rgba(174,211,255,.28)';
        cx.lineWidth=1.15+(i%2)*.45;
        cx.beginPath(); cx.moveTo(Math.cos(a+.42)*rw*outer,Math.sin(a+.42)*rh*outer);
        cx.bezierCurveTo(Math.cos(a+.3)*rw*1.22,Math.sin(a+.3)*rh*1.55,
          Math.cos(a+.12)*rw*1.08,Math.sin(a+.12)*rh*1.18,M.ex,M.ey); cx.stroke();
      }
      cx.restore();
      break; }
    case idx===COSMIC_IDX.hubble: {                                               // 哈伯球：纖毛成為向外遞增的哈伯流刻線
      const ph=reduce?.4:(t/3600)%1;
      cx.save(); cx.lineCap='round';
      for (let i=0;i<32;i++){
        const a=i/32*6.2832, M=rimPoint(a,rw,rh), q=(ph+i%4/4)%1;
        const inner=5+q*4, outer=inner+5+q*8;
        cx.strokeStyle=hexA(cCol,.12+(1-q)*.3); cx.lineWidth=.7+(1-q)*.55;
        cx.beginPath(); cx.moveTo(M.ex+Math.cos(M.nn)*inner,M.ey+Math.sin(M.nn)*inner);
        cx.lineTo(M.ex+Math.cos(M.nn)*outer,M.ey+Math.sin(M.nn)*outer); cx.stroke();
      }
      cx.restore();
      break; }
    default:      ring(40,10,1.3,2,300,{tangent:0.85,curl:true,coherent:true,alpha:.45}); // 星系：切線星流
  }
}

/* ═══ 體外延伸 ═══ */
function drawAppendages(idx,t,rw,rh,body){
  const wv=reduce?0:Math.sin(t/700)*1;
  if (idx===8){ // 藍鯨：月牙尾鰭（承自鯤的舊形）
    cx.fillStyle=hexA(body,.28);
    cx.strokeStyle=hexA(body,.5); cx.lineWidth=1.5;
    cx.beginPath();
    cx.moveTo(-rw*0.9,0);
    cx.quadraticCurveTo(-rw*1.2, -rh*1.1+wv*2, -rw*1.45, -rh*0.95);
    cx.quadraticCurveTo(-rw*1.2, 0, -rw*1.45, rh*0.95);
    cx.quadraticCurveTo(-rw*1.2, rh*1.1+wv*2, -rw*0.9, 0);
    cx.closePath(); cx.fill(); cx.stroke();
  }
  if (idx===9){ // 鯤：巨型彎月——圓弧在頭部，月角向後拖曳
    const OX=rw*1.28, OY=rh*2.2;
    const a0=-(Math.PI-0.62), a1=(Math.PI-0.62);   // 弧經前方，開口在後
    // 月身（角端漸尖）
    cx.fillStyle=hexA(body,.32);
    cx.strokeStyle=hexA(body,.6); cx.lineWidth=1.5;
    cx.shadowColor=body; cx.shadowBlur=12;
    cx.beginPath();
    const N=34;
    for (let k=0;k<=N;k++){
      const a=a0+(a1-a0)*k/N;
      cx[k===0?'moveTo':'lineTo'](Math.cos(a)*OX, Math.sin(a)*OY);
    }
    for (let k=N;k>=0;k--){
      const a=a0+(a1-a0)*k/N;
      const e=Math.pow(Math.sin(Math.PI*k/N),0.7);       // 角端收尖
      const ix=OX-(OX-rw*1.02)*e, iy=OY-(OY-rh*1.5)*e;
      cx.lineTo(Math.cos(a)*ix, Math.sin(a)*iy);
    }
    cx.closePath(); cx.fill(); cx.stroke();
    cx.shadowBlur=0;

    // 月牙兩端的纖毛神性化成水流流蘇：多段行波讓它像尾流，而非獸毛或尖刺。
    cx.save(); cx.lineCap='round'; cx.shadowColor='#bfefff'; cx.shadowBlur=6;
    for (const tip of [{a:a0,s:-1},{a:a1,s:1}]){
      const tx=Math.cos(tip.a)*OX, ty=Math.sin(tip.a)*OY;
      for (let i=0;i<5;i++){
        const phase=reduce?0:t/820+i*.82+tip.s*.7;
        const len=24+i*5.5;
        const w1=reduce?0:Math.sin(phase)*3.2;
        const w2=reduce?0:Math.sin(phase*.73+i*1.31)*5.2;
        const endY=ty+tip.s*(8+i*3)+w2;
        const trail=cx.createLinearGradient(tx,ty,tx-len,endY);
        trail.addColorStop(0,`rgba(210,247,255,${.22-i*.018})`);
        trail.addColorStop(.58,`rgba(145,218,242,${.14-i*.012})`);
        trail.addColorStop(1,'rgba(94,176,214,0)');
        cx.strokeStyle=trail;
        cx.lineWidth=.72+i*.1;
        cx.beginPath(); cx.moveTo(tx,ty);
        cx.bezierCurveTo(
          tx-len*.24,ty+tip.s*(2+i)+w1,
          tx-len*.62,ty+tip.s*(6+i*2)-w1*.65+w2*.35,
          tx-len,endY
        );
        cx.stroke();
        if (!reduce){
          const flow=(t/2200+i*.17+(tip.s>0?.11:.43))%1;
          const fx=tx-len*flow;
          const fy=ty+(endY-ty)*flow+Math.sin(phase+flow*6.2832)*2.1;
          cx.fillStyle=`rgba(208,246,255,${.16*(1-flow)})`;
          cx.beginPath(); cx.arc(fx,fy,.7+i*.08,0,6.2832); cx.fill();
        }
      }
    }
    cx.restore();
  }
  if (idx===10){ // 巨人：背負石月——弧在身後，如古碑環抱
    const OX=rw*1.18, OY=rh*1.95;
    const a0=0.62, a1=6.2832-0.62;      // 弧經背後，開口朝前
    cx.fillStyle=hexA(body,.22);
    cx.strokeStyle=hexA(body,.45); cx.lineWidth=1.4;
    cx.beginPath();
    const N=30;
    for (let k=0;k<=N;k++){
      const a=a0+(a1-a0)*k/N;
      cx[k===0?'moveTo':'lineTo'](Math.cos(a)*OX, Math.sin(a)*OY);
    }
    for (let k=N;k>=0;k--){
      const a=a0+(a1-a0)*k/N;
      const e=Math.pow(Math.sin(Math.PI*k/N),0.7);
      const ix=OX-(OX-rw*0.98)*e, iy=OY-(OY-rh*1.42)*e;
      cx.lineTo(Math.cos(a)*ix, Math.sin(a)*iy);
    }
    cx.closePath(); cx.fill(); cx.stroke();
  }
  if (idx===11){ // 龍：後掠巨翼——翼骨向後掠出，大幅揮動
    const flap=reduce?0:Math.sin(t/700)*0.22;
    for (const s of [1,-1]){
      cx.save();
      cx.scale(1,s);
      cx.translate(rw*0.1, rh*0.72);   // 肩點
      cx.rotate(flap);
      const angs=[2.15,2.5,2.85];      // 後掠方向（後外側）
      const lens=[rw*1.55, rw*1.3, rw*0.95];
      const tips=angs.map((a,k)=>({x:Math.cos(a)*lens[k], y:Math.sin(a)*lens[k]}));
      // 翼膜（後緣扇形凹陷）
      cx.fillStyle=hexA(body,.18);
      cx.beginPath();
      cx.moveTo(0,0);
      cx.lineTo(tips[0].x,tips[0].y);
      cx.quadraticCurveTo((tips[0].x+tips[1].x)/2+7,(tips[0].y+tips[1].y)/2-8, tips[1].x,tips[1].y);
      cx.quadraticCurveTo((tips[1].x+tips[2].x)/2+7,(tips[1].y+tips[2].y)/2-8, tips[2].x,tips[2].y);
      cx.quadraticCurveTo(-rw*0.35, rh*0.28, 0,0);
      cx.closePath(); cx.fill();
      // 前緣主骨（粗）＋兩根指骨
      cx.strokeStyle=hexA(body,.6); cx.lineWidth=2.6;
      cx.beginPath(); cx.moveTo(0,0);
      cx.quadraticCurveTo(tips[0].x*0.45, tips[0].y*0.45-6, tips[0].x,tips[0].y); cx.stroke();
      cx.lineWidth=1.6;
      for (const tp of [tips[1],tips[2]]){
        cx.beginPath(); cx.moveTo(0,0);
        cx.quadraticCurveTo(tp.x*0.5, tp.y*0.5-4, tp.x,tp.y); cx.stroke();
      }
      cx.restore();
    }
  }
  if (idx===13){ // 耶夢加得：環身銜尾光環
    const rr=rw*1.35;
    const rot=reduce?0:t/5000;
    cx.save(); cx.rotate(rot);
    cx.strokeStyle=hexA(body,.5); cx.lineWidth=3;
    cx.shadowColor=body; cx.shadowBlur=8;
    cx.beginPath(); cx.arc(0,0,rr,0.45,6.1); cx.stroke();
    cx.shadowBlur=0;
    cx.fillStyle=hexA(body,.85);
    cx.beginPath(); cx.arc(Math.cos(0.3)*rr, Math.sin(0.3)*rr, 4,0,6.2832); cx.fill();
    cx.restore();
  }
}

/* 傳說／宇宙帶共用氣場：寬、柔、緩，不以細刺堆砌神性。 */
function drawMythicAura(idx,t,rw,rh,colorOverride,detail){
  if (idx<10) return;
  detail=detail===undefined?1:Math.max(0,Math.min(detail,1));
  if (idx===14){
    // 神話正在退潮：只留一圈殘響，讓微行星能自然接往樸素的原行星。
    const aura=colorOverride||'#79b99a', breathe=reduce?1:.97+Math.sin(t/2100)*.03;
    cx.save(); cx.globalAlpha=breathe;
    const g=cx.createRadialGradient(0,0,rh*.25,0,0,rw*1.72);
    g.addColorStop(0,hexA(aura,.055)); g.addColorStop(.58,hexA(aura,.02)); g.addColorStop(1,hexA(aura,0));
    cx.fillStyle=g; cx.beginPath(); cx.ellipse(0,0,rw*1.76,rh*2.12,0,0,6.2832); cx.fill();
    cx.rotate(reduce?0:t/15000); cx.setLineDash([17,14]);
    cx.strokeStyle=hexA(aura,.105); cx.shadowColor=aura; cx.shadowBlur=8; cx.lineWidth=.85;
    cx.beginPath(); cx.ellipse(0,0,rw*1.46,rh*1.78,.18,0,6.2832); cx.stroke();
    cx.setLineDash([]); cx.restore();
    return;
  }
  if (idx<=13){
    const aura=colorOverride||{10:'#c8b8ff',11:'#ff3048',12:'#dcebb0',13:'#42e883'}[idx];
    const breathe=reduce?1:.88+Math.sin(t/1100+idx)*.12;
    cx.save(); cx.globalAlpha=breathe;
    const g=cx.createRadialGradient(0,0,rh*.2,0,0,rw*1.65);
    g.addColorStop(0,hexA(aura,.11)); g.addColorStop(1,hexA(aura,0));
    cx.fillStyle=g; cx.beginPath(); cx.ellipse(0,0,rw*1.7,rh*2.15,0,0,6.2832); cx.fill();
    cx.strokeStyle=hexA(aura,.32); cx.shadowColor=aura; cx.shadowBlur=24;
    cx.lineWidth=4; cx.beginPath(); cx.ellipse(0,0,rw*1.3,rh*1.58,0,0,6.2832); cx.stroke();
    cx.strokeStyle=hexA(aura,.18); cx.lineWidth=1.2;
    cx.beginPath(); cx.ellipse(0,0,rw*1.48,rh*1.84,0,0,6.2832); cx.stroke();
    cx.restore();
    return;
  }

  if (idx===COSMIC_IDX.supermassiveBlackHole){
    // Space around the shadow is read through displaced tangent arcs rather
    // than a solid shell: a lightweight 2D approximation of lensing shear.
    const aura=colorOverride||(RIM_COLOR[idx]||'#b9d6ff'), rot=0;
    cx.save();
    const warp=cx.createRadialGradient(0,0,rh*.15,0,0,rw*2.5);
    warp.addColorStop(0,hexA('#ffe8b7',.13)); warp.addColorStop(.34,hexA(aura,.075)); warp.addColorStop(1,hexA(aura,0));
    cx.fillStyle=warp; cx.beginPath(); cx.ellipse(0,0,rw*2.55,rh*3.25,0,0,6.2832); cx.fill();
    cx.rotate(rot); cx.lineCap='round'; cx.shadowColor=aura; cx.shadowBlur=18*detail;
    for (let i=0;i<8;i++){
      const a=i/8*6.2832, s=i%2?1:-1, spread=1.18+(i%3)*.24;
      const x1=Math.cos(a-.34)*rw*spread, y1=Math.sin(a-.34)*rh*spread*1.35;
      const x2=Math.cos(a+.38)*rw*spread, y2=Math.sin(a+.38)*rh*spread*1.35;
      cx.strokeStyle=hexA(i%3===0?'#ffe1a8':aura,.15+.1*detail); cx.lineWidth=1.15+(i%2)*.65;
      cx.beginPath(); cx.moveTo(x1,y1);
      cx.bezierCurveTo(Math.cos(a-.12)*rw*(.44+s*.05),Math.sin(a-.12)*rh*2.05,
        Math.cos(a+.12)*rw*(.44-s*.05),Math.sin(a+.12)*rh*2.05,x2,y2); cx.stroke();
    }
    cx.restore();
    return;
  }

  if (idx===COSMIC_IDX.galaxy || idx===COSMIC_IDX.cluster){
    // 星系／星系團：星海聖環逐層擴張；星系團再加引力透鏡弧與熱氣體帷幕。
    const cluster=idx===COSMIC_IDX.cluster, aura=colorOverride||(cluster?'#d6e8ff':'#c9d7ff');
    const breathe=reduce?1:.94+Math.sin(t/(cluster?2400:1900))*.06;
    cx.save(); cx.globalAlpha=breathe*(.42+.58*detail); cx.shadowColor=aura; cx.shadowBlur=cluster?18:13;
    const halo=cx.createRadialGradient(0,0,rh*.12,0,0,rw*(cluster?2.55:2.15));
    halo.addColorStop(0,hexA(aura,cluster?.14:.11)); halo.addColorStop(.55,hexA(aura,.035)); halo.addColorStop(1,hexA(aura,0));
    cx.fillStyle=halo; cx.beginPath(); cx.ellipse(0,0,rw*(cluster?2.58:2.2),rh*(cluster?3.05:2.6),0,0,6.2832); cx.fill();
    cx.rotate(reduce?-.22:t/(cluster?23000:17000)-.22);
    for (let i=0;i<(cluster?5:3);i++){
      cx.setLineDash(cluster&&i%2?[4,13]:[13,9]);
      cx.strokeStyle=hexA(aura,(cluster?.19:.16)-i*.018); cx.lineWidth=1.2-i*.1;
      cx.beginPath(); cx.ellipse(0,0,rw*(1.42+i*.22),rh*(1.72+i*.25),i*.36,0,6.2832); cx.stroke();
    }
    if (cluster&&detail>.5){
      cx.setLineDash([]); cx.strokeStyle='rgba(151,229,255,.18)'; cx.lineWidth=3.5;
      cx.beginPath(); cx.ellipse(0,0,rw*2.08,rh*1.2,.48,.35,2.35); cx.stroke();
      cx.beginPath(); cx.ellipse(0,0,rw*2.24,rh*1.34,-.42,3.35,5.75); cx.stroke();
    }
    cx.setLineDash([]); cx.restore();
    return;
  }
  if (idx===COSMIC_IDX.j0838){
    // J0838+5327：把舊版的柔光與外擴脈衝融入電波軸，形成低速、對稱的聖像結構。
    const aura=colorOverride||'#e8e0ff', breathe=reduce?1:.94+Math.sin(t/1900)*.06;
    cx.save(); cx.globalAlpha=breathe*(.36+.64*detail);
    const halo=cx.createRadialGradient(0,0,rh*.1,0,0,rw*2.38);
    halo.addColorStop(0,hexA(aura,.15)); halo.addColorStop(.46,hexA(aura,.052)); halo.addColorStop(1,hexA(aura,0));
    cx.fillStyle=halo; cx.beginPath(); cx.ellipse(0,0,rw*2.4,rh*2.9,0,0,6.2832); cx.fill();
    cx.rotate(reduce?-.2:t/18000-.2); cx.shadowColor=aura; cx.shadowBlur=detail>.45?18:7;
    const rings=detail>.55?3:1;
    for (let i=0;i<rings;i++){
      cx.setLineDash(i===1?[4,12]:[14,9]);
      cx.strokeStyle=hexA(aura,.2-i*.04); cx.lineWidth=1.25-i*.2;
      cx.beginPath(); cx.ellipse(0,0,rw*(1.52+i*.24),rh*(1.9+i*.28),i*.31,0,6.2832); cx.stroke();
    }
    if (detail>.7){
      cx.setLineDash([]); cx.strokeStyle=hexA('#fff7df',.16); cx.lineWidth=.8;
      for (const s of [-1,1]){
        cx.beginPath(); cx.moveTo(0,0); cx.quadraticCurveTo(s*rw*.55,-rh*1.4,s*rw*1.5,-rh*2.08); cx.stroke();
      }
    }
    cx.setLineDash([]); cx.restore();
    return;
  }
  if (idx===COSMIC_IDX.laniakea){
    // 拉尼亞凱亞：沒有外殼，只有速度流定義的宇宙網曼陀羅。
    const aura=colorOverride||'#b9c8ff', rot=reduce?0:t/28000;
    cx.save(); cx.globalAlpha=.52+.48*detail;
    const halo=cx.createRadialGradient(0,0,rh*.18,0,0,rw*3.05);
    halo.addColorStop(0,hexA('#fff1ce',.18)); halo.addColorStop(.28,hexA(aura,.12));
    halo.addColorStop(.7,hexA(aura,.045)); halo.addColorStop(1,hexA(aura,0));
    cx.fillStyle=halo; cx.beginPath(); cx.ellipse(0,0,rw*3.08,rh*3.72,0,0,6.2832); cx.fill();
    cx.rotate(rot); cx.shadowColor=aura; cx.shadowBlur=22*detail; cx.lineCap='round';
    for (let arm=0;arm<9;arm++){
      const a=arm/9*6.2832;
      cx.strokeStyle=hexA(aura,.2+(arm%3)*.045); cx.lineWidth=1.45+(arm%3)*.48;
      cx.beginPath(); cx.moveTo(Math.cos(a+.35)*rw*2.55,Math.sin(a+.35)*rh*3.1);
      cx.bezierCurveTo(Math.cos(a+.2)*rw*1.8,Math.sin(a+.2)*rh*2.15,
        Math.cos(a-.15)*rw*.85,Math.sin(a-.15)*rh*.95,0,0); cx.stroke();
      for (let k=1;k<4;k++){
        const q=k/4, aa=a+.35*(1-q)-.15*q;
        cx.fillStyle=hexA(k===3?'#fff2ce':aura,.32+(1-q)*.22);
        cx.beginPath(); cx.arc(Math.cos(aa)*rw*2.55*(1-q),Math.sin(aa)*rh*3.1*(1-q),1.1+(1-q)*1.2,0,6.2832); cx.fill();
      }
    }
    cx.setLineDash([4,11]); cx.strokeStyle=hexA('#fff4d8',.24); cx.lineWidth=1.55;
    cx.beginPath(); cx.ellipse(0,0,rw*2.28,rh*2.72,.25,0,6.2832); cx.stroke();
    cx.setLineDash([]); cx.restore();
    return;
  }
  if (idx===COSMIC_IDX.hubble){
