    el.querySelector('.sprice').innerHTML = `${c2} ${ui('remnants')}`;
  }
  const sh=$('shoal-h');
  const cap=avatarCap(), active=Math.min(S.avatars.length,cap);
  if (sh) sh.textContent = isEn()
    ? `Shoal slots ${active}/${cap} · remembered ${S.avatars.length}/${AVATAR_CAP}`
    : `群游席位 ${active}/${cap} · 已記憶 ${S.avatars.length}/${AVATAR_CAP}`;
  const ab=$('av-btn');
  if (ab){
    const full = cap===0 || S.avatars.length>=cap;
    ab.textContent = cap===0 ? (isEn()?'Unlocks with atoms':'原子紀元解鎖')
      : full ? (isEn()?'Stage slots full':'本階席位已滿') : `${isEn()?'Summon':'喚出'} · ${avatarCost()} ${ui('freedom')}`;
    ab.disabled = full || S.freedom<avatarCost();
  }
  const f=fitness();
  const ib=$('ignite-btn');
  if (ib){
    const debris=remnantGain(), generation=generationGain(), wait=Math.max(0,30-(S.uniAge||0));
    ib.textContent = wait>0
      ? (isEn()?`Universe can be recast in ${Math.ceil(wait)}s`:`${Math.ceil(wait)} 秒後可重製宇宙`)
      : `${ui('ignite')} · +${debris} ${ui('remnants')} · +${generation.toFixed(2)} ${ui('gen')}`;
    ib.disabled=wait>0;
  }
  const st=$('sing-stats');
  if (st){
    st.innerHTML =
      `<span class="sing-stats-title">${isEn()?'Universe Status':'宇宙狀態'}</span>`+
      `${ui('materials')} ${fmt(Math.floor(S.materials))} · ${ui('mps')} ${materialRate().toFixed(1)} · ${isEn()?'click':'點擊'} +${plain(genesisClickPower())} · ${ui('remnants')} ${Math.floor(S.remnants)}<br>`+
      `${ui('freedom')} ${fmt(Math.floor(S.freedom))} · ${ui('fps')} ${freedomRate().toFixed(1)} · ${isEn()?'life-bearing universes':'載生宇宙'} ${Math.floor(S.lifeUniverses||0)}<br>`+
      `${isEn()?u.nameEn:u.name} · ${ui('gen')} ${S.gen.toFixed(2)} · ${ui('lifeindex')} 10<sup>${lifeExpText()}</sup> · +${expRateText()} ${ui('eps')} ${huayanByExp(S.lifeExp)}`;
  }
  const note=$('sing-note');
  if (note){
    const pct=(f*100).toFixed(1);
    if (stageIndex<UNIVERSE_STAGES.length-1){
      note.innerHTML=isEn()
        ? `${unlockedConstants().length} law${unlockedConstants().length===1?'':'s'} revealed · stability ${pct}%. Genesis Matter now condenses at ${materialRate().toFixed(1)}/s; upgrade matter to reveal new worlds, organisms, and laws.`
        : `已顯現 ${unlockedConstants().length} 條定律 · 穩定度 ${pct}%。創生質目前每秒凝聚 ${materialRate().toFixed(1)}；升級基本物質後，新的天體、生物與定律會逐步出現。`;
    } else {
      note.innerHTML = lifeUniverseActive()
        ? (isEn()?`Habitability ${pct}%. This is a life-bearing universe; the Life Index is rising.`:`適居度 ${pct}%。這是一座載生宇宙；生命指數正在攀升。`)
        : f+1e-12>=LIFE_FITNESS_MIN
        ? (isEn()?`Habitability ${pct}%. Complete the genesis chain to awaken life and begin Life Index growth.`:`適居度 ${pct}%。完成孕生鏈後，生命才會甦醒並開始累積生命指數。`)
        : (isEn()?`Habitability ${pct}%. Raise every revealed law until total habitability reaches ${(LIFE_FITNESS_MIN*100).toFixed(0)}%; biochemistry and Life Index growth remain dormant.`:`適居度 ${pct}%。將已顯現的定律穩定至總適居度 ${(LIFE_FITNESS_MIN*100).toFixed(0)}%；在此之前，生化孕生與生命指數皆保持沉寂。`);
    }
  }
}

/* ── 日誌 / 事件 ── */
function renderLog(){
  const title=$('acquisition-status-title');
  if (title) title.textContent=ui('observationLog');
  const log=$('log');
  const hideMeta=s=>String(s)
    .replace(/（(?:真實機制|真實結構|真實尺度)／神話化視覺）/g,'')
    .replace(/\s*[（(](?:real mechanism|real structure|real scale)\s*\/\s*mythic visualization[）)]/gi,'');
  if (log){
    const entries=logs.map(hideMeta),signature=`${isEn()?'en':'zh'}|${entries.join('\u0001')}`;
    if (log.dataset.signature!==signature){
      const oldTop=log.scrollTop,oldHeight=log.scrollHeight,wasReadingHistory=oldTop>4;
      log.innerHTML=entries.map(l=>`<div>${l}</div>`).join('');
      log.dataset.signature=signature;
      log.scrollTop=wasReadingHistory?oldTop+Math.max(0,log.scrollHeight-oldHeight):0;
    }
  }
}
function renderEvent(){
  const el=$('event-banner');
  if (activeEvent){
    const e=EVENTS[activeEvent.id];
    el.style.display='';
    el.innerHTML=`<span class="ev-nm">${tr(e,'name')}</span>${activeEvent.persistent
      ? `<span class="ev-skill">${isEn()?'STAGE POWER':'本階權能'}</span>`
      : `<span class="ev-skill num">${Math.max(0,activeEvent.remain).toFixed(0)}s</span>`}`;
  } else el.style.display='none';
}

/* ── 躍遷橫幅 ── */
function showBanner(kind, stageIdx, onDone){
  if (document.getElementById('banner')) document.getElementById('banner').remove();
  const st=STAGES[stageIdx];
  const prev=STAGES[Math.max(stageIdx-1,0)];
  const isSing=kind==='singularity';
  const verbTxt = (kind==='ending'||isSing) ? '' : ui(kind);
  const nameTxt = isSing
    ? (isEn()?'You become the singularity. “Outside” loses all meaning—nothing contains you, and no scale is greater than you.':'你成為奇點。「外面」二字，自此失去意義——沒有容你之物，也沒有大於你的尺度。')
    : kind==='ending'
    ? `「${isEn()?HUAYAN_UNITS[6].en:HUAYAN_UNITS[6].name}」`
    : tr(st,'name');
  const subTxt = isSing ? '' : kind==='ending'
    ? (isEn()?'There is no numeral beyond this one.':'沒有比這更大的數了。')
    : `${isEn()?'Scale tier':'尺度位階'} ${stageIdx+1}/${STAGES.length} · ${stageMeasure(st)} ${tr(st,'mass')}`;
  const noteTxt = isSing ? '' : kind==='ending'
    ? (isEn()?'And you keep swimming.':'而你，還在游。')
    : tr(st,'note');
  const analogyTxt=(isSing||kind==='ending')?'':stageAnalogy(stageIdx);

  const b=document.createElement('div');
  b.id='banner';
  b.className='banner '+kind+(matchMedia('(prefers-reduced-motion: reduce)').matches?' rm':'');
  b.innerHTML=`
    <div class="b-ghost">${kind==='ending'||isSing?'':tr(prev,'name')}</div>
    <div class="b-verb">${verbTxt}</div>
    <div class="b-name">${nameTxt}</div>
    <div class="b-sub">${subTxt}</div>
    <div class="b-note">${noteTxt}</div>
    <div class="b-analogy">${analogyTxt}</div>`;
  let finished=false;
  const finish=()=>{
    if (finished) return;
    finished=true;
    if (b.parentNode) b.remove();
    if (typeof onDone==='function') onDone();
  };
  b.onclick=finish;
  document.body.appendChild(b);
  const bannerDuration=isSing?3200:kind==='ending'?5200:3000;
  setTimeout(finish, bannerDuration);
}

/* ── 語言切換 ── */
function toggleLang(){
  S.lang = isEn()?'zh':'en';
  $('langbtn').textContent = isEn()?'中':'EN';
  say(isEn()?'English interface enabled. New observation-log entries will appear in English.':'已切換為繁體中文；新的觀測日誌訊息將以中文顯示。');
  buildShop(); buildSporeShop(); buildBuyAmt();
  if (S.phase==='singularity') buildSingularity();
  mobileDrawerUI.signature='';
  renderStaticLanguage();
  renderAll(); save();
}

/* ── 階段變化 hook ── */
function onStageChange(){
  ensureStageEventSkill();
  if (typeof para!=='undefined') para.turn=0;
  foods=[];
  buildShop();
  renderAll();
}
function hidePanels(){
  $('mortal-view').style.display='none';
  $('sing-view').style.display='none';
  const host=$('scope-status-host'); if (host) host.style.display='none';
  const drawer=$('upgrade-drawer'); if (drawer) drawer.classList.add('drawer-suspended');
}
function onSingularity(){
  $('mortal-view').style.display='none';
  $('sing-view').style.display='';
  $('freedom-wrap').style.display='';
  buildSingularity();
  const host=$('scope-status-host'); if (host) host.style.display='';
  const drawer=$('upgrade-drawer'); if (drawer) drawer.classList.remove('drawer-suspended');
  renderSing();
  renderMobileUpgradeDrawer();
}

/* ── 總渲染 ── */
function renderAll(){
  renderStaticLanguage();
  renderStats();
  renderScaleCodex();
  renderAchievements();
  if (S.phase==='mortal'){
    $('mortal-view').style.display='';
    $('sing-view').style.display='none';
    const host=$('scope-status-host'); if (host) host.style.display='';
    renderShop(); renderSporeShop(); renderCollapse(); renderLegacy();
  } else if (!cine){
    renderSing();
  }
  renderLog(); renderEvent();
  renderMobileUpgradeDrawer();
}

</script>
<script>
/* ═══ 主循環 ═══ */
window.__speed = 1;

function fillDebugSelects(){
  const ss=document.getElementById('dbg-stage');
  STAGES.forEach((s,i)=>{ const o=document.createElement('option');
    o.textContent=`${i+1}. ${s.name}`; ss.appendChild(o); });
  const es=document.getElementById('dbg-event');
  Object.entries(EVENTS).forEach(([id,e])=>{ const o=document.createElement('option');
    o.value=id; o.textContent=e.name; es.appendChild(o); });
}

let last=performance.now(), statAcc=0, dbgAcc=0;
function loop(now){
  const raw=Math.min((now-last)/1000,.25);
  last=now;
  const spd=window.__speed||1;
  const dt=raw*spd;

  if (!cine){
    if (S.phase==='mortal'){
      const g=rate()*dt;
      S.bio+=g;S.earned+=g;S.lifetime+=g;
      foodTimer+=dt;
      if (foodTimer>spawnInterval()){ foodTimer=0; spawnFood(); }
      updateFood(dt);
      tickEvent(dt);
      tickMerge(dt);
      if (has('automolt') && canCollapse()) doCollapse();
    } else {
      tickSing(dt);
    }
  }

  draw(now, raw*spd);
  if (S.phase==='singularity' && genesisComplete()){
    morphPreviewAcc+=raw;
    if (morphPreviewAcc>(reduce?.28:.09)){
      drawMorphPreview(now);
      morphPreviewAcc=0;
    }
  } else morphPreviewAcc=0;
  const codexPanel=$('scale-codex');
  if (codexPanel&&codexPanel.open){
    scaleCodexPreviewAcc+=raw;
    if (scaleCodexPreviewAcc>(reduce?.4:.12)){
      drawScaleCodexPreview(now);
      scaleCodexPreviewAcc=0;
    }
  } else scaleCodexPreviewAcc=0;

  statAcc+=raw;
  if (statAcc>.12){
    renderStats();
    if (!cine){
      if (S.phase==='mortal'){ renderShop(); renderCollapse(); }
      else renderSing();
    }
    renderEvent();
    renderMobileUpgradeDrawer();
    statAcc=0;
  }
  dbgAcc+=raw;
  if (dbgAcc>.5){ const ss=document.getElementById('dbg-stage'); if(ss) ss.selectedIndex=S.stage; dbgAcc=0; }

  requestAnimationFrame(loop);
}

async function boot(){
  S=freshState();
  initCanvas(document.getElementById('c'));
  buildShop(); buildSporeShop(); buildBuyAmt();
  fillDebugSelects();

  const loaded=await load();
  if (!loaded){ logs=[]; say('一隻草履蟲在原始湯裡睜開眼。點擊視野開始攝食。'); }
  buildScaleCodex();
  ensureStageEventSkill();
  document.getElementById('langbtn').textContent = isEn()?'中':'EN';
  if (isEn()){ buildShop(); buildSporeShop(); buildBuyAmt(); }

  if (S.phase==='singularity'){ pondInit(); onSingularity(); }
  initMobileUpgradeDrawer();
  renderAll();
  requestAnimationFrame(loop);

  setInterval(save,10000);
  addEventListener('visibilitychange',()=>{ if(document.hidden) save(); });
}
boot();
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)){
  addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}),{once:true});
}
</script>
