<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#06121c">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="草履蟲奇點">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./apple-touch-icon.svg">
<title>草履蟲奇點 · Paramecium Singularity</title>
<style>
:root{
  --void:#06121c; --slide:#0a1c29; --cyto:#10303f; --line:#1d4a63;
  --glow:#5ce0c0; --nucleus:#ff6b9d; --amber:#ffc46b;
  --ink:#8fb3c4; --ink-dim:#4f7488;
  --font-display:"Songti TC","Noto Serif CJK TC","Source Han Serif TC",Georgia,serif;
  --font-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html{height:100%;-webkit-text-size-adjust:100%;background:var(--void)}
body{height:100%;min-height:100dvh}
body{background:var(--void);color:var(--ink);font-family:var(--font-display);
  -webkit-font-smoothing:antialiased;overflow:hidden;overscroll-behavior-y:none}
.num{font-family:var(--font-mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
sup{font-size:.62em;vertical-align:super}
button{font-family:inherit;touch-action:manipulation;-webkit-tap-highlight-color:transparent}

header{display:flex;align-items:baseline;gap:1.3rem;flex-wrap:wrap;
  padding:.85rem max(1.4rem,env(safe-area-inset-right)) .85rem max(1.4rem,env(safe-area-inset-left));border-bottom:1px solid var(--line);
  background:linear-gradient(180deg,#0a1a26,#06121c)}
.brand{font-size:.72rem;letter-spacing:.32em;color:var(--ink-dim);text-transform:uppercase;margin-right:auto}
.brand b{color:var(--glow);font-weight:400}
.readout{display:flex;align-items:baseline;gap:.45rem}
.readout .label{font-size:.66rem;letter-spacing:.2em;color:var(--ink-dim)}
.readout .val{font-size:1.45rem;color:var(--amber)}
.readout .val.small{font-size:.98rem;color:var(--glow)}
.readout .unit{font-size:.82rem;color:var(--amber);letter-spacing:.05em}
.badge{font-size:.68rem;color:var(--glow);border:1px solid var(--glow);
  border-radius:2px;padding:.15rem .5rem;letter-spacing:.08em}
#langbtn{background:transparent;border:1px solid var(--line);color:var(--ink);
  border-radius:2px;padding:.2rem .6rem;font-size:.72rem;cursor:pointer;letter-spacing:.1em}
#langbtn:hover{border-color:var(--glow)}

main{display:grid;grid-template-columns:1fr 23rem;height:calc(100dvh - 3.3rem)}
.field{position:relative;display:grid;place-items:center;padding:1.1rem;min-width:0;min-height:0}
.scope-stack{width:min(100%,62vh);max-height:100%;display:flex;flex-direction:column;align-items:stretch;gap:.55rem}
.scope-frame{position:relative;width:100%;aspect-ratio:1;display:grid;place-items:center;min-height:0}
canvas{width:100%;aspect-ratio:1;border-radius:50%;cursor:crosshair;
  box-shadow:0 0 0 1px var(--line),0 0 90px -10px #0d4a58 inset,0 0 60px -30px #5ce0c0;
  touch-action:none}
.scope-meta{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:.42rem .65rem;align-items:center;
  width:100%;padding:.48rem .62rem;border:1px solid rgba(29,74,99,.7);border-radius:2px;
  background:linear-gradient(90deg,rgba(11,34,48,.82),rgba(9,25,39,.72))}
.scope-summary{display:flex;align-items:baseline;gap:.65rem;min-width:0}
/* 紀元恢復為最初的顯微鏡中上讀數；定位基準是圓形視野本身。 */
.scope-frame>.epoch{position:absolute;top:clamp(.65rem,5%,1.5rem);left:50%;z-index:2;
  transform:translateX(-50%);width:min(76%,18rem);text-align:center;pointer-events:none;
  white-space:nowrap;opacity:.9;text-shadow:0 1px 6px var(--void),0 0 12px rgba(6,18,28,.9)}
.scope-frame>.epoch .n,.scope-frame>.epoch .t{display:block;overflow:hidden;text-overflow:ellipsis}
.scope-frame>.epoch .n{font-size:.6rem;letter-spacing:.3em;color:var(--ink-dim);font-family:var(--font-mono)}
.scope-frame>.epoch .t{font-size:1.05rem;color:var(--ink);letter-spacing:.14em;margin-top:.15rem}
.identity{min-width:0}
.identity .sn{font-size:.79rem;color:var(--glow);letter-spacing:.09em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.scope-details{grid-column:1/-1;border-top:1px dashed rgba(79,116,136,.36);padding-top:.34rem;color:var(--ink-dim)}
.scope-details summary{cursor:pointer;font-size:.6rem;letter-spacing:.12em;color:var(--ink-dim);list-style-position:inside}
.scope-details .sm{font-size:.64rem;font-family:var(--font-mono);margin-top:.35rem}
.scope-details .sa{font-size:.62rem;color:var(--amber);letter-spacing:.035em;margin-top:.22rem;line-height:1.45}
.event-banner{display:flex;align-items:center;justify-content:flex-end;gap:.48rem;min-width:0;
  padding:.28rem .52rem;border:1px solid var(--nucleus);border-radius:2px;background:rgba(255,107,157,.08)}
#scope-status-host{display:block;width:100%;padding:.45rem .62rem;border:1px solid rgba(92,224,192,.24);
  border-radius:2px;background:linear-gradient(90deg,rgba(92,224,192,.05),rgba(201,160,255,.025));
  box-shadow:0 12px 28px -24px var(--glow)}
.acquisition-title{display:block;margin-bottom:.2rem;font-family:var(--font-display);font-size:.57rem;
  letter-spacing:.2em;color:var(--glow);text-transform:uppercase}
.sing-stats-title{display:block;margin-bottom:.18rem;font-family:var(--font-display);font-size:.58rem;
  letter-spacing:.22em;color:var(--glow);text-transform:uppercase}
.ev-nm{color:var(--nucleus);font-size:.9rem;letter-spacing:.14em}
.ev-skill{font-size:.61rem;color:var(--amber);letter-spacing:.13em}

aside{min-width:0;border-left:1px solid var(--line);background:var(--slide);
  overflow-y:auto;padding:.9rem max(.9rem,env(safe-area-inset-right)) max(.9rem,env(safe-area-inset-bottom)) max(.9rem,env(safe-area-inset-left));scrollbar-width:thin;scrollbar-color:var(--line) transparent}
aside::-webkit-scrollbar{width:6px}
aside::-webkit-scrollbar-thumb{background:var(--line)}
.mobile-drawer-head,.mobile-category-nav{display:none}
.mobile-drawer-content{display:contents}
.mobile-panel-group{min-width:0}
.sec{font-size:.62rem;letter-spacing:.26em;color:var(--ink-dim);margin:.5rem 0 .6rem}
.layer-h{font-size:.6rem;letter-spacing:.2em;color:var(--glow);opacity:.7;
  margin:.7rem 0 .35rem;padding-bottom:.2rem;border-bottom:1px solid var(--line)}

/* 批量購買 */
.buyamt{display:flex;gap:.3rem;margin-bottom:.5rem}
.buyamt button{flex:1;background:var(--cyto);border:1px solid var(--line);color:var(--ink-dim);
  border-radius:2px;padding:.28rem 0;font-size:.68rem;cursor:pointer;letter-spacing:.05em}
.buyamt button.on{color:var(--glow);border-color:var(--glow)}

.item{width:100%;text-align:left;border:1px solid var(--line);background:var(--cyto);
  color:var(--ink);border-radius:2px;padding:.55rem .65rem;margin-bottom:.38rem;
  display:grid;grid-template-columns:1fr auto;gap:.12rem .5rem;
  cursor:pointer;position:relative;overflow:hidden;transition:border-color .15s,transform .05s}
.item:hover:not(:disabled){border-color:var(--glow)}
.item:active:not(:disabled){transform:translateY(1px)}
.item:disabled{opacity:.4;cursor:not-allowed}
.item:focus-visible{outline:2px solid var(--glow);outline-offset:2px}
.item .nm{font-size:.9rem;letter-spacing:.05em}
.item .qty{font-size:.85rem;color:var(--glow);text-align:right}
.item .pips{font-size:.6rem;color:var(--amber);letter-spacing:.05em}
.item .ds{font-size:.66rem;color:var(--ink-dim)}
.item .stat{font-size:.63rem;color:var(--ink-dim);grid-column:1/-1;font-family:var(--font-mono);opacity:.8}
.item .price{font-size:.8rem;color:var(--amber);grid-column:1/-1;text-align:right;margin-top:-.85rem}
.item .bar{position:absolute;inset:auto 0 0 0;height:2px;background:var(--glow);opacity:.5}

.collapse{width:100%;border:1px solid var(--nucleus);background:transparent;
  color:var(--nucleus);border-radius:2px;padding:.7rem;margin-bottom:.45rem;
  font-size:.85rem;letter-spacing:.12em;cursor:pointer;transition:background .2s}
.collapse:hover:not(:disabled){background:#2a0f1c}
.collapse:disabled{opacity:.4;cursor:not-allowed;border-color:var(--line);color:var(--ink-dim)}
.collapse.singularity-ready{border-color:var(--glow);color:var(--glow);
  box-shadow:0 0 20px -6px var(--glow);animation:pulse 2s infinite}
@keyframes pulse{50%{box-shadow:0 0 30px -4px var(--glow)}}
.note{font-size:.66rem;color:var(--ink-dim);line-height:1.6;margin-bottom:.8rem}

.sitem{width:100%;text-align:left;border:1px solid var(--line);background:var(--cyto);
  color:var(--ink);border-radius:2px;padding:.5rem .6rem;margin-bottom:.35rem;
  display:grid;grid-template-columns:1fr auto;gap:.1rem .5rem;cursor:pointer;transition:border-color .15s}
.sitem:hover:not(:disabled){border-color:var(--nucleus)}
.sitem:disabled{opacity:.45;cursor:not-allowed}
.sitem.owned{opacity:.55;border-style:dashed}
.sitem:focus-visible{outline:2px solid var(--nucleus);outline-offset:2px}
.snm{font-size:.86rem;letter-spacing:.05em}
.sroute{font-size:.6rem;color:var(--ink-dim);text-align:right;letter-spacing:.1em}
.sds{font-size:.64rem;color:var(--ink-dim)}
.sprice{font-size:.78rem;color:var(--nucleus);text-align:right}

.lg{display:flex;gap:.5rem;align-items:baseline;padding:.28rem 0;border-bottom:1px dashed rgba(29,74,99,.4)}
.lg .lgn{font-size:.78rem;color:var(--glow);white-space:nowrap}
.lg .lgd{font-size:.64rem;color:var(--ink-dim)}
.lg.dim{font-size:.66rem;color:var(--ink-dim);border:none}

/* 尺度圖鑑：只使用現有 Canvas 繪圖，不載入外部圖片。 */
.scale-codex-shell{margin-top:1rem;border-top:1px solid var(--line);padding-top:.65rem}
.scale-codex{border:1px solid rgba(92,224,192,.3);background:rgba(6,18,28,.5);border-radius:2px}
.scale-codex>summary{display:grid;grid-template-columns:1fr auto;gap:.4rem;align-items:center;
  padding:.58rem .62rem;cursor:pointer;list-style-position:inside;color:var(--glow);
  font-size:.72rem;letter-spacing:.08em}
.scale-codex-current{font-size:.58rem;color:var(--amber);text-align:right;letter-spacing:.06em;
  max-width:9.5rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.scale-codex-body{padding:.15rem .58rem .65rem}
.scale-codex-intro{font-size:.59rem;line-height:1.55;color:var(--ink-dim);padding:.28rem 0 .52rem}
.scale-codex-visual{position:relative;border:1px solid rgba(92,224,192,.22);
  background:rgba(3,13,21,.72);overflow:hidden}
#scale-codex-preview{display:block;width:100%;height:auto;aspect-ratio:18/11;border-radius:0;
  cursor:default;touch-action:auto;image-rendering:auto;box-shadow:inset 0 0 30px rgba(92,224,192,.08)}
.scale-codex-lock{display:none;position:absolute;inset:0;place-items:center;text-align:center;
  padding:1rem;background:rgba(3,10,17,.84);color:var(--ink-dim);font-size:.67rem;line-height:1.6}
.scale-codex-lock.show{display:grid}
.scale-codex-heading{display:grid;grid-template-columns:auto 1fr;gap:.25rem .55rem;
  align-items:baseline;padding:.58rem 0 .45rem;border-bottom:1px dashed rgba(79,116,136,.45)}
.scale-codex-index{grid-row:1/3;font-family:var(--font-mono);font-size:.58rem;color:var(--ink-dim);
  letter-spacing:.08em}
.scale-codex-name{font-size:1rem;color:var(--glow);letter-spacing:.08em}
.scale-codex-name-en{font-family:var(--font-mono);font-size:.55rem;color:var(--ink-dim);letter-spacing:.04em}
.scale-codex-facts{display:grid;gap:.42rem;padding:.5rem 0}
.scale-codex-fact{border-left:2px solid rgba(92,224,192,.28);padding-left:.48rem}
.scale-codex-label{display:block;font-size:.53rem;color:var(--ink-dim);letter-spacing:.15em;margin-bottom:.13rem}
.scale-codex-value{display:block;font-size:.63rem;color:var(--ink);line-height:1.52}
.scale-codex-fact.analogy{border-left-color:rgba(255,196,107,.4)}
.scale-codex-fact.analogy .scale-codex-value{color:var(--amber)}
.scale-codex-note{font-size:.64rem;color:var(--ink);line-height:1.65;padding:.5rem .55rem;
  border:1px solid rgba(79,116,136,.34);background:rgba(16,48,63,.28)}
.scale-codex-nav{display:grid;grid-template-columns:1fr 1fr;gap:.35rem;margin:.5rem 0}
.scale-codex-nav button{border:1px solid var(--line);background:var(--cyto);color:var(--ink);
  border-radius:2px;padding:.35rem .42rem;font-size:.62rem;cursor:pointer}
.scale-codex-nav button:hover:not(:disabled){border-color:var(--glow);color:var(--glow)}
.scale-codex-nav button:disabled{opacity:.32;cursor:not-allowed}
.scale-codex-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.3rem;
  max-height:12.5rem;overflow-y:auto;padding:.42rem;border:1px solid rgba(29,74,99,.55);
  background:rgba(3,13,21,.45);scrollbar-width:thin;scrollbar-color:var(--line) transparent}
.scale-codex-entry{display:grid;grid-template-columns:1.8rem 1fr;gap:.28rem;align-items:center;
  min-width:0;text-align:left;border:1px solid rgba(29,74,99,.7);background:rgba(16,48,63,.55);
  color:var(--ink);border-radius:2px;padding:.34rem .38rem;cursor:pointer}
.scale-codex-entry .num{font-size:.55rem;color:var(--ink-dim)}
.scale-codex-entry .entry-name{font-size:.61rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.scale-codex-entry:hover:not(:disabled),.scale-codex-entry.on{border-color:var(--glow)}
.scale-codex-entry.on{background:rgba(92,224,192,.09);color:var(--glow)}
.scale-codex-entry.locked{opacity:.38;cursor:not-allowed;border-style:dashed}

/* 成就：跨越凡身與奇點的同一份紀錄，不覆蓋顯微鏡視野。 */
.achievement-shell{margin-top:1rem;border-top:1px solid var(--line);padding-top:.65rem}
.achievement-panel{border:1px solid rgba(201,160,255,.28);background:rgba(6,18,28,.5);border-radius:2px}
.achievement-panel>summary{display:grid;grid-template-columns:1fr auto;gap:.35rem;align-items:center;
  padding:.58rem .62rem;cursor:pointer;list-style-position:inside;color:#d8c4ff;font-size:.72rem;letter-spacing:.08em}
.achievement-title{font-size:.58rem;color:var(--amber);text-align:right;letter-spacing:.06em}
.achievement-body{padding:.2rem .58rem .62rem}
.achievement-integrity{font-size:.59rem;line-height:1.45;color:var(--nucleus);padding:.38rem .45rem;
  margin:.25rem 0 .5rem;border:1px dashed rgba(255,107,157,.4);background:rgba(255,107,157,.045)}
.achievement-note{font-size:.58rem;line-height:1.5;color:var(--ink-dim);padding:.25rem 0 .38rem}
.achievement-group{margin-top:.62rem}.achievement-group:first-child{margin-top:.25rem}
.achievement-group-h{display:flex;justify-content:space-between;gap:.5rem;padding-bottom:.25rem;
  border-bottom:1px dashed rgba(79,116,136,.45);font-size:.58rem;letter-spacing:.16em;color:var(--glow)}
.achievement-card{display:grid;grid-template-columns:1fr auto;gap:.12rem .45rem;padding:.42rem 0;
  border-bottom:1px solid rgba(29,74,99,.3)}
.achievement-card.locked{opacity:.52}.achievement-card.hidden-ach.locked{opacity:.38}
.achievement-name{font-size:.72rem;color:var(--ink);letter-spacing:.035em}
.achievement-card.unlocked .achievement-name{color:var(--amber)}
.achievement-mark{font-family:var(--font-mono);font-size:.56rem;color:var(--ink-dim)}
.achievement-card.unlocked .achievement-mark{color:var(--glow)}
.achievement-desc{grid-column:1/-1;font-size:.59rem;line-height:1.45;color:var(--ink-dim)}
.achievement-milestones{display:flex;flex-wrap:wrap;gap:.28rem;margin-top:.65rem}
.achievement-milestone{display:flex;align-items:center;gap:.28rem;border:1px solid rgba(79,116,136,.42);
  padding:.2rem .3rem;font-size:.54rem;color:var(--ink-dim)}
.achievement-milestone.on{border-color:rgba(255,196,107,.58);color:var(--amber)}
.achievement-dot{width:.58rem;height:.58rem;border-radius:50%;background:var(--reward-color);box-shadow:0 0 7px -1px var(--reward-color)}
.achievement-toast{position:fixed;z-index:130;top:max(4.35rem,calc(env(safe-area-inset-top) + 3.2rem));right:max(1rem,env(safe-area-inset-right));
  width:min(23rem,calc(100vw - 2rem));max-height:0;opacity:0;overflow:hidden;pointer-events:none;
  padding:0 .85rem 0 2.7rem;border:0 solid rgba(255,196,107,.58);border-radius:3px;
  background:linear-gradient(110deg,rgba(23,36,47,.98),rgba(58,37,31,.98));color:var(--amber);
  box-shadow:0 18px 50px rgba(0,0,0,.42),0 0 32px rgba(255,196,107,.08);
  font-size:.68rem;line-height:1.55;transform:translateY(-.7rem);transition:max-height .24s,opacity .24s,padding .24s,border-width .24s,transform .24s}
.achievement-toast::before{content:'✦';position:absolute;left:.9rem;top:50%;transform:translateY(-50%);
  font-size:1.15rem;color:var(--glow);text-shadow:0 0 14px var(--glow)}
.achievement-toast.show{max-height:7rem;opacity:1;padding:.72rem .85rem .72rem 2.7rem;border-width:1px;transform:translateY(0)}

.log{font-size:.66rem;color:var(--ink-dim);line-height:1.52;min-height:1em}
.log div{opacity:.7;margin-bottom:.15rem}
.log div:first-child{opacity:1;color:var(--ink)}
.log b{color:var(--glow);font-weight:400}

.const-row{border:1px solid var(--line);border-radius:2px;padding:.6rem;margin-bottom:.5rem;background:var(--cyto);position:relative}
.const-head{display:flex;align-items:baseline;gap:.5rem}
.const-sym{font-family:var(--font-mono);font-size:1.1rem;color:var(--glow)}
.const-nm{font-size:.85rem;letter-spacing:.05em}
.const-fit{margin-left:auto;font-size:.66rem;letter-spacing:.1em}
.const-sub{font-size:.62rem;color:var(--ink-dim);margin:.25rem 0 .5rem}
input[type=range]{width:100%;accent-color:var(--glow);cursor:pointer}
input[type=range]:disabled{accent-color:var(--ink-dim)}
.const-upgrade{width:100%;margin-top:.42rem;background:rgba(92,224,192,.055);
  border:1px solid var(--line);color:var(--ink-dim);border-radius:2px;
  padding:.34rem .45rem;font-size:.66rem;letter-spacing:.05em;cursor:pointer}
.const-upgrade:hover:not(:disabled){border-color:var(--glow);color:var(--glow)}
.const-upgrade:disabled{opacity:.4;cursor:not-allowed}
.sing-stats{font-size:.72rem;color:var(--ink);line-height:1.8;margin:.4rem 0 .6rem}
.avpick{display:flex;gap:.4rem;margin-bottom:.6rem}
.avpick select{flex:1;background:var(--cyto);color:var(--ink);border:1px solid var(--line);
  border-radius:2px;padding:.3rem;font-size:.72rem;font-family:inherit}
.avpick button{background:transparent;border:1px solid var(--glow);color:var(--glow);
  border-radius:2px;padding:.3rem .6rem;font-size:.72rem;cursor:pointer;white-space:nowrap}
.avpick button:disabled{opacity:.4;cursor:not-allowed;border-color:var(--line);color:var(--ink-dim)}
.hero-card,.morph-card{border:1px solid rgba(92,224,192,.34);background:linear-gradient(135deg,rgba(92,224,192,.07),rgba(201,160,255,.035));
  border-radius:2px;padding:.7rem;margin-bottom:.65rem}
.hero-head{display:flex;align-items:baseline;gap:.55rem;margin-bottom:.35rem}
.hero-name{font-size:1rem;color:var(--glow);letter-spacing:.08em}
.hero-level{margin-left:auto;font-size:.65rem;color:var(--ink-dim);font-family:var(--font-mono)}
.hero-desc,.morph-note{font-size:.66rem;color:var(--ink-dim);line-height:1.6;margin:.25rem 0 .55rem}
.morph-preview-shell{position:relative;display:grid;grid-template-columns:8rem 1fr;gap:.6rem;align-items:center;
  border:1px solid rgba(92,224,192,.2);background:rgba(4,16,25,.62);padding:.48rem;margin:.35rem 0 .65rem}
#morph-preview{width:8rem;height:5.4rem;aspect-ratio:auto;border-radius:2px;cursor:default;touch-action:auto;
  box-shadow:inset 0 0 24px rgba(92,224,192,.09)}
.morph-preview-copy{min-width:0}
.morph-preview-name{font-size:.82rem;color:var(--glow);letter-spacing:.08em;margin-bottom:.3rem}
.morph-legend{display:flex;flex-wrap:wrap;gap:.24rem}
.morph-chip{border:1px solid rgba(79,116,136,.55);background:rgba(16,48,63,.62);padding:.15rem .28rem;
  font-size:.54rem;color:var(--ink-dim);white-space:nowrap}
.morph-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.45rem}
.morph-field{display:grid;gap:.2rem;font-size:.61rem;color:var(--ink-dim)}
.morph-field.wide{grid-column:1/-1}

function renderSing(){
  if (S.phase!=='singularity') return;
  const stageIndex=S.universeStage||0;
  const u=currentUniverseStage();
  const next=nextUniverseStage();
  const hs=heroStage(), hero=STAGES[hs];
  const hn=$('hero-name'), hl=$('hero-level'), hd=$('hero-desc'), hb=$('hero-upgrade');

      ? 'The hero cannot precede its Universe. Advance fundamental matter, then complete the life-genesis chain from interstellar dust to Paramecium.'

    : (isEn()
      ? `This first paramecium is your life anchor in the new Universe. It is not literally evolving into every later object: Genesis Matter recalls, one by one, the scale-forms you crossed before the singularity. It hunts automatically; click space to guide it or click food to claim prey. Current scale-memory: ${hero.noteEn}`
      : `這隻第一草履蟲是你在新宇宙中的生命錨點。後續並非把牠字面演化成每一種天體，而是用創生質依序喚回你在奇點前走過的「尺度形態記憶」。牠會自行捕食；點擊宇宙可指引移動，點擊食物可指定獵物。目前的尺度記憶：${hero.note}`);
  if (hb){

      hb.textContent=isEn()?'Complete life genesis first':'先孕生第一隻草履蟲'; hb.disabled=true;
    } else if (hs>=STAGES.length-1){ hb.textContent=isEn()?'All forms unlocked':'全部形態與組件已解鎖'; hb.disabled=true; }

  const mn=$('matter-name'), ml=$('matter-level'), md=$('matter-desc');

  if (md) md.textContent=isEn()?u.dsEn:u.ds;

  const gs=genesisStage(), ng=nextGenesisStep(), currentFitness=fitness();

  if (gl) gl.textContent=isEn()?`MILESTONE ${gs+1}/${LIFE_GENESIS.length}`:`里程碑 ${gs+1}/${LIFE_GENESIS.length}`;

  for (let i=0;i<LIFE_GENESIS.length;i++){

/* ── 日誌 / 事件 ── */
function renderLog(){
  const title=$('acquisition-status-title');
  if (title) title.textContent=isEn()?'Acquisition Status':'獲取狀態';
  const log=$('log');
  const hideMeta=s=>String(s)
    .replace(/（(?:真實機制|真實結構|真實尺度)／神話化視覺）/g,'')
    .replace(/\s*[（(](?:real mechanism|real structure|real scale)\s*\/\s*mythic visualization[）)]/gi,'');
  if (log) log.innerHTML=logs.slice(0,3).map(l=>`<div>${hideMeta(l)}</div>`).join('');
}
function renderEvent(){
  const el=$('event-banner');
  if (activeEvent){
    const e=EVENTS[activeEvent.id];
    el.style.display='';
    el.innerHTML=`<span class="ev-nm">${tr(e,'name')}</span>${activeEvent.persistent
      ? `<span class="ev-skill">${isEn()?'STAGE POWER':'本階權能'}</span>`
      : `<span class="ev-skill num">${Math.max(0,activeEvent.remain).toFixed(0)}s</span>`}`;
  } else el.style.display='none';
}

/* ── 躍遷橫幅 ── */
function showBanner(kind, stageIdx, onDone){
  if (document.getElementById('banner')) document.getElementById('banner').remove();
  const st=STAGES[stageIdx];
  const prev=STAGES[Math.max(stageIdx-1,0)];
  const isSing=kind==='singularity';
  const verbTxt = (kind==='ending'||isSing) ? '' : ui(kind);
  const nameTxt = isSing
    ? (isEn()?'You become the singularity. “Outside” loses all meaning—nothing contains you, and no scale is greater than you.':'你成為奇點。「外面」二字，自此失去意義——沒有容你之物，也沒有大於你的尺度。')
    : kind==='ending'
    ? `「${isEn()?HUAYAN_UNITS[6].en:HUAYAN_UNITS[6].name}」`
    : tr(st,'name');
  const subTxt = isSing ? '' : kind==='ending'
    ? (isEn()?'There is no numeral beyond this one.':'沒有比這更大的數了。')
    : `${isEn()?'Scale tier':'尺度位階'} ${stageIdx+1}/${STAGES.length} · ${stageMeasure(st)} ${tr(st,'mass')}`;
  const noteTxt = isSing ? '' : kind==='ending'
    ? (isEn()?'And you keep swimming.':'而你，還在游。')
    : tr(st,'note');
  const analogyTxt=(isSing||kind==='ending')?'':stageAnalogy(stageIdx);

  const b=document.createElement('div');
  b.id='banner';
  b.className='banner '+kind+(matchMedia('(prefers-reduced-motion: reduce)').matches?' rm':'');
  b.innerHTML=`
    <div class="b-ghost">${kind==='ending'||isSing?'':tr(prev,'name')}</div>
    <div class="b-verb">${verbTxt}</div>
    <div class="b-name">${nameTxt}</div>
    <div class="b-sub">${subTxt}</div>
    <div class="b-note">${noteTxt}</div>
    <div class="b-analogy">${analogyTxt}</div>`;
  let finished=false;
  const finish=()=>{
    if (finished) return;
    finished=true;
    if (b.parentNode) b.remove();
    if (typeof onDone==='function') onDone();
  };
  b.onclick=finish;
  document.body.appendChild(b);
  const bannerDuration=isSing?3200:kind==='ending'?5200:3000;
  setTimeout(finish, bannerDuration);
}

  $('langbtn').textContent = isEn()?'中':'EN';

  say(isEn()?'English interface enabled. New acquisition messages will appear in English.':'已切換為繁體中文；新的獲取訊息將以中文顯示。');

  renderStaticLanguage();

function hidePanels(){

function onSingularity(){

  buildSingularity();
  const host=$('scope-status-host'); if (host) host.style.display='';

/* ── 總渲染 ── */
function renderAll(){
  renderStaticLanguage();
  renderStats();
  renderScaleCodex();
  renderAchievements();
  if (S.phase==='mortal'){
    $('mortal-view').style.display='';
    $('sing-view').style.display='none';
    const host=$('scope-status-host'); if (host) host.style.display='';
    renderShop(); renderSporeShop(); renderCollapse(); renderLegacy();
  } else if (!cine){
    renderSing();
  }
  renderLog(); renderEvent();
  renderMobileUpgradeDrawer();
}

<script>
/* ═══ 主循環 ═══ */
window.__speed = 1;

function fillDebugSelects(){
  const ss=document.getElementById('dbg-stage');
  STAGES.forEach((s,i)=>{ const o=document.createElement('option');
    o.textContent=`${i+1}. ${s.name}`; ss.appendChild(o); });
  const es=document.getElementById('dbg-event');
  Object.entries(EVENTS).forEach(([id,e])=>{ const o=document.createElement('option');
    o.value=id; o.textContent=e.name; es.appendChild(o); });
}

let last=performance.now(), statAcc=0, dbgAcc=0;
function loop(now){
  const raw=Math.min((now-last)/1000,.25);
  last=now;
  const spd=window.__speed||1;
  const dt=raw*spd;

  if (!cine){
    if (S.phase==='mortal'){
      const g=rate()*dt;
      S.bio+=g;S.earned+=g;S.lifetime+=g;
      foodTimer+=dt;
      if (foodTimer>spawnInterval()){ foodTimer=0; spawnFood(); }
      updateFood(dt);
      tickEvent(dt);
      tickMerge(dt);
      if (has('automolt') && canCollapse()) doCollapse();
    } else {
      tickSing(dt);
    }
  }

  draw(now, raw*spd);
  if (S.phase==='singularity' && genesisComplete()){
    morphPreviewAcc+=raw;
    if (morphPreviewAcc>(reduce?.28:.09)){
      drawMorphPreview(now);
      morphPreviewAcc=0;
    }
  } else morphPreviewAcc=0;
  const codexPanel=$('scale-codex');
  if (codexPanel&&codexPanel.open){
    scaleCodexPreviewAcc+=raw;
    if (scaleCodexPreviewAcc>(reduce?.4:.12)){
      drawScaleCodexPreview(now);
      scaleCodexPreviewAcc=0;
    }
  } else scaleCodexPreviewAcc=0;

  statAcc+=raw;
  if (statAcc>.12){
    renderStats();
    if (!cine){
      if (S.phase==='mortal'){ renderShop(); renderCollapse(); }
      else renderSing();
    }
    renderEvent();
    renderMobileUpgradeDrawer();
    statAcc=0;
  }
  dbgAcc+=raw;
  if (dbgAcc>.5){ const ss=document.getElementById('dbg-stage'); if(ss) ss.selectedIndex=S.stage; dbgAcc=0; }

  requestAnimationFrame(loop);
}

async function boot(){
  S=freshState();
  initCanvas(document.getElementById('c'));
  buildShop(); buildSporeShop(); buildBuyAmt();
  fillDebugSelects();

  const loaded=await load();
  if (!loaded){ logs=[]; say('一隻草履蟲在原始湯裡睜開眼。點擊視野開始攝食。'); }
  else if (isEn() && logs.some(line=>/[\u3400-\u9fff]/.test(String(line)))) logs=['Save restored. New acquisition messages will appear in English.'];
  else if (!isEn() && logs.some(line=>/[A-Za-z]{4}/.test(String(line)))) logs=['存檔已恢復；新的獲取訊息將以中文顯示。'];
  buildScaleCodex();
  ensureStageEventSkill();
  document.getElementById('langbtn').textContent = isEn()?'中':'EN';
  if (isEn()){ buildShop(); buildSporeShop(); buildBuyAmt(); }

  if (S.phase==='singularity'){ pondInit(); onSingularity(); }
  initMobileUpgradeDrawer();
  renderAll();
  requestAnimationFrame(loop);

  setInterval(save,10000);
  addEventListener('visibilitychange',()=>{ if(document.hidden) save(); });
}
boot();
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)){
  addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}),{once:true});
}
</script>
